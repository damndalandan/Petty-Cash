<script>
// =============================================
// STATE & UTILS
// =============================================
const state = {
  currentDate    : '',
  currentPage    : 'dashboard',
  entries        : [],
  denominations  : [],
  summary        : null,
  entryTab       : 'all',
  denomTab       : 'START',
  editHasReceipt : false,
  loading        : false,
  userRole       : null,   // 'Admin' | 'Auditor' | 'Cashier'
  userName       : null,
  userEmail      : null
};

// Role helpers — use these everywhere instead of hardcoding string checks
function isAdmin()   { return state.userRole === 'Admin'; }
function isAuditor() { return state.userRole === 'Auditor' || state.userRole === 'Admin'; }
function isCashier() { return state.userRole === 'Cashier' || state.userRole === 'Admin'; }

const BILLS = [1000, 500, 200, 100, 50, 20, 10, 5, 1, 0.25];

function fmt(n) {
  const num = parseFloat(n) || 0;
  return '₱' + num.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  const bg = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-yellow-500';
  el.className = 'toast-anim flex items-center gap-3 px-4 py-3 text-white rounded shadow-lg ' + bg + ' max-w-sm';
  el.innerHTML = '<span>' + (type === 'success' ? '✓' : '⚠️') + '</span><span class="text-sm font-medium">' + msg + '</span>';
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(-10px)';
    el.style.transition = 'all 0.3s';
    setTimeout(() => el.remove(), 300);
  }, 3500);
}

// Disable a button and show a spinner while an async operation runs.
// Call btnLoad(btn, true) before the await, btnLoad(btn, false) after.
function btnLoad(btn, loading) {
  if (!btn) return;
  if (loading) {
    btn._origHtml = btn.innerHTML;
    btn.disabled  = true;
    btn.innerHTML = '<span style="display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,0.35);border-top-color:white;border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:6px;"></span>'
                  + (btn._origHtml || '');
  } else {
    btn.disabled = false;
    if (btn._origHtml !== undefined) btn.innerHTML = btn._origHtml;
  }
}

// =============================================
// RECEIPT TYPE — the custodian's tag on every expense line
// =============================================
// Mirrors RECEIPT_TYPES / RECEIPT_TYPE_LABELS in Code.js. The tag drives the
// replenishment journal, so the same four choices must appear on every surface
// that records spend: liquidation, PCR settlement, and direct entry.
const RECEIPT_TYPE_OPTIONS = [
  { value: 'VAT',     label: 'VAT Receipt',                   short: 'VAT',      needsReceipt: true  },
  { value: 'NON_VAT', label: 'Non-VAT Receipt',               short: 'Non-VAT',  needsReceipt: true  },
  { value: 'ACK',     label: 'Acknowledgement Receipt Only',  short: 'Ack. Rcpt',needsReceipt: false },
  { value: 'NONE',    label: 'No Receipt',                    short: 'No Rcpt',  needsReceipt: false }
];

// Badge styling per tag — reused by the entry list, the journal report and the
// settlement panels so a tag reads the same colour everywhere.
const RECEIPT_TYPE_BADGE = {
  VAT     : 'bg-emerald-100 text-emerald-700',
  NON_VAT : 'bg-sky-100 text-sky-700',
  ACK     : 'bg-amber-100 text-amber-700',
  NONE    : 'bg-slate-200 text-slate-600',
  UNTAGGED: 'bg-rose-100 text-rose-700'
};

function receiptTypeLabel(code) {
  const o = RECEIPT_TYPE_OPTIONS.find(x => x.value === code);
  return o ? o.label : 'Untagged';
}

function receiptTypeShort(code) {
  const o = RECEIPT_TYPE_OPTIONS.find(x => x.value === code);
  return o ? o.short : 'Untagged';
}

// True when the tag means "an official receipt is on file", i.e. a BIR receipt
// record must be attached. Acknowledgement receipts are NOT official receipts —
// they stay Has_Receipt = NO so the BIR purchases journal is unaffected.
function receiptTypeNeedsReceipt(code) {
  const o = RECEIPT_TYPE_OPTIONS.find(x => x.value === code);
  return !!(o && o.needsReceipt);
}

function receiptTypeBadgeHtml(code, extraCls) {
  const cls = RECEIPT_TYPE_BADGE[code] || RECEIPT_TYPE_BADGE.UNTAGGED;
  return `<span class="px-1.5 py-0.5 text-[9px] font-bold rounded uppercase tracking-wide ${cls} ${extraCls || ''}">${receiptTypeShort(code)}</span>`;
}

// Renders the <option> list. `selected` may be empty — the placeholder then
// stays chosen, which is what forces the custodian to make a deliberate call
// instead of inheriting a default.
function receiptTypeOptionsHtml(selected) {
  const placeholder = `<option value="" ${!selected ? 'selected' : ''}>— Select receipt type —</option>`;
  return placeholder + RECEIPT_TYPE_OPTIONS.map(o =>
    `<option value="${o.value}" ${selected === o.value ? 'selected' : ''}>${o.label}</option>`
  ).join('');
}

// Unified server call wrapper — google.script.run supports one argument only
function callServer(fn, data) {
  return new Promise((resolve) => {
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(e => resolve({ success: false, message: e.message }));
    if (data !== undefined) {
      runner[fn](data);
    } else {
      runner[fn]();
    }
  });
}

// =============================================
// INIT
// =============================================
document.addEventListener('DOMContentLoaded', async () => {
  const today     = new Date();
  const formatted = today.toISOString().split('T')[0];
  state.currentDate = formatted;

  const dateInput = document.getElementById('globalDate');
  if (dateInput) dateInput.value = formatted;

  updateDateLabel();

  // ── Hide stat grid immediately — role unknown yet, prevent flash for auditors ──
  const grid = document.getElementById('dashStatsGrid');
  if (grid) {
    grid.classList.add('hidden'); // hide until role confirmed
    grid.classList.remove('lg:grid-cols-6');
    grid.classList.add('lg:grid-cols-4');
    grid.querySelectorAll(':scope > div').forEach(card => {
      card.style.minHeight = '100px';
      card.classList.add('flex', 'flex-col', 'justify-between');
    });
  }

  // Navigate to dashboard immediately so layout is visible during role load
  navigate('dashboard');

  // Load role — role-specific UI (admin section, nav items) applied after
  const roleRes = await callServer('getUserRole');
  if (roleRes.success) {
    state.userRole  = roleRes.role;
    state.userName  = roleRes.name;
    state.userEmail = roleRes.email;
  }

  applyRoleUI();

  // ── Reveal stat grid only for non-auditors (Cashier / Admin) ──
  if (grid && !(isAuditor() && !isAdmin())) {
    grid.classList.remove('hidden');
  }
  buildDenomGrid();
  applyDenomCardVisibility();
  loadCategories();
  loadEmployees();
  loadDayData();

  // Hide cashier stat cards for pure auditors — not relevant to their workflow
  if (isAuditor() && !isAdmin()) {
    document.getElementById('dashStatsGrid')?.classList.add('hidden');
    // Load auditor metrics immediately on first paint instead of waiting for loadDayData
    loadAuditorMetrics();
  }

  // Admin metrics also kicked off early
  if (isAdmin()) {
    initAdminMetricYears();
    loadAdminMetrics();
  }

  updateReceiptIndicator();
});

function applyRoleUI() {
  const role = state.userRole;
  
  // Update role badge, name, email
  const roleEl = document.getElementById('user-role-badge');
  if (roleEl) {
    roleEl.textContent = role || 'Unknown';
    roleEl.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full ' + (
      isAdmin()   ? 'bg-purple-100 text-purple-700' :
      isAuditor() ? 'bg-blue-100 text-blue-700' :
                    'bg-green-100 text-green-700'
    );
  }
  if (state.userName)  document.getElementById('user-name').textContent  = state.userName;
  if (state.userEmail) document.getElementById('user-email').textContent = state.userEmail;

  // ── WHITELIST SHOWING LOGIC ──
  // Show navigation items based on role. (Everything started with .hidden)
  
  const show = (id) => document.getElementById(id)?.classList.remove('hidden');

  // UNIVERSAL / COMMON
  show('nav-report');
  show('nav-summaryreport');
  show('nav-advances');

  if (isAdmin()) {
    // Admin sees everything except data-entry tasks
    ['nav-requests', 'nav-personalexpenses', 'nav-denominations', 'nav-replenishment', 'nav-replenishrequests', 'nav-filing', 'nav-replenishreport', 'nav-auditreview', 'nav-auditlog'].forEach(show);
    show('admin-section');
    show('pcr-form-section');
    // Only an Admin may tag a request personal (the server enforces this too).
    show('pcr-personal-wrap');
  } else if (state.userRole === 'Auditor') {
    // Auditor sees review tools
    ['nav-requests', 'nav-replenishrequests', 'nav-auditreview', 'nav-auditlog'].forEach(show);
    show('pcr-auditor-notice');
    show('rpl-auditor-notice');
  } else if (state.userRole === 'Cashier') {
    // Cashier sees operational tools
    ['nav-requests', 'nav-entries', 'nav-denominations', 'nav-replenishment', 'nav-replenishrequests', 'nav-filing', 'nav-replenishreport'].forEach(show);
    show('pcr-form-section');
  }
}

async function loadCategories() {
  const res = await callServer('getCategories');
  const cats = (res.success && res.data && res.data.length) ? res.data : [
    'Office Supplies','Transportation','Meals & Entertainment',
    'Utilities','Repairs & Maintenance','Postage & Courier','Miscellaneous'
  ];

  // Store globally for use in dynamic dropdowns (liquidation entries etc.)
  window.appCategories = cats;

  // Populate all static category dropdowns
  ['entryCategory', 'editCategory'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = cats.map(c => {
      const name = c.name || c;
      const desc = c.description || '';
      return `<option value="${name}" data-description="${desc}">${name}</option>`;
    }).join('');
  });
}

async function loadEmployees() {
  const res = await callServer('getEmployees');
  const employees = (res.success && res.data && res.data.length) ? res.data : [];
  window.appEmployees = employees;

  // Populate the datalist
  const datalist = document.getElementById('employeeList');
  if (!datalist) return;
  datalist.innerHTML = employees.map(name => `<option value="${name}">`).join('');
}

function updateDateLabel() {
  const d     = new Date(state.currentDate + 'T00:00:00');
  const label = d.toLocaleDateString('en-PH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  ['dash-date-label','entries-date-label'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = label;
  });
}

// =============================================
// NAVIGATION
// =============================================
function navigate(page) {
  state.currentPage = page;

  document.querySelectorAll('.page-view').forEach(v => v.classList.add('hidden'));
  const pageEl = document.getElementById('page-' + page);
  if (pageEl) pageEl.classList.remove('hidden');

  document.querySelectorAll('.nav-item').forEach(n => {
    if (n.dataset.page === page) {
      n.classList.add('bg-gradient-to-r', 'from-indigo-50', 'to-purple-50/50', 'text-indigo-700', 'shadow-sm', 'border', 'border-indigo-100/50');
      n.classList.remove('text-slate-600','hover:bg-slate-100/50', 'hover:text-slate-900', 'border-transparent');
    } else {
      n.classList.remove('bg-gradient-to-r', 'from-indigo-50', 'to-purple-50/50', 'text-indigo-700', 'shadow-sm', 'border', 'border-indigo-100/50');
      n.classList.add('text-slate-600','hover:bg-slate-100/50', 'hover:text-slate-900', 'border', 'border-transparent');
    }
  });

  if (page === 'entries')       loadEntries();
  if (page === 'denominations') loadDenominations();
  if (page === 'report')        initReportPage();
  if (page === 'dashboard')     loadDayData();
  if (page === 'requests')      loadRequests();
  if (page === 'personalexpenses') loadPersonalExpenses();
  if (page === 'advances')      loadAdvances();
  if (page === 'replenishment') loadReplenishments();
  if (page === 'replenishrequests') loadReplenishRequests();
  if (page === 'filing')        loadFilingPage();
  if (page === 'auditlog')       loadAuditLog();
  if (page === 'auditreview')    loadAuditReviewPage();
  if (page === 'summaryreport')  initSummaryReport();
  if (page === 'replenishreport') loadReplenishReport();

  // Close mobile sidebar and scroll to top
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebarOverlay');
  if (sb) sb.classList.add('-translate-x-full');
  if (ov) ov.classList.add('hidden');
  document.body.style.overflow = '';

  // Scroll main content to top on mobile navigation
  const main = document.querySelector('main');
  if (main) main.scrollTop = 0;
}

function onDateChange() {
  state.currentDate = document.getElementById('globalDate').value;
  updateDateLabel();
  loadDayData();
  if (state.currentPage !== 'dashboard') navigate(state.currentPage);
}

// =============================================
// ADMIN: DATABASE LINK
// =============================================
function openDatabaseModal(btn) {
  if (!isAdmin()) return;
  btnLoad(btn, true);
  callServer('getDatabaseUrl').then(res => {
    btnLoad(btn, false);
    if (!res.success || !res.url) {
      toast(res.message || 'Unable to load the database link', 'error');
      return;
    }
    document.getElementById('databaseUrlInput').value = res.url;
    document.getElementById('databaseOpenLink').href  = res.url;
    document.getElementById('databaseModal').classList.remove('hidden');
  });
}

function closeDatabaseModal() {
  document.getElementById('databaseModal').classList.add('hidden');
}

function copyDatabaseLink(btn) {
  const input = document.getElementById('databaseUrlInput');
  if (!input || !input.value) return;
  const done = () => {
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(input.value).then(done).catch(() => {
      input.select(); document.execCommand('copy'); done();
    });
  } else {
    input.select(); document.execCommand('copy'); done();
  }
}
</script>
