<script>
// =============================================
// REPORT
// =============================================

let currentReportMonthData = { entries: [], summaries: [] };
let selectedReportDate = null;
let currentDetailFilter = 'all';

function initReportPage() {
  populateReportSelectors();
  loadReportsList();
}

function populateReportSelectors() {
  const m = document.getElementById('reportMonth');
  const y = document.getElementById('reportYear');
  if (m.options.length > 0) return; // already populated

  const months = ["January","February","March","April","May","June",
                  "July","August","September","October","November","December"];
  months.forEach((name, i) => m.add(new Option(name, i)));

  const currYear = new Date().getFullYear();
  for (let i = currYear; i >= 2025; i--) y.add(new Option(i, i));

  const now = new Date();
  m.value = now.getMonth();
  y.value = now.getFullYear();
}

async function loadReportsList() {
  resetReportDetailView();

  const m    = parseInt(document.getElementById('reportMonth').value);
  const y    = parseInt(document.getElementById('reportYear').value);
  const from = new Date(y, m, 1);
  const to   = new Date(y, m + 1, 0);

  const fromStr = from.toISOString().split('T')[0];
  const toStr   = to.toISOString().split('T')[0];

  const listEl = document.getElementById('reportsList');
  listEl.innerHTML = '<div class="text-center py-10"><div class="loader inline-block"></div></div>';

  const res = await callServer('generateReportData', { from: fromStr, to: toStr });

  if (res.success) {
    currentReportMonthData = res.data;
    renderReportsList(y, m);
  } else {
    listEl.innerHTML = '<div class="text-center py-10 text-red-400">Error loading data</div>';
  }
}

function renderReportsList(year, month) {
  const listEl     = document.getElementById('reportsList');
  const daysInMonth= new Date(year, month + 1, 0).getDate();
  const today      = new Date(); today.setHours(0, 0, 0, 0);

  // Index summaries by date string
  const sumMap = {};
  (currentReportMonthData.summaries || []).forEach(s => { sumMap[s.date] = s; });

  // Index entry totals by date string
  const entMap = {};
  (currentReportMonthData.entries || []).forEach(e => {
    if (e.type === 'EXPENSE') { // only real expenses for the list display
      entMap[e.date] = (entMap[e.date] || 0) + (parseFloat(e.amount) || 0);
    }
  });

  let html = '';

  for (let day = daysInMonth; day >= 1; day--) {
    // FIX: append T00:00:00 so Date() parses in LOCAL time, not UTC
    // Without this, "2026-01-15" parsed as UTC midnight can show as Jan 14 in UTC+8
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const dateObj = new Date(dateStr + 'T00:00:00');
    if (dateObj > today) continue;

    const summary    = sumMap[dateStr];
    const entryTotal = entMap[dateStr] || 0;
    const dayName    = dateObj.toLocaleDateString('en-US', { weekday: 'short' });

    const totalExp = summary ? summary.expenses : entryTotal;
    const variance = summary ? (summary.variance || 0) : 0;

    let statusDot   = 'bg-gray-300';
    let statusText  = 'No Data';
    let statusClass = 'text-gray-400';
    let expText     = 'No petty cash audit';

    if (summary || entryTotal > 0) {
      expText = 'Exp: ' + fmt(totalExp);
      if (summary) {
        if (summary.status === 'OPEN' || summary.status === 'PENDING_AUDIT') {
          statusDot   = 'bg-amber-400';
          statusText  = summary.status === 'PENDING_AUDIT' ? 'Pending' : 'Open';
          statusClass = 'text-amber-500';
        } else if (Math.abs(variance) > 1.00) {
          statusDot   = 'bg-red-500';
          statusText  = 'Variance';
          statusClass = 'text-red-500 font-bold';
        } else {
          statusDot   = 'bg-green-500';
          statusText  = 'Balanced';
          statusClass = 'text-green-600';
        }
      } else {
        statusDot   = 'bg-blue-300';
        statusText  = 'Open';
        statusClass = 'text-blue-500';
      }
    }

    html += `
      <div onclick="showReportDetail('${dateStr}')" class="group flex items-center gap-3 p-3 hover:bg-white cursor-pointer rounded transition border border-transparent hover:border-gray-200 hover:shadow-sm border-b border-gray-100 last:border-0">
        <div class="flex flex-col items-center min-w-[3rem]">
          <span class="text-xs font-bold text-gray-400 uppercase">${dayName}</span>
          <span class="text-lg font-bold text-gray-700 leading-none">${day}</span>
        </div>
        <div class="h-8 w-0.5 bg-gray-200 mx-1"></div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <div class="w-1.5 h-1.5 rounded-full ${statusDot}"></div>
            <h4 class="text-sm font-semibold text-gray-800 truncate">${dateObj.toLocaleDateString('en-US', {month:'short', day:'numeric'})}</h4>
          </div>
          <p class="text-xs text-gray-500 font-mono">${expText}</p>
        </div>
        <div class="text-[10px] uppercase ${statusClass}">${statusText}</div>
      </div>`;
  }

  if (!html) {
    html = '<div class="text-center py-10 text-gray-400 text-sm">No records found for this month</div>';
  }
  listEl.innerHTML = html;
}

function showReportDetail(dateStr) {
  selectedReportDate = dateStr;
  // FIX: use T00:00:00 for local-time parsing
  const dateObj = new Date(dateStr + 'T00:00:00');

  document.getElementById('reportDetailEmpty').classList.add('hidden');
  document.getElementById('reportDetailContent').classList.remove('hidden');
  document.getElementById('detailDate').textContent = dateObj.toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  const summary = (currentReportMonthData.summaries || []).find(s => s.date === dateStr);

  // Audit status badge
  const badgeEl = document.getElementById('reportAuditStatusBadge');
  if (badgeEl) {
    const auditStatusMap = {
      OPEN         : { label: '⚪ Open',          cls: 'bg-gray-100 text-gray-600'   },
      PENDING_AUDIT: { label: '🟡 Pending Audit', cls: 'bg-amber-100 text-amber-700' },
      FLAGGED      : { label: '🔴 Flagged',        cls: 'bg-red-100 text-red-700'     },
      CLOSED       : { label: '🟢 Closed',         cls: 'bg-green-100 text-green-700' },
    };
    const auditStatus = summary?.status || null;
    if (auditStatus && auditStatusMap[auditStatus]) {
      const info = auditStatusMap[auditStatus];
      badgeEl.textContent = info.label;
      badgeEl.className   = `text-[10px] font-bold px-2.5 py-1 rounded-full ${info.cls}`;
      badgeEl.classList.remove('hidden');
    } else {
      badgeEl.classList.add('hidden');
    }
  }

  if (summary) {
    document.getElementById('d-opening').textContent  = fmt(summary.opening);
    document.getElementById('d-expenses').textContent = fmt(summary.expenses);
    document.getElementById('d-closing').textContent  = fmt(summary.closing);

    // Net cash movement: on closed days derive it from the audited figures
    // (closing − variance = expected, so opening − expected = net out);
    // on open days compute it live from the day's entries.
    const isClosedDay = summary.status && summary.status !== 'OPEN';
    const net = isClosedDay
      ? (parseFloat(summary.opening) || 0) - ((parseFloat(summary.closing) || 0) - (parseFloat(summary.variance) || 0))
      : computeNetCashMovement(dateStr);
    const netEl    = document.getElementById('d-net');
    const netLabel = document.getElementById('d-net-label');
    if (net >= -0.005) {
      netLabel.textContent = 'Net Cash Out' + (isClosedDay ? '' : ' (so far)');
      netEl.textContent = fmt(net);
      netEl.className = 'font-mono font-bold text-orange-600 text-sm';
    } else {
      netLabel.textContent = 'Net Cash In' + (isClosedDay ? '' : ' (so far)');
      netEl.textContent = fmt(-net);
      netEl.className = 'font-mono font-bold text-teal-600 text-sm';
    }

    const v   = summary.variance || 0;
    const elV = document.getElementById('d-variance');
    elV.textContent = fmt(v);
    elV.className   = 'text-xl font-mono font-bold ' +
      (v < -0.01 ? 'text-red-600' : v > 0.01 ? 'text-blue-600' : 'text-gray-400');
  } else {
    ['d-opening','d-expenses','d-closing','d-variance','d-net'].forEach(id => {
      document.getElementById(id).textContent = '---';
    });
  }

  setDetailFilter('all');
}

function setDetailFilter(filter) {
  currentDetailFilter = filter;
  ['all','receipt','noreceipt','advance','over','replenish'].forEach(t => {
    const el = document.getElementById('tab-' + t);
    if (!el) return;
    el.className = t === filter
      ? "px-4 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600 transition"
      : "px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition";
  });
  renderDetailList();
}

function resetReportDetailView() {
  selectedReportDate = null;
  currentDetailFilter = 'all';

  // Hide detail panel and show empty state
  document.getElementById('reportDetailContent').classList.add('hidden');
  document.getElementById('reportDetailEmpty').classList.remove('hidden');

  // Clear all summary fields so stale data never shows on re-open
  ['d-opening','d-expenses','d-closing','d-variance','d-net'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = '---';
      el.className = el.className.replace(/text-(red|blue|green|gray|orange|teal)-\d+/g, 'text-gray-400');
    }
  });

  // Clear detail table body
  const tbody = document.getElementById('detailListBody');
  if (tbody) tbody.innerHTML = '';

  // Reset displayed total + footer label/note
  const totalEl = document.getElementById('detailDisplayedTotal');
  if (totalEl) totalEl.textContent = '₱0.00';
  const noteEl = document.getElementById('detailPendingNote');
  if (noteEl) noteEl.classList.add('hidden');
  const labelEl = document.getElementById('detailTotalLabel');
  if (labelEl) labelEl.textContent = 'Expenses Total';

  // Reset detail date label
  const dateEl = document.getElementById('detailDate');
  if (dateEl) dateEl.textContent = '—';

  // Reset tab highlight back to 'all'
  ['all','receipt','noreceipt','advance','over','replenish'].forEach(t => {
    const el = document.getElementById('tab-' + t);
    if (!el) return;
    el.className = t === 'all'
      ? 'px-4 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600 transition whitespace-nowrap'
      : 'px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition whitespace-nowrap';
  });
}

// Net cash that physically moved on a date, from the month's entries.
// Mirrors the server's expected-closing formula (recalculateDailySummary):
// out = plain expenses + advances/releases + overspend reimbursements;
// in  = returns + overages + replenishments. Detail rows (PCR_DETAIL /
// LIQ_DETAIL) document an already-released advance and move no cash.
function computeNetCashMovement(dateStr) {
  const OUT = ['EXPENSE', 'CASH_ADVANCE', 'PCR_ADVANCE', 'CASH_ADVANCE_REIMBURSEMENT'];
  const IN  = ['CASH_RETURN', 'CASH_OVER', 'REPLENISHMENT'];
  let net = 0;
  (currentReportMonthData.entries || []).forEach(e => {
    if (e.date !== dateStr) return;
    const amt = parseFloat(e.amount) || 0;
    if (OUT.includes(e.type))     net += amt;
    else if (IN.includes(e.type)) net -= amt;
  });
  return net;
}

// Footer label/total scope per tab, so the caption always matches the math
function updateDetailFooter(total, pendingReleased) {
  const byFilter = {
    advance  : ['Advances Total',      'Cash released as advances'],
    over     : ['Overage Total',       'Excess cash found and added to the drawer'],
    replenish: ['Replenishment Total', 'Funds received into the drawer'],
  };
  const [label, caption] = byFilter[currentDetailFilter] ||
    ['Expenses Total', 'Actual spending only — excludes open releases, overages & replenishments'];
  document.getElementById('detailTotalLabel').textContent   = label;
  document.getElementById('detailTotalCaption').textContent = caption;
  document.getElementById('detailDisplayedTotal').textContent = fmt(total);

  const noteEl = document.getElementById('detailPendingNote');
  if (pendingReleased > 0.005) {
    noteEl.textContent = '+ ' + fmt(pendingReleased) + ' released · awaiting settlement';
    noteEl.classList.remove('hidden');
  } else {
    noteEl.classList.add('hidden');
  }
}

// Track expanded advances in report view
const reportExpandedAdvances = new Set();

function toggleReportAdvance(id) {
  if (reportExpandedAdvances.has(id)) reportExpandedAdvances.delete(id);
  else reportExpandedAdvances.add(id);
  renderDetailList();
}

function renderDetailList() {
  if (!selectedReportDate) return;

  const allEntries = (currentReportMonthData.entries || []);
  let entries = allEntries.filter(e => e.date === selectedReportDate);

  if (currentDetailFilter === 'receipt')    entries = entries.filter(e => e.hasReceipt && e.type === 'EXPENSE');
  if (currentDetailFilter === 'noreceipt')  entries = entries.filter(e => !e.hasReceipt && e.type === 'EXPENSE');
  if (currentDetailFilter === 'advance')    entries = entries.filter(e => e.type === 'CASH_ADVANCE');
  if (currentDetailFilter === 'over')       entries = entries.filter(e => e.type === 'CASH_OVER');
  if (currentDetailFilter === 'replenish')  entries = entries.filter(e => e.type === 'REPLENISHMENT');

  // Skip LIQ_DETAIL as top-level — shown as sub-rows under advances
  entries = entries.filter(e => e.type !== 'LIQ_DETAIL');

  // Skip PCR_DETAIL and PCR-related CASH_RETURN as top-level — shown under PCR_ADVANCE
  const pcrRefNos = new Set(allEntries.filter(e => e.type === 'PCR_ADVANCE').map(e => e.referenceNo).filter(Boolean));
  entries = entries.filter(e => e.type !== 'PCR_DETAIL' && !(e.type === 'CASH_RETURN' && pcrRefNos.has(e.referenceNo)));

  const tbody = document.getElementById('detailListBody');
  if (entries.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-8 text-center text-gray-400 italic">No entries found</td></tr>';
    updateDetailFooter(0, 0);
    return;
  }

  // Build LIQ_DETAIL sub-entries map (finalized) by referenceNo
  const liqDetailMap = {};
  allEntries.filter(e => e.type === 'LIQ_DETAIL').forEach(sub => {
    if (!liqDetailMap[sub.referenceNo]) liqDetailMap[sub.referenceNo] = [];
    liqDetailMap[sub.referenceNo].push(sub);
  });

  // Build PCR sub-entries map: PCR_DETAIL + CASH_RETURN grouped under PCR_ADVANCE by referenceNo
  const pcrSubMap = {};
  allEntries.filter(e => e.type === 'PCR_ADVANCE').forEach(adv => {
    const subs = allEntries.filter(s =>
      (s.type === 'PCR_DETAIL' || s.type === 'CASH_RETURN') && s.referenceNo === adv.referenceNo
    );
    if (subs.length) pcrSubMap[adv.id] = subs;
  });

  // Footer scope: on the single-type tabs the total is simply that type's sum.
  // On all/receipt/noreceipt it is actual spending only (label must stay true):
  // plain expenses + what settled releases/advances really cost. Cash released
  // but not yet settled is reported separately, not counted as an expense.
  const singleTypeTab = { advance: 'CASH_ADVANCE', over: 'CASH_OVER', replenish: 'REPLENISHMENT' }[currentDetailFilter];
  let total = 0;
  let pendingReleased = 0;
  const rows = [];

  entries.forEach(e => {
    const amt = parseFloat(e.amount) || 0;
    if (singleTypeTab) {
      if (e.type === singleTypeTab) total += amt;
    } else if (e.type === 'EXPENSE') {
      total += amt;
    }

    const isAdvance = e.type === 'CASH_ADVANCE';
    const isLiquidated = isAdvance && e.status === 'LIQUIDATED';
    const isLiqPending = isAdvance && e.status === 'LIQUIDATION_PENDING';
    const isPcrRelease = e.type === 'PCR_ADVANCE';
    const isPcrSettled = isPcrRelease && e.status === 'LIQUIDATED';

    // PCR sub-entries for this release
    const pcrSubs    = isPcrRelease ? (pcrSubMap[e.id] || []) : [];
    const pcrDetails  = pcrSubs.filter(s => s.type === 'PCR_DETAIL');
    const pcrCashRet  = pcrSubs.find(s => s.type === 'CASH_RETURN');
    const detailTotal = pcrDetails.reduce((sum, s) => sum + (parseFloat(s.amount) || 0), 0);
    const pcrSpent    = pcrDetails.length > 0
      ? detailTotal
      : (parseFloat(e.amount) || 0) - (pcrCashRet ? parseFloat(pcrCashRet.amount) : 0);

    if (!singleTypeTab) {
      if (isPcrRelease) {
        if (isPcrSettled) total += pcrSpent;
        else              pendingReleased += amt;
      } else if (isAdvance) {
        if (isLiquidated) total += (e.liqBreakdown && parseFloat(e.liqBreakdown.totalSpent)) || amt;
        else              pendingReleased += amt;
      }
    }

    // Finalized sub-entries (LIQ_DETAIL rows)
    const liqSubs = liqDetailMap[e.id] || [];

    // Pending breakdown from notes JSON
    const pendingBreakdown = (isLiqPending && e.liqBreakdown) ? (e.liqBreakdown.entries || []) : [];

    const hasBreakdown = liqSubs.length > 0 || pendingBreakdown.length > 0 || pcrSubs.length > 0;
    const isExpanded = reportExpandedAdvances.has(e.id);

    let typeBadge;
    if (isAdvance) {
      if (isLiquidated)
        typeBadge = '<span class="text-green-700 text-xs font-bold bg-green-100 px-2 py-1 rounded">✅ LIQUIDATED</span>';
      else if (isLiqPending)
        typeBadge = '<span class="text-amber-600 text-xs font-bold bg-amber-100 px-2 py-1 rounded">⏳ PENDING</span>';
      else
        typeBadge = '<span class="text-blue-600 text-xs font-bold bg-blue-100 px-2 py-1 rounded">ADVANCE</span>';
    } else if (isPcrRelease) {
      typeBadge = isPcrSettled
        ? '<span class="text-green-700 text-xs font-bold bg-green-100 px-2 py-1 rounded">✅ Settled</span>'
        : '<span class="text-indigo-600 text-xs font-bold bg-indigo-100 px-2 py-1 rounded">Released</span>';
    } else if (e.type === 'CASH_OVER') {
      typeBadge = '<span class="text-emerald-600 text-xs font-bold bg-emerald-100 px-2 py-1 rounded">OVERAGE</span>';
    } else if (e.type === 'REPLENISHMENT') {
      typeBadge = '<span class="text-purple-600 text-xs font-bold bg-purple-100 px-2 py-1 rounded">REPLENISH</span>';
    } else {
      typeBadge = e.hasReceipt
        ? '<span class="text-green-600 text-xs font-bold bg-green-100 px-2 py-1 rounded">YES</span>'
        : '<span class="text-yellow-600 text-xs font-bold bg-yellow-100 px-2 py-1 rounded">NO</span>';
    }

    const pcrExpandCount = pcrSubs.length;
    const expandBtnColor = isPcrRelease ? 'bg-indigo-50 text-indigo-600 hover:bg-indigo-100' : 'bg-blue-50 text-blue-600 hover:bg-blue-100';
    const expandBtn = hasBreakdown
      ? `<button onclick="toggleReportAdvance('${e.id}')" class="ml-2 text-[10px] font-bold px-1.5 py-0.5 rounded ${expandBtnColor} transition">
           ${isExpanded ? '▼ Hide items' : '▶ View items'} (${isPcrRelease ? pcrExpandCount : (liqSubs.length || pendingBreakdown.length)})
         </button>`
      : '';

    const amountClass = isLiquidated ? 'text-gray-400 line-through' : isPcrSettled ? 'text-indigo-700 font-bold' : 'text-gray-700';

    // For PCR: show the PCR RELEASE badge + description on the same line
    const pcrReleaseBadge = isPcrRelease
      ? '<span class="text-indigo-600 text-xs font-bold bg-indigo-100 px-2 py-1 rounded mr-1">PCR RELEASE</span>'
      : '';

    // Released/returned sub-info line for settled PCR entries
    const pcrSpentLine = isPcrSettled
      ? `<div class="text-[10px] text-gray-400 mt-0.5">Released: ${fmt(e.amount)}${pcrCashRet ? ' &nbsp;&middot;&nbsp; Returned: ' + fmt(pcrCashRet.amount) : ''}</div>`
      : '';

    rows.push(`
      <tr class="hover:bg-gray-50 ${isAdvance ? 'bg-blue-50/30' : isPcrRelease ? 'bg-indigo-50/30' : ''}">
        <td class="px-3 py-3">
          <div class="font-medium text-gray-900 flex items-center flex-wrap gap-1 text-sm leading-snug">
            ${pcrReleaseBadge}${e.description}
            ${expandBtn}
          </div>
          <div class="text-xs text-gray-500 mt-0.5">${isPcrRelease ? 'Petty Cash Request' : (e.category || e.type)}${e.requestedBy ? ' · ' + e.requestedBy : ''}</div>
          ${isLiquidated && e.liqBreakdown ? `<div class="text-xs text-green-600 mt-0.5 font-medium">Spent: ${fmt(e.liqBreakdown.totalSpent || 0)}${(e.liqBreakdown.change > 0.005) ? ' · Change: ' + fmt(e.liqBreakdown.change) : ' · Fully spent'}</div>` : ''}
          ${pcrSpentLine}
          <!-- Mobile-only: amount + badge inline -->
          <div class="flex items-center justify-between mt-1.5 sm:hidden">
            <span class="font-mono font-bold text-sm ${amountClass}">${fmt(isPcrSettled ? pcrSpent : e.amount)}</span>
            ${typeBadge}
          </div>
        </td>
        <td class="px-3 py-3 text-right font-mono text-sm ${amountClass} hidden sm:table-cell">${fmt(isPcrSettled ? pcrSpent : e.amount)}</td>
        <td class="px-3 py-3 text-center hidden sm:table-cell">${typeBadge}</td>
      </tr>`);

    // Sub-rows when expanded
    if (isExpanded) {
      // PCR_DETAIL sub-entries
      if (isPcrRelease) {
        pcrDetails.forEach(sub => {
          rows.push(`
            <tr class="bg-indigo-50/60 border-l-4 border-indigo-200">
              <td class="pl-8 pr-3 py-2">
                <div class="flex items-start gap-1 text-xs text-gray-700">
                  <span class="text-gray-300 shrink-0 mt-0.5">└</span>
                  <div>
                    <span class="font-medium">${sub.description}</span>
                    <span class="text-gray-400 ml-1">(${sub.category || ''})</span>
                    ${sub.hasReceipt ? '<span class="text-green-600 ml-1">🧾</span>' : '<span class="text-amber-500 ml-1">⚠️</span>'}
                    <div class="flex items-center justify-between mt-1 sm:hidden">
                      <span class="font-mono font-bold text-gray-600">${fmt(sub.amount)}</span>
                    </div>
                  </div>
                </div>
              </td>
              <td class="px-3 py-2 text-right font-mono text-xs text-gray-600 hidden sm:table-cell">${fmt(sub.amount)}</td>
              <td class="px-3 py-2 text-center hidden sm:table-cell">${sub.hasReceipt ? '<span class="text-[10px] text-green-600 font-bold">YES</span>' : '<span class="text-[10px] text-yellow-600 font-bold">NO</span>'}</td>
            </tr>`);
        });
        if (pcrCashRet) {
          rows.push(`
            <tr class="bg-teal-50/60 border-l-4 border-teal-200">
              <td class="pl-8 pr-3 py-2 text-xs font-bold text-teal-700">↩ Cash Returned</td>
              <td class="px-3 py-2 text-right font-mono text-xs font-bold text-teal-700 hidden sm:table-cell">${fmt(pcrCashRet.amount)}</td>
              <td class="hidden sm:table-cell"></td>
            </tr>`);
        }
      }

      // Finalized LIQ_DETAIL sub-entries
      liqSubs.forEach(sub => {
        rows.push(`
          <tr class="bg-green-50/50 border-l-4 border-green-300">
            <td class="pl-8 pr-3 py-2">
              <div class="flex items-start gap-1 text-xs text-gray-700">
                <span class="text-gray-300 shrink-0 mt-0.5">└</span>
                <div>
                  <span class="font-medium">${sub.description}</span>
                  <span class="text-gray-400 ml-1">(${sub.category || ''})</span>
                  ${sub.hasReceipt ? '<span class="text-green-600 ml-1">🧾</span>' : '<span class="text-amber-500 ml-1">⚠️</span>'}
                  <div class="flex items-center justify-between mt-1 sm:hidden">
                    <span class="font-mono font-bold text-gray-600">${fmt(sub.amount)}</span>
                    <span class="text-[10px] text-green-600 font-bold">LIQ</span>
                  </div>
                </div>
              </div>
            </td>
            <td class="px-3 py-2 text-right font-mono text-xs text-gray-600 hidden sm:table-cell">${fmt(sub.amount)}</td>
            <td class="px-3 py-2 text-center hidden sm:table-cell"><span class="text-[10px] text-green-600 font-bold">LIQ</span></td>
          </tr>`);
      });

      // Pending breakdown sub-entries
      pendingBreakdown.forEach(sub => {
        rows.push(`
          <tr class="bg-amber-50/50 border-l-4 border-amber-300">
            <td class="pl-8 pr-3 py-2">
              <div class="flex items-start gap-1 text-xs text-gray-700">
                <span class="text-gray-300 shrink-0 mt-0.5">└</span>
                <div>
                  <span class="font-medium">${sub.desc || '—'}</span>
                  <span class="text-gray-400 ml-1">(${sub.category || ''})</span>
                  ${sub.hasReceipt ? '<span class="text-green-600 ml-1">🧾</span>' : '<span class="text-amber-500 ml-1">⚠️</span>'}
                  <div class="flex items-center justify-between mt-1 sm:hidden">
                    <span class="font-mono font-bold text-gray-600">${fmt(parseFloat(sub.amount) || 0)}</span>
                    <span class="text-[10px] text-amber-600 font-bold">PENDING</span>
                  </div>
                </div>
              </div>
            </td>
            <td class="px-3 py-2 text-right font-mono text-xs text-gray-600 hidden sm:table-cell">${fmt(parseFloat(sub.amount) || 0)}</td>
            <td class="px-3 py-2 text-center hidden sm:table-cell"><span class="text-[10px] text-amber-600 font-bold">PENDING</span></td>
          </tr>`);
      });

      // Change to return row
      const bd = e.liqBreakdown;
      if (bd && bd.change > 0.005) {
        rows.push(`
          <tr class="bg-amber-50/50 border-l-4 border-amber-300">
            <td class="pl-8 pr-3 py-2">
              <div class="flex items-center justify-between text-xs font-bold text-amber-700">
                <span>↩ Change to Return</span>
                <span class="font-mono sm:hidden">${fmt(bd.change)}</span>
              </div>
            </td>
            <td class="px-3 py-2 text-right font-mono text-xs font-bold text-amber-700 hidden sm:table-cell">${fmt(bd.change)}</td>
            <td class="hidden sm:table-cell"></td>
          </tr>`);
      }
    }
  });

  tbody.innerHTML = rows.join('');
  updateDetailFooter(total, pendingReleased);
}
</script>
