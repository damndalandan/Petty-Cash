<script>
// =============================================
// REPLENISHMENT PERIOD REPORT LOGIC
// =============================================

let rrData = null;
let rrDetailedActive = false; // State for fused table view

// Opening top-up date of the period on screen. '' means "whatever the server
// considers live" — so the very first load, and any load after a fresh top-up,
// lands on the current cycle.
let rrSelectedPeriod = '';

// Category drill-down modal state
let rrModalEntries  = [];   // entries for the clicked category
let rrModalFiltered = [];   // after search filter
let rrModalPage     = 1;
let rrModalCategory = '';
const RR_PAGE_SIZE  = 10;

// Same ramp the summary report uses, so a category reads the same in both.
const RR_COLORS = [
  '#3b82f6','#10b981','#f59e0b','#ef4444',
  '#8b5cf6','#06b6d4','#f97316','#84cc16',
  '#ec4899','#6b7280'
];

// periodFrom: opening top-up date to report on. Omit to reload whatever is
// already on screen (Refresh, page navigation).
async function loadReplenishReport(periodFrom) {
  if (periodFrom !== undefined) rrSelectedPeriod = periodFrom || '';

  document.getElementById('rrEmpty').classList.add('hidden');
  document.getElementById('rrContent').classList.add('hidden');
  document.getElementById('rrLoading').classList.remove('hidden');

  const res = await callServer('getReplenishmentPeriodReport', { periodFrom: rrSelectedPeriod });

  document.getElementById('rrLoading').classList.add('hidden');

  if (!res.success) {
    toast('Failed to load replenishment report: ' + (res.message || ''), 'error');
    document.getElementById('rrEmpty').classList.remove('hidden');
    return;
  }

  if (!res.data || !res.data.dailyRows || res.data.dailyRows.length === 0) {
    // Still fill the picker — an empty period must not strand you with no way
    // back to a period that does have data.
    if (res.data) {
      rrData = res.data;
      rrSelectedPeriod = res.data.periodFrom || '';
      rrRenderPeriodPicker(res.data);
    }
    document.getElementById('rrEmpty').classList.remove('hidden');
    return;
  }

  rrData = res.data;
  rrSelectedPeriod = res.data.periodFrom || '';
  renderReplenishReport(rrData);
}

// ── Period picker ──
function rrRenderPeriodPicker(d) {
  const sel = document.getElementById('rrPeriodSelect');
  if (!sel) return;

  const periods = d.periods || [];
  if (periods.length <= 1) {
    // Nothing to navigate to — hide the control rather than show a dead dropdown.
    document.getElementById('rrPeriodPicker').classList.add('hidden');
    return;
  }
  document.getElementById('rrPeriodPicker').classList.remove('hidden');

  const shortDate = (s) => new Date(s + 'T00:00:00')
    .toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });

  sel.innerHTML = periods.map(p => {
    const tag   = p.isCurrent ? ' • Current' : '';
    const topUp = p.openingTopUp > 0 ? ` — ${fmt(p.openingTopUp)} top-up` : '';
    return `<option value="${p.from}">${shortDate(p.from)} → ${shortDate(p.to)}${topUp}${tag}</option>`;
  }).join('');

  sel.value = d.periodFrom;
  const i = sel.selectedIndex;
  // periods arrive newest-first, so "older" walks down the list.
  document.getElementById('rrNewerBtn').disabled = i <= 0;
  document.getElementById('rrOlderBtn').disabled = i >= periods.length - 1;

  const badge = document.getElementById('rrHistoricalBadge');
  badge.classList.toggle('hidden', !!d.isCurrentPeriod);
  badge.classList.toggle('flex',   !d.isCurrentPeriod);
}

function rrShiftPeriod(delta) {
  const sel = document.getElementById('rrPeriodSelect');
  const i   = sel.selectedIndex + delta;   // +1 = older, -1 = newer
  if (i < 0 || i >= sel.options.length) return;
  sel.selectedIndex = i;
  loadReplenishReport(sel.value);
}

function toggleRrDetails() {
  rrDetailedActive = !rrDetailedActive;
  
  // Update UI Elements
  const label = document.getElementById('rrDetailsLabel');
  const btn   = document.getElementById('btn-rrDetails');
  const detailRows = document.querySelectorAll('.rr-detail-row');
  
  if (rrDetailedActive) {
    label.textContent = 'Hide Details';
    btn.classList.replace('bg-white', 'bg-blue-600');
    btn.classList.replace('text-gray-600', 'text-white');
    btn.classList.replace('border-gray-300', 'border-blue-700');
    detailRows.forEach(row => row.classList.remove('hidden'));
  } else {
    label.textContent = 'Show Details';
    btn.classList.replace('bg-blue-600', 'bg-white');
    btn.classList.replace('text-white', 'text-gray-600');
    btn.classList.replace('border-blue-700', 'border-gray-300');
    detailRows.forEach(row => row.classList.add('hidden'));
  }
}

function renderReplenishReport(d) {
  // Reset state on new report load
  rrDetailedActive = false;
  const btn = document.getElementById('btn-rrDetails');
  if (btn) btn.className = "px-3 py-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-600 text-[10px] font-bold rounded-lg shadow-sm transition flex items-center gap-1.5";
  document.getElementById('rrDetailsLabel').textContent = 'Show Details';

  rrRenderPeriodPicker(d);

  // ── Period Banner ──
  const fromDate = new Date(d.periodFrom + 'T00:00:00');
  const toDate   = new Date(d.periodTo   + 'T00:00:00');

  const fmtDate  = (dt) => dt.toLocaleDateString('en-PH', {
    month: 'long', day: 'numeric', year: 'numeric'
  });

  document.getElementById('rr-periodLabel').textContent =
    `${fmtDate(fromDate)} — ${fmtDate(toDate)}`;

  // Day count
  const msPerDay = 1000 * 60 * 60 * 24;
  const dayCount = Math.round((toDate - fromDate) / msPerDay) + 1;
  document.getElementById('rr-dayCount').textContent = dayCount;
  document.getElementById('rr-tableSubtitle').textContent =
    `${d.dailyRows.length} active day${d.dailyRows.length !== 1 ? 's' : ''}`;

  // ── Replenishment Calculation ──
  document.getElementById('rr-cashOnHand').textContent      = fmt(d.cashOnHand);
  document.getElementById('rr-advOutstanding').textContent  = fmt(d.advancesOutstanding);
  document.getElementById('rr-accounted').textContent       = fmt(d.accounted);
  document.getElementById('rr-fundCeiling').textContent     = fmt(d.fundCeiling);
  document.getElementById('rr-toReplenish').textContent     = fmt(d.toReplenish);

  // ── Period Stats ──
  document.getElementById('rr-totalExpenses').textContent     = fmt(d.totalExpenses);
  document.getElementById('rr-totalReplenishment').textContent = fmt(d.totalReplenishment);

  const net    = d.totalReplenishment - d.totalExpenses;
  const netEl  = document.getElementById('rr-netMovement');
  netEl.textContent = (net >= 0 ? '+' : '') + fmt(net);
  netEl.className   = 'text-xl font-black font-mono ' +
    (net >= 0 ? 'text-green-600' : 'text-red-600');

  // ── Accountability roll-ups ──
  renderRrCategoryBreakdown(d.categoryBreakdown, d.totalExpenses);
  renderRrReceiptCoverage(d.expWithReceipt, d.expWithoutReceipt);

  // ── Fused Table ──
  renderRrFusedTable(d.dailyRows, d.periodEntries);

  // Show content
  document.getElementById('rrContent').classList.remove('hidden');
}

function renderRrCategoryBreakdown(rows, total) {
  const el = document.getElementById('rr-categoryBreakdown');
  if (!el) return;

  if (!rows || rows.length === 0) {
    el.innerHTML = `<p class="text-sm text-gray-400 italic py-4 text-center">No expenses in this period</p>`;
    return;
  }

  const max = rows[0].amount || 1;   // rows arrive largest-first from the server

  el.innerHTML = rows.map((r, i) => {
    const pctOfMax = Math.max(2, (r.amount / max) * 100);
    // Prefer the server's percent — it is computed against the same total the
    // roll-ups reconcile to. Fall back for snapshots saved before that field.
    const pctOfTot = (r.percent !== undefined && r.percent !== null)
      ? r.percent
      : (total > 0 ? Math.round((r.amount / total) * 100) : 0);
    const color    = RR_COLORS[i % RR_COLORS.length];
    return `
      <div onclick="openRrCategoryDetail(${i})"
        class="no-break-inside cursor-pointer group hover:bg-slate-50 p-1.5 rounded-lg transition-all duration-200">
        <div class="flex items-center justify-between mb-1 gap-2">
          <span class="text-xs font-medium text-gray-700 truncate group-hover:text-blue-600 transition-colors" title="${escHtml(r.category)}">${escHtml(r.category)}</span>
          <span class="text-xs font-mono font-bold text-gray-800 shrink-0">
            ${fmt(r.amount)}
            <span class="text-[10px] text-gray-400 font-sans ml-0.5">${pctOfTot}%</span>
          </span>
        </div>
        <div class="h-2 w-full bg-gray-100 rounded-full overflow-hidden shadow-inner">
          <div class="h-full rounded-full transition-all duration-1000 ease-out" style="width:${pctOfMax}%; background:${color}"></div>
        </div>
      </div>`;
  }).join('');
}

// =============================================
// CATEGORY DRILL-DOWN MODAL
// =============================================

// Resolved by index so a category name containing an apostrophe can never
// break the inline onclick — only the safe integer index is interpolated.
function openRrCategoryDetail(i) {
  const cat = rrData && rrData.categoryBreakdown && rrData.categoryBreakdown[i];
  if (!cat) return;
  openRrDetailModal(cat.category);
}

function openRrDetailModal(category) {
  if (!rrData) return;

  rrModalCategory = category;
  rrModalEntries  = (rrData.expenseEntries || [])
    .filter(e => String(e.category).trim() === String(category).trim());
  rrModalFiltered = [...rrModalEntries];
  rrModalPage     = 1;

  const total = rrModalEntries.reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);

  document.getElementById('rrDetailModalTitle').textContent = category;
  document.getElementById('rrDetailModalSub').textContent   =
    `${rrData.periodFrom} → ${rrData.periodTo}`;
  document.getElementById('rrDetailModalTotal').textContent = fmt(total);
  document.getElementById('rrDetailSearch').value = '';

  rrDetailRender();
  document.getElementById('rrDetailModal').classList.remove('hidden');
}

function closeRrDetailModal() {
  document.getElementById('rrDetailModal').classList.add('hidden');
  rrModalEntries  = [];
  rrModalFiltered = [];
  rrModalCategory = '';
}

function rrDetailFilterAndRender() {
  const q = document.getElementById('rrDetailSearch').value.toLowerCase();
  rrModalFiltered = rrModalEntries.filter(e =>
    (e.description  || '').toLowerCase().includes(q) ||
    (e.supplierName || '').toLowerCase().includes(q) ||
    (e.receiptNo    || '').toLowerCase().includes(q) ||
    (e.referenceNo  || '').toLowerCase().includes(q) ||
    (e.requestedBy  || '').toLowerCase().includes(q)
  );
  rrModalPage = 1;
  rrDetailRender();
}

function rrDetailRender() {
  const total    = rrModalFiltered.length;
  const pages    = Math.max(1, Math.ceil(total / RR_PAGE_SIZE));
  rrModalPage    = Math.min(rrModalPage, pages);
  const start    = (rrModalPage - 1) * RR_PAGE_SIZE;
  const pageRows = rrModalFiltered.slice(start, start + RR_PAGE_SIZE);

  document.getElementById('rrDetailCount').textContent     = `${total} entr${total === 1 ? 'y' : 'ies'}`;
  document.getElementById('rrDetailPageLabel').textContent = `Page ${rrModalPage} of ${pages}`;
  document.getElementById('rrDetailPrev').disabled         = rrModalPage <= 1;
  document.getElementById('rrDetailNext').disabled         = rrModalPage >= pages;

  const tbody = document.getElementById('rrDetailBody');
  if (pageRows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-10 text-center text-slate-400 italic text-sm bg-slate-50/50">No entries found matching your search</td></tr>`;
    return;
  }

  tbody.innerHTML = pageRows.map(e => {
    const dateLabel = new Date(e.date + 'T00:00:00')
      .toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
    const receiptBadge = e.hasReceipt
      ? '<span class="px-1.5 py-0.5 bg-emerald-100 text-emerald-700 text-[9px] font-bold rounded uppercase">Yes</span>'
      : '<span class="px-1.5 py-0.5 bg-slate-100 text-slate-500 text-[9px] font-bold rounded uppercase">No</span>';
    const desc = escHtml(e.description || '—');
    const sup  = e.supplierName ? `<div class="text-[10px] text-slate-400 truncate">${escHtml(e.supplierName)}</div>` : '';

    return `<tr class="hover:bg-slate-50 transition border-b border-slate-50 last:border-0">
      <td class="px-4 py-3 text-xs text-slate-500 whitespace-nowrap">${dateLabel}</td>
      <td class="px-4 py-3 text-xs text-slate-700 font-medium">${desc}${sup}</td>
      <td class="px-4 py-3 text-center">${receiptBadge}</td>
      <td class="px-4 py-3 text-xs font-mono text-slate-400">${escHtml(e.receiptNo || e.referenceNo || '—')}</td>
      <td class="px-4 py-3 text-xs text-slate-500 italic">${escHtml(e.requestedBy || '—')}</td>
      <td class="px-4 py-3 text-sm text-right font-mono font-bold text-slate-800">${fmt(e.amount)}</td>
    </tr>`;
  }).join('');
}

function rrDetailPagePrev() {
  if (rrModalPage > 1) { rrModalPage--; rrDetailRender(); }
}

function rrDetailPageNext() {
  const pages = Math.ceil(rrModalFiltered.length / RR_PAGE_SIZE);
  if (rrModalPage < pages) { rrModalPage++; rrDetailRender(); }
}

function renderRrReceiptCoverage(withR, withoutR) {
  const el = document.getElementById('rr-receiptCoverage');
  if (!el) return;

  const wR    = withR    || 0;
  const woR   = withoutR || 0;
  const total = wR + woR;

  if (total === 0) {
    el.innerHTML = `<p class="text-sm text-gray-400 italic text-center">No receipted expenses</p>`;
    return;
  }

  const pct       = (wR / total) * 100;
  const pctColor  = pct >= 90 ? 'text-green-600' : pct >= 70 ? 'text-amber-500' : 'text-red-600';

  el.innerHTML = `
    <div class="text-center mb-4">
      <div class="text-4xl font-black font-mono ${pctColor}">${pct.toFixed(0)}%</div>
      <div class="text-[10px] text-gray-400 uppercase tracking-wider mt-1">of spend has receipts</div>
    </div>
    <div class="flex h-3 w-full rounded-full overflow-hidden mb-4 bg-gray-100">
      <div class="h-full bg-green-500" style="width:${pct}%"></div>
      <div class="h-full bg-red-400" style="width:${100 - pct}%"></div>
    </div>
    <div class="space-y-2">
      <div class="flex items-center justify-between text-xs">
        <span class="flex items-center gap-1.5 text-gray-600"><span class="w-2 h-2 rounded-full bg-green-500"></span> With receipt</span>
        <span class="font-mono font-bold text-gray-800">${fmt(wR)}</span>
      </div>
      <div class="flex items-center justify-between text-xs">
        <span class="flex items-center gap-1.5 text-gray-600"><span class="w-2 h-2 rounded-full bg-red-400"></span> Missing receipt</span>
        <span class="font-mono font-bold ${woR > 0 ? 'text-red-600' : 'text-gray-800'}">${fmt(woR)}</span>
      </div>
    </div>`;
}

function renderRrFusedTable(rows, entries) {
  const tbody = document.getElementById('rrDailyBody');
  const tfoot = document.getElementById('rrDailyFoot');

  if (!rows || rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-gray-400 italic text-sm">No activity in this period</td></tr>`;
    tfoot.innerHTML = '';
    return;
  }

  // Group entries by date
  const entryMap = {};
  if (entries) {
    entries.forEach(e => {
      if (!entryMap[e.date]) entryMap[e.date] = [];
      entryMap[e.date].push(e);
    });
  }

  const statusMap = {
    CLOSED       : '<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-green-100 text-green-700">✅ Closed</span>',
    PENDING_AUDIT: '<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-amber-100 text-amber-700">🔍 Pending</span>',
    FLAGGED      : '<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-red-100 text-red-700">🚩 Flagged</span>',
    OPEN         : '<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-gray-100 text-gray-600">⚪ Open</span>',
  };

  let totExpenses = 0, totReplenish = 0, totCashAdv = 0;
  let html = '';

  rows.forEach(r => {
    totExpenses  += r.expenses;
    totReplenish += r.replenishment;
    totCashAdv   += r.cashAdvance || 0;

    const dt     = new Date(r.date + 'T00:00:00');
    const label  = dt.toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' });
    const badge  = statusMap[r.status] || statusMap['OPEN'];
    
    const expCls  = r.expenses      > 0 ? 'font-bold text-red-600'    : 'text-gray-300';
    const advCls  = r.cashAdvance   > 0 ? 'font-bold text-orange-500' : 'text-gray-300';
    const repCls  = r.replenishment > 0 ? 'font-bold text-purple-600' : 'text-gray-300';
    const isClosed = r.status === 'CLOSED';
    
    const rowCls = r.replenishment > 0 ? 'bg-purple-50/30' : 'hover:bg-gray-50/50';
    const borderCls = r.replenishment > 0 ? 'border-l-4 border-purple-400' : '';

    // Main Summary Row
    html += `
      <tr class="transition ${rowCls} ${borderCls} print:bg-white no-break-inside">
        <td class="px-4 py-3 text-sm font-medium text-gray-700">
          ${label}
          ${r.replenishment > 0 ? '<span class="ml-1 text-[10px] font-bold text-purple-600 bg-purple-100 px-1.5 py-0.5 rounded-full">TOP-UP</span>' : ''}
        </td>
        <td class="px-4 py-3 text-right font-mono text-xs text-gray-400">${fmt(r.opening)}</td>
        <td class="px-4 py-3 text-right font-mono text-sm ${expCls}">${r.expenses > 0 ? fmt(r.expenses) : '—'}</td>
        <td class="px-4 py-3 text-right font-mono text-sm ${advCls}">${r.cashAdvance > 0 ? fmt(r.cashAdvance) : '—'}</td>
        <td class="px-4 py-3 text-right font-mono text-sm ${repCls}">${r.replenishment > 0 ? fmt(r.replenishment) : '—'}</td>
        <td class="px-4 py-3 text-right font-mono text-sm ${isClosed ? 'text-gray-700' : 'text-gray-300'}">${isClosed ? fmt(r.closing) : '—'}</td>
        <td class="px-4 py-3 text-center">${badge}</td>
      </tr>`;

    // Detailed Nested Rows (Always in DOM, handled by hidden/print classes)
    if (entryMap[r.date]) {
      const dayEntries = entryMap[r.date];
      html += `
        <tr class="rr-detail-row bg-gray-50/50 hidden print:table-row no-break-inside">
          <td colspan="7" class="px-4 sm:px-6 py-0">
            <div class="border-l-2 border-dashed border-gray-200 ml-2 my-2 py-1 pl-3 sm:pl-4 space-y-0.5">
              ${dayEntries.map(e => {
                // Per-type presentation: short label + pill colour + amount colour
                const typeConf = {
                  CASH_ADVANCE              : { label: 'Advance',     pill: 'bg-amber-100 text-amber-700',   amt: 'text-orange-500' },
                  PCR_ADVANCE               : { label: 'Release',     pill: 'bg-orange-100 text-orange-700', amt: 'text-orange-500' },
                  LIQ_DETAIL                : { label: 'Liquidation', pill: 'bg-blue-100 text-blue-700',     amt: 'text-red-600'    },
                  PCR_DETAIL                : { label: 'Request',     pill: 'bg-indigo-100 text-indigo-700', amt: 'text-red-600'    },
                  CASH_ADVANCE_REIMBURSEMENT: { label: 'Reimburse',   pill: 'bg-rose-100 text-rose-700',     amt: 'text-red-600'    },
                  REPLENISHMENT             : { label: 'Top-up',      pill: 'bg-purple-100 text-purple-700', amt: 'text-purple-600' },
                }[e.type] || { label: 'Entry', pill: 'bg-gray-100 text-gray-600', amt: 'text-red-600' };

                const sign = e.type === 'REPLENISHMENT' ? '+' : '';

                return `
                  <div class="flex items-center gap-3 py-1.5 px-2 rounded-lg hover:bg-white/80 transition border-b border-gray-100 last:border-0">
                    <span class="shrink-0 w-[68px] text-center text-[9px] font-bold py-1 rounded ${typeConf.pill} uppercase tracking-wide">${typeConf.label}</span>
                    <div class="min-w-0 flex-1">
                      <div class="text-xs text-gray-700 font-medium truncate" title="${e.description}">${e.description}</div>
                      <div class="text-[10px] text-gray-400 truncate">
                        <span class="uppercase tracking-wide font-semibold">${e.category || 'misc'}</span>${e.requestedBy ? ` &middot; ${e.requestedBy}` : ''}
                      </div>
                    </div>
                    <div class="shrink-0 w-24 text-right font-mono text-xs font-bold tabular-nums ${typeConf.amt}">
                      ${sign}${fmt(e.amount)}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </td>
        </tr>`;
    }
  });

  tbody.innerHTML = html;

  tfoot.innerHTML = `
    <tr class="bg-gray-100/50 print:bg-gray-100">
      <td class="px-4 py-3 text-[10px] font-bold text-gray-500 uppercase tracking-wider">Period Totals</td>
      <td class="px-4 py-3 text-right font-mono font-bold text-gray-400">—</td>
      <td class="px-4 py-3 text-right font-mono font-bold text-red-600">${fmt(totExpenses)}</td>
      <td class="px-4 py-3 text-right font-mono font-bold text-orange-500">${totCashAdv > 0 ? fmt(totCashAdv) : '—'}</td>
      <td class="px-4 py-3 text-right font-mono font-bold text-purple-600">${totReplenish > 0 ? fmt(totReplenish) : '—'}</td>
      <td class="px-4 py-3 text-right font-mono font-bold text-gray-400">—</td>
      <td></td>
    </tr>`;
}

// =============================================
// PDF EXPORT — plain text report, written line by line
// =============================================
//
// This does NOT screenshot the page. It writes text straight into the PDF with
// jsPDF (bundled inside html2pdf), so the output is a small, crisp, selectable
// text document instead of a picture of the dashboard.

// jsPDF's built-in fonts only cover Latin-1, so ₱ and smart quotes come out as
// garbage. Everything printed goes through here first.
function rrPdfText(s) {
  return String(s == null ? '' : s)
    .replace(/₱/g, 'P')            // ₱ → P
    .replace(/[‘’]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/[–—]/g, '-')
    .replace(/\s+/g, ' ')
    .replace(/[^\x20-\x7E]/g, '')
    .trim();
}

// Bare number, no currency symbol — the header states the currency once.
function rrPdfAmount(n) {
  return (parseFloat(n) || 0)
    .toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Groups the period's expenses by category, largest category first — the same
// order (and the same totals) as "Where the Money Went" on screen.
function rrPdfSections(d) {
  const entries = d.expenseEntries || [];

  // Anything missing from the breakdown is appended so no transaction can
  // silently drop off the export.
  const order = (d.categoryBreakdown || []).map(c => c.category);
  entries.forEach(e => { if (order.indexOf(e.category) === -1) order.push(e.category); });

  return order.map(cat => {
    const rows = entries
      .filter(e => String(e.category).trim() === String(cat).trim())
      .sort((a, b) => a.date > b.date ? 1 : -1);   // oldest first, reads like a ledger
    return {
      cat,
      rows,
      total: rows.reduce((s, e) => s + (parseFloat(e.amount) || 0), 0)
    };
  }).filter(s => s.rows.length > 0);
}

function printReplenishReport() {
  if (!rrData) {
    toast('No report data to export', 'warning');
    return;
  }

  const JsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  if (!JsPDF) {
    toast('PDF library not loaded — refresh the page and try again', 'error');
    return;
  }

  const d   = rrData;
  const doc = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

  // ── Page geometry (A4 = 210 × 297mm) ──
  const LEFT = 15, RIGHT = 195, BOTTOM = 282;
  const DATE_X = 17, DESC_X = 33, DESC_W = 122;   // description wraps before the amount column

  let y = 0;

  const fullDate = (s) => new Date(s + 'T00:00:00')
    .toLocaleDateString('en-PH', { month: 'long', day: 'numeric', year: 'numeric' });
  const dayLabel = (s) => new Date(s + 'T00:00:00')
    .toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });

  const rule = (weight) => {
    doc.setLineWidth(weight);
    doc.line(LEFT, y, RIGHT, y);
    doc.setLineWidth(0.2);
  };

  // Starts a page and prints the report heading. Subsequent pages get the same
  // heading marked "(continued)" so a loose page still identifies itself.
  const startPage = (continued) => {
    y = 18;
    doc.setFont('helvetica', 'bold').setFontSize(13);
    doc.text('PETTY CASH - EXPENSES BY CATEGORY' + (continued ? ' (continued)' : ''), LEFT, y);
    y += 5;
    doc.setFont('helvetica', 'normal').setFontSize(9);
    doc.text(rrPdfText(`${fullDate(d.periodFrom)} to ${fullDate(d.periodTo)}   |   All amounts in PHP`), LEFT, y);
    y += 3;
    rule(0.6);
    y += 7;
  };

  // Reserve space so a category header can never be the last thing on a page.
  const needRoom = (mm) => {
    if (y + mm > BOTTOM) { doc.addPage(); startPage(true); }
  };

  startPage(false);

  const sections = rrPdfSections(d);

  if (sections.length === 0) {
    doc.setFont('helvetica', 'italic').setFontSize(10);
    doc.text('No expenses in this period.', LEFT, y);
  }

  sections.forEach(s => {
    needRoom(16);

    // ── Category header: name left, category total right ──
    doc.setFont('helvetica', 'bold').setFontSize(11);
    doc.text(rrPdfText(s.cat), LEFT, y);
    doc.text(rrPdfAmount(s.total), RIGHT, y, { align: 'right' });
    y += 1.8;
    rule(0.4);
    y += 5;

    // ── Its transactions ──
    doc.setFont('helvetica', 'normal').setFontSize(9);
    s.rows.forEach(e => {
      const desc  = rrPdfText(e.description || '-') +
                    (e.supplierName ? ' (' + rrPdfText(e.supplierName) + ')' : '');
      const lines = doc.splitTextToSize(desc, DESC_W);

      needRoom(lines.length * 4 + 2);

      doc.setTextColor(110);
      doc.text(dayLabel(e.date), DATE_X, y);
      doc.setTextColor(0);
      doc.text(lines, DESC_X, y);
      doc.text(rrPdfAmount(e.amount), RIGHT, y, { align: 'right' });

      y += lines.length * 4 + 1.5;
    });

    y += 5;
  });

  // ── Totals block ──
  needRoom(24);
  y += 2;
  rule(0.6);
  y += 6;
  doc.setFont('helvetica', 'bold').setFontSize(11);
  doc.text('TOTAL EXPENSES', LEFT, y);
  doc.text(rrPdfAmount(d.totalExpenses), RIGHT, y, { align: 'right' });
  y += 6;
  doc.setFont('helvetica', 'normal').setFontSize(10);
  doc.text('Amount to Replenish', LEFT, y);
  doc.setFont('helvetica', 'bold');
  doc.text(rrPdfAmount(d.toReplenish), RIGHT, y, { align: 'right' });

  // ── Footer on every page ──
  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFont('helvetica', 'normal').setFontSize(8).setTextColor(130);
    doc.text(rrPdfText('Generated ' + new Date().toLocaleDateString('en-PH', {
      month: 'long', day: 'numeric', year: 'numeric'
    })), LEFT, 290);
    doc.text(`Page ${p} of ${pages}`, RIGHT, 290, { align: 'right' });
    doc.setTextColor(0);
  }

  const from = d.periodFrom.replace(/-/g, '');
  const to   = d.periodTo.replace(/-/g, '');

  try {
    doc.save(`PettyCash_Expenses_${from}_to_${to}.pdf`);
    toast('Report exported successfully!', 'success');
  } catch (err) {
    console.error('PDF Export Error:', err);
    toast('Failed to generate PDF', 'error');
  }
}
</script>
