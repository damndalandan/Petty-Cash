<script>
// =============================================
// REPLENISHMENT PERIOD REPORT LOGIC
// =============================================

let rrData = null;
let rrDetailedActive = false; // State for fused table view

// Opening top-up date of the period on screen. '' means "whatever the server
// considers live" — so the very first load, and any load after a fresh top-up,
// lands on the current cycle.
let rrSelectedPeriod = '';

// "Business only" view. The server sends both readings of the period in one
// payload, so this is a pure presentation switch — no reload, and it survives a
// period change so a bookkeeper working a batch stays in the same view.
let rrBusinessOnly = false;

// The figures the page is currently drawing. Everything downstream reads this
// rather than rrData directly, so the toggle can never leave one panel filtered
// and another not. Cash on Hand / Accounted / Amount to Replenish are absent on
// purpose — those are drawer balances, and personal cash that left (or came
// back) really did move them.
function rrView() {
  const d = rrData || {};
  const has = (v) => v !== undefined && v !== null;

  if (!rrBusinessOnly) {
    return {
      totalExpenses     : d.totalExpenses,
      totalReplenishment: d.totalReplenishment,
      categoryBreakdown : d.categoryBreakdown,
      withReceipt       : d.expWithReceipt,
      withoutReceipt    : d.expWithoutReceipt,
      journal           : d.journal
    };
  }
  return {
    totalExpenses     : has(d.businessExpenses)         ? d.businessExpenses         : d.totalExpenses,
    totalReplenishment: has(d.ceilingReplenishment)     ? d.ceilingReplenishment     : d.totalReplenishment,
    categoryBreakdown : has(d.categoryBreakdownBusiness)? d.categoryBreakdownBusiness: d.categoryBreakdown,
    withReceipt       : has(d.expWithReceiptBusiness)   ? d.expWithReceiptBusiness   : d.expWithReceipt,
    withoutReceipt    : has(d.expWithoutReceiptBusiness)? d.expWithoutReceiptBusiness: d.expWithoutReceipt,
    journal           : d.journalBusiness || d.journal
  };
}

// Is there anything for the filter to remove in the period on screen?
function rrHasExcludable() {
  const d = rrData || {};
  return (d.personalExpenses || 0) > 0 || (d.nonCeilingReplenishment || 0) > 0;
}

function toggleRrBusinessOnly(on) {
  rrBusinessOnly = !!on;
  const box = document.getElementById('rrBusinessOnly');
  if (box) box.checked = rrBusinessOnly;
  if (rrData) rrRenderFigures(rrData);
}

// Category drill-down modal state
let rrModalEntries  = [];   // entries for the clicked category
let rrModalFiltered = [];   // after search filter
let rrModalPage     = 1;
let rrModalCategory = '';
const RR_PAGE_SIZE  = 10;

// Same ramp the summary report uses, so a category reads the same in both.
const RR_COLORS = [
  '#3b82f6','#10b981','#f59e0b','#ef4444',
  '#8b5cf6','#06b6d4','#f97316','#84cc16',
  '#ec4899','#6b7280'
];

// periodFrom: opening top-up date to report on. Omit to reload whatever is
// already on screen (Refresh, page navigation).
async function loadReplenishReport(periodFrom) {
  if (periodFrom !== undefined) rrSelectedPeriod = periodFrom || '';

  document.getElementById('rrEmpty').classList.add('hidden');
  document.getElementById('rrContent').classList.add('hidden');
  document.getElementById('rrLoading').classList.remove('hidden');

  const res = await callServer('getReplenishmentPeriodReport', { periodFrom: rrSelectedPeriod });

  document.getElementById('rrLoading').classList.add('hidden');

  if (!res.success) {
    toast('Failed to load replenishment report: ' + (res.message || ''), 'error');
    document.getElementById('rrEmpty').classList.remove('hidden');
    return;
  }

  if (!res.data || !res.data.dailyRows || res.data.dailyRows.length === 0) {
    // Still fill the picker — an empty period must not strand you with no way
    // back to a period that does have data.
    if (res.data) {
      rrData = res.data;
      rrSelectedPeriod = res.data.periodFrom || '';
      rrRenderPeriodPicker(res.data);
    }
    document.getElementById('rrEmpty').classList.remove('hidden');
    return;
  }

  rrData = res.data;
  rrSelectedPeriod = res.data.periodFrom || '';
  renderReplenishReport(rrData);
}

// ── Period picker ──
function rrRenderPeriodPicker(d) {
  const sel = document.getElementById('rrPeriodSelect');
  if (!sel) return;

  const periods = d.periods || [];
  if (periods.length <= 1) {
    // Nothing to navigate to — hide the control rather than show a dead dropdown.
    document.getElementById('rrPeriodPicker').classList.add('hidden');
    return;
  }
  document.getElementById('rrPeriodPicker').classList.remove('hidden');

  const shortDate = (s) => new Date(s + 'T00:00:00')
    .toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });

  sel.innerHTML = periods.map(p => {
    const tag   = p.isCurrent ? ' • Current' : '';
    const topUp = p.openingTopUp > 0 ? ` — ${fmt(p.openingTopUp)} top-up` : '';
    return `<option value="${p.from}">${shortDate(p.from)} → ${shortDate(p.to)}${topUp}${tag}</option>`;
  }).join('');

  sel.value = d.periodFrom;
  const i = sel.selectedIndex;
  // periods arrive newest-first, so "older" walks down the list.
  document.getElementById('rrNewerBtn').disabled = i <= 0;
  document.getElementById('rrOlderBtn').disabled = i >= periods.length - 1;

  const badge = document.getElementById('rrHistoricalBadge');
  badge.classList.toggle('hidden', !!d.isCurrentPeriod);
  badge.classList.toggle('flex',   !d.isCurrentPeriod);
}

function rrShiftPeriod(delta) {
  const sel = document.getElementById('rrPeriodSelect');
  const i   = sel.selectedIndex + delta;   // +1 = older, -1 = newer
  if (i < 0 || i >= sel.options.length) return;
  sel.selectedIndex = i;
  loadReplenishReport(sel.value);
}

function toggleRrDetails() {
  rrDetailedActive = !rrDetailedActive;
  
  // Update UI Elements
  const label = document.getElementById('rrDetailsLabel');
  const btn   = document.getElementById('btn-rrDetails');
  const detailRows = document.querySelectorAll('.rr-detail-row');
  
  if (rrDetailedActive) {
    label.textContent = 'Hide Details';
    btn.classList.replace('bg-white', 'bg-blue-600');
    btn.classList.replace('text-gray-600', 'text-white');
    btn.classList.replace('border-gray-300', 'border-blue-700');
    detailRows.forEach(row => row.classList.remove('hidden'));
  } else {
    label.textContent = 'Show Details';
    btn.classList.replace('bg-blue-600', 'bg-white');
    btn.classList.replace('text-white', 'text-gray-600');
    btn.classList.replace('border-blue-700', 'border-gray-300');
    detailRows.forEach(row => row.classList.add('hidden'));
  }
}

function renderReplenishReport(d) {
  // Reset state on new report load
  rrDetailedActive = false;
  const btn = document.getElementById('btn-rrDetails');
  if (btn) btn.className = "px-3 py-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-600 text-[10px] font-bold rounded-lg shadow-sm transition flex items-center gap-1.5";
  document.getElementById('rrDetailsLabel').textContent = 'Show Details';

  rrRenderPeriodPicker(d);

  // ── Period Banner ──
  const fromDate = new Date(d.periodFrom + 'T00:00:00');
  const toDate   = new Date(d.periodTo   + 'T00:00:00');

  const fmtDate  = (dt) => dt.toLocaleDateString('en-PH', {
    month: 'long', day: 'numeric', year: 'numeric'
  });

  document.getElementById('rr-periodLabel').textContent =
    `${fmtDate(fromDate)} — ${fmtDate(toDate)}`;

  // Day count
  const msPerDay = 1000 * 60 * 60 * 24;
  const dayCount = Math.round((toDate - fromDate) / msPerDay) + 1;
  document.getElementById('rr-dayCount').textContent = dayCount;
  document.getElementById('rr-tableSubtitle').textContent =
    `${d.dailyRows.length} active day${d.dailyRows.length !== 1 ? 's' : ''}`;

  // ── Replenishment Calculation ──
  document.getElementById('rr-cashOnHand').textContent      = fmt(d.cashOnHand);
  document.getElementById('rr-advOutstanding').textContent  = fmt(d.advancesOutstanding);
  document.getElementById('rr-accounted').textContent       = fmt(d.accounted);
  document.getElementById('rr-fundCeiling').textContent     = fmt(d.fundCeiling);
  document.getElementById('rr-toReplenish').textContent     = fmt(d.toReplenish);

  // ── Everything the Business-only toggle can change ──
  rrRenderFigures(d);

  // Show content
  document.getElementById('rrContent').classList.remove('hidden');
}

// The half of the report that depends on which view is selected. Split out of
// renderReplenishReport() so flipping the toggle redraws exactly these panels
// and nothing else — no server round trip, no period-picker reset.
function rrRenderFigures(d) {
  const v = rrView();

  rrRenderFilterBar(d);

  // ── Period Stats ──
  document.getElementById('rr-totalExpenses').textContent      = fmt(v.totalExpenses);
  document.getElementById('rr-totalReplenishment').textContent = fmt(v.totalReplenishment);

  // Captions carry the qualifier, so a screenshot of a card is never ambiguous
  // about which of the two readings it is showing.
  const expNote = document.getElementById('rr-totalExpensesNote');
  const repNote = document.getElementById('rr-totalReplenishmentNote');
  if (expNote) {
    expNote.textContent = rrBusinessOnly
      ? 'Excludes personal draws'
      : ((d.personalExpenses || 0) > 0
          ? `Incl. ${fmt(d.personalExpenses)} personal`
          : 'This period transactions');
    expNote.classList.toggle('text-amber-600', !rrBusinessOnly && (d.personalExpenses || 0) > 0);
    expNote.classList.toggle('opacity-60',     rrBusinessOnly || !(d.personalExpenses > 0));
  }
  if (repNote) {
    repNote.textContent = rrBusinessOnly
      ? 'Ceiling top-ups only'
      : ((d.nonCeilingReplenishment || 0) > 0
          ? `Incl. ${fmt(d.nonCeilingReplenishment)} personal payback`
          : 'Funds received in period');
    repNote.classList.toggle('text-amber-600', !rrBusinessOnly && (d.nonCeilingReplenishment || 0) > 0);
    repNote.classList.toggle('opacity-60',     rrBusinessOnly || !(d.nonCeilingReplenishment > 0));
  }

  const net    = v.totalReplenishment - v.totalExpenses;
  const netEl  = document.getElementById('rr-netMovement');
  netEl.textContent = (net >= 0 ? '+' : '') + fmt(net);
  netEl.className   = 'text-xl font-black font-mono ' +
    (net >= 0 ? 'text-green-600' : 'text-red-600');

  // ── Accountability roll-ups ──
  renderRrCategoryBreakdown(v.categoryBreakdown, v.totalExpenses);
  renderRrReceiptCoverage(v.withReceipt, v.withoutReceipt);

  // ── Fused Table ──
  renderRrFusedTable(d.dailyRows, d.periodEntries);

  // ── Journal (grouped by receipt type) ──
  renderRrJournal(v.journal);

  // The daily table was just rebuilt from scratch, and its nested rows come
  // back hidden. Re-apply "Show Details" so flipping the view does not collapse
  // them under a button that still reads "Hide Details".
  if (rrDetailedActive) {
    document.querySelectorAll('.rr-detail-row').forEach(row => row.classList.remove('hidden'));
  }
}

// The toggle, its caption, and the "what is being held out" strip. Keeps the
// checkbox in step with the state after a period change, and says plainly which
// figures the filter does NOT touch.
function rrRenderFilterBar(d) {
  const box  = document.getElementById('rrBusinessOnly');
  const wrap = document.getElementById('rrBusinessOnlyWrap');
  const note = document.getElementById('rrFilterNote');
  if (box) box.checked = rrBusinessOnly;

  // Nothing personal in this period — leave the control there (so the state is
  // never hidden while it is on) but mute it, since it would change nothing.
  if (wrap) {
    const idle = !rrHasExcludable();
    wrap.classList.toggle('opacity-50', idle && !rrBusinessOnly);
    wrap.classList.toggle('border-indigo-400', rrBusinessOnly);
    wrap.classList.toggle('bg-indigo-50', rrBusinessOnly);
  }

  if (!note) return;

  const pExp  = d.personalExpenses        || 0;
  const pRep  = d.nonCeilingReplenishment || 0;
  const lines = (d.journal && d.journal.personalCount) || 0;

  if (!rrBusinessOnly) {
    note.classList.add('hidden');
    note.classList.remove('flex');
    note.innerHTML = '';
    return;
  }

  const held = [];
  if (pExp > 0) held.push(`<b>${fmt(pExp)}</b> personal spend${lines ? ` (${lines} journal line${lines === 1 ? '' : 's'})` : ''}`);
  if (pRep > 0) held.push(`<b>${fmt(pRep)}</b> personal repayment — not a ceiling top-up`);

  note.classList.remove('hidden');
  note.classList.add('flex');
  note.innerHTML = `
    <span class="shrink-0">🔎</span>
    <span>
      <b class="uppercase tracking-wide text-[10px]">Business only</b> —
      ${held.length ? 'holding out ' + held.join(' and ') + '.' : 'nothing personal recorded in this period.'}
      <span class="block text-indigo-500 mt-0.5">
        Cash on Hand, Accounted Cash and Amount to Replenish are unfiltered — that cash really moved the drawer.
      </span>
    </span>`;
}

// =============================================
// REPLENISHMENT JOURNAL
// =============================================

// Which section the pane is showing. Reset on every report load so a period
// change never leaves you looking at a tab that no longer has rows.
let rrJournalTab = '';

// Always the journal for the view on screen, so the tab strip, the pane and the
// drill-down can never be reading a different set of lines from each other.
function rrJournalSections() {
  const j = rrView().journal;
  return (j && j.sections) || [];
}

// Empty sections are dropped from the tab strip — except UNTAGGED, which is
// only ever non-empty, and must stay visible when it is: those are receipted
// lines recorded before tagging existed and they need classifying before the
// journal balances.
function rrJournalVisibleSections() {
  return rrJournalSections().filter(s => s.count > 0);
}

function renderRrJournal(journal) {
  const wrap = document.getElementById('rrJournal');
  if (!wrap) return;

  const sections = rrJournalVisibleSections();

  if (!journal || sections.length === 0) {
    document.getElementById('rrJournalTabs').innerHTML = '';
    document.getElementById('rrJournalPane').innerHTML =
      `<p class="text-sm text-gray-400 italic py-6 text-center">No receipted spend in this period</p>`;
    document.getElementById('rrJournalFoot').innerHTML = '';
    return;
  }

  // Keep the current tab if it still has rows, otherwise fall to the first.
  if (!sections.some(s => s.key === rrJournalTab)) rrJournalTab = sections[0].key;

  renderRrJournalTabs();
  renderRrJournalPane();

  const jt = journal.grandTotal || 0;

  // In the all-in view, say how much of the total is personal — the figure a
  // "business only" reading would take out — so the two views reconcile on
  // sight instead of the bookkeeper having to flip between them.
  const pers = journal.personalTotal || 0;
  const foot = rrBusinessOnly
    ? `<div class="text-[10px] text-indigo-600 mt-0.5 font-semibold">Business only — personal draws excluded</div>`
    : (pers > 0
        ? `<div class="text-[10px] text-amber-600 mt-0.5">Includes ${fmt(pers)} personal (repayable) — tick "Business only" to hold it out</div>`
        : '');

  document.getElementById('rrJournalFoot').innerHTML = `
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <div>
        <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Journal Total</div>
        <div class="text-[10px] text-gray-400 mt-0.5">
          ${journal.entryCount} receipted line${journal.entryCount === 1 ? '' : 's'} across ${sections.length} section${sections.length === 1 ? '' : 's'}
        </div>
        ${foot}
      </div>
      <div class="text-xl font-black font-mono text-gray-800">${fmt(jt)}</div>
    </div>`;
}

function renderRrJournalTabs() {
  const el = document.getElementById('rrJournalTabs');
  if (!el) return;

  el.innerHTML = rrJournalVisibleSections().map(s => {
    const active = s.key === rrJournalTab;
    const base   = 'shrink-0 px-3 py-2 rounded-lg text-left transition border';
    const cls    = active
      ? 'bg-indigo-600 border-indigo-700 text-white shadow-sm'
      : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50';
    return `
      <button onclick="switchRrJournalTab('${s.key}')" class="${base} ${cls}">
        <div class="text-[10px] font-bold uppercase tracking-wide whitespace-nowrap">${escHtml(s.label)}</div>
        <div class="text-xs font-mono font-bold ${active ? 'text-white' : 'text-gray-800'}">${fmt(s.total)}</div>
      </button>`;
  }).join('');
}

function switchRrJournalTab(key) {
  rrJournalTab = key;
  renderRrJournalTabs();
  renderRrJournalPane();
}

function renderRrJournalPane() {
  const pane = document.getElementById('rrJournalPane');
  if (!pane) return;

  const s = rrJournalSections().find(x => x.key === rrJournalTab);
  if (!s) { pane.innerHTML = ''; return; }

  pane.innerHTML = s.itemized ? rrJournalItemizedHtml(s) : rrJournalGroupedHtml(s);
}

// What each section means, shown above its table and again in the drill-down.
function rrJournalNote(key) {
  return {
    NONE    : 'Undocumented spend — no receipt of any kind on file.',
    ACK     : 'Acknowledgement receipt only — not an official receipt, no input VAT claimable.',
    NON_VAT : 'Non-VAT supplier — booked at face value, no input VAT.',
    VAT     : 'Official receipts — each line carries its own OR, so input VAT stays traceable.',
    UNTAGGED: 'Recorded before receipt tagging existed. Classify these lines so they post to the right section.'
  }[key] || '';
}

// Flags how much of a posting line is the Admin's personal draw. Only shown in
// the all-in view — in the business-only journal there is nothing to flag, and
// a badge reading "0 personal" would just add noise.
function rrPersonalTag(amount) {
  if (rrBusinessOnly || !amount || amount <= 0) return '';
  return `<span class="ml-1.5 inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded text-[9px] font-bold
    bg-amber-100 text-amber-700 align-middle whitespace-nowrap" title="Personal draw — repayable to the fund">
    👤 ${fmt(amount)}</span>`;
}

// "of which personal" under a section total — an inside-the-total figure, never
// added on top, so the section still foots to the amount above it.
function rrSectionPersonalFootRow(s, spanBefore) {
  if (rrBusinessOnly || !s.personalTotal || s.personalTotal <= 0) return '';
  return `
    <tr class="border-t border-dashed border-amber-200 bg-amber-50/40">
      <td colspan="${spanBefore - 2}" class="px-4 py-2 text-[10px] font-bold text-amber-700 uppercase tracking-wider">
        👤 of which personal (repayable)
      </td>
      <td class="px-4 py-2 text-right font-mono font-bold text-amber-700">${fmt(s.personalTotal)}</td>
      <td class="px-3 py-2"></td>
    </tr>`;
}

// Summed by Account Type — the bookkeeper posts one line per account. Each row
// opens the transactions behind it, so the posting line can be traced to the
// receipts it was built from.
function rrJournalGroupedHtml(s) {
  const note = rrJournalNote(s.key);

  const rows = s.groups.map((g, i) => `
    <tr onclick="openRrJournalDetailAt('${s.key}', ${i})"
      class="group border-b border-gray-50 last:border-0 hover:bg-indigo-50/40 transition cursor-pointer">
      <td class="px-4 py-2.5 text-sm text-gray-700 font-medium">
        ${escHtml(g.accountType)}${rrPersonalTag(g.personal)}</td>
      <td class="px-4 py-2.5 text-xs text-gray-400 text-center">${g.count}</td>
      <td class="px-4 py-2.5 text-sm text-right font-mono font-bold text-gray-800">${fmt(g.amount)}</td>
      <td class="px-3 py-2.5 text-right whitespace-nowrap">
        <span class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-[10px] font-bold uppercase tracking-wide
          bg-white border border-gray-200 text-gray-500 group-hover:border-indigo-300 group-hover:text-indigo-600 transition">
          Details <span class="text-xs leading-none">›</span>
        </span>
      </td>
    </tr>`).join('');

  return `
    ${note ? `<p class="text-[11px] text-gray-500 mb-3 italic">${note}</p>` : ''}
    <div class="overflow-x-auto">
      <table class="w-full text-sm min-w-[460px]">
        <thead class="bg-gray-50 border-b border-gray-100">
          <tr>
            <th class="px-4 py-2.5 text-left text-[10px] font-bold text-gray-500 uppercase tracking-wider">Account Type</th>
            <th class="px-4 py-2.5 text-center text-[10px] font-bold text-gray-500 uppercase tracking-wider">Entries</th>
            <th class="px-4 py-2.5 text-right text-[10px] font-bold text-gray-500 uppercase tracking-wider">Amount</th>
            <th class="px-3 py-2.5"></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot class="border-t-2 border-gray-200 bg-gray-50">
          <tr>
            <td class="px-4 py-2.5 text-[10px] font-bold text-gray-600 uppercase tracking-wider">${escHtml(s.label)} Total</td>
            <td class="px-4 py-2.5 text-xs text-gray-400 text-center">${s.count}</td>
            <td class="px-4 py-2.5 text-right font-mono font-black text-gray-900">${fmt(s.total)}</td>
            <td class="px-3 py-2.5"></td>
          </tr>
          ${rrSectionPersonalFootRow(s, 4)}
        </tfoot>
      </table>
    </div>`;
}

// Itemised — every VAT line shown individually with its Account Type, because
// input VAT has to be traceable to a specific official receipt.
function rrJournalItemizedHtml(s) {
  const dayLabel = (d) => new Date(d + 'T00:00:00')
    .toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });

  const rows = s.items.map((i, idx) => `
    <tr onclick="openRrJournalDetailForItem('${s.key}', ${idx})"
      class="border-b border-gray-50 last:border-0 hover:bg-indigo-50/40 transition cursor-pointer">
      <td class="px-3 py-2.5 text-xs text-gray-500 whitespace-nowrap">${dayLabel(i.date)}</td>
      <td class="px-3 py-2.5 text-xs text-gray-700 font-medium">${escHtml(i.accountType)}</td>
      <td class="px-3 py-2.5 text-xs text-gray-700">
        ${!rrBusinessOnly && i.isPersonal ? '<span class="mr-1 px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 text-[9px] font-bold align-middle" title="Personal draw — repayable, input VAT not claimable">👤 PERSONAL</span>' : ''}
        ${escHtml(i.description || '—')}
        ${i.supplierName ? `<div class="text-[10px] text-gray-400 truncate">${escHtml(i.supplierName)}</div>` : ''}
      </td>
      <td class="px-3 py-2.5 text-xs font-mono text-gray-400 whitespace-nowrap">${escHtml(i.receiptNo || '—')}</td>
      <td class="px-3 py-2.5 text-sm text-right font-mono font-bold text-gray-800 whitespace-nowrap">${fmt(i.amount)}</td>
      <td class="px-3 py-2.5 text-xs text-right font-mono text-emerald-700 whitespace-nowrap">${fmt(i.vatAmount)}</td>
      <td class="px-2 py-2.5 text-right text-gray-300 text-xs">🧾</td>
    </tr>`).join('');

  return `
    <p class="text-[11px] text-gray-500 mb-3 italic">
      Itemised — each line carries its own official receipt, so input VAT stays traceable to an OR.
      Click a line to open its receipt.
    </p>
    <div class="overflow-x-auto">
      <table class="w-full text-sm min-w-[680px]">
        <thead class="bg-gray-50 border-b border-gray-100">
          <tr>
            <th class="px-3 py-2.5 text-left text-[10px] font-bold text-gray-500 uppercase tracking-wider">Date</th>
            <th class="px-3 py-2.5 text-left text-[10px] font-bold text-gray-500 uppercase tracking-wider">Account Type</th>
            <th class="px-3 py-2.5 text-left text-[10px] font-bold text-gray-500 uppercase tracking-wider">Description</th>
            <th class="px-3 py-2.5 text-left text-[10px] font-bold text-gray-500 uppercase tracking-wider">OR No.</th>
            <th class="px-3 py-2.5 text-right text-[10px] font-bold text-gray-500 uppercase tracking-wider">Amount</th>
            <th class="px-3 py-2.5 text-right text-[10px] font-bold text-gray-500 uppercase tracking-wider">VAT</th>
            <th class="px-2 py-2.5"></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot class="border-t-2 border-gray-200 bg-gray-50">
          <tr>
            <td colspan="4" class="px-3 py-2.5 text-[10px] font-bold text-gray-600 uppercase tracking-wider">
              ${escHtml(s.label)} Total &middot; ${s.count} line${s.count === 1 ? '' : 's'}
            </td>
            <td class="px-3 py-2.5 text-right font-mono font-black text-gray-900">${fmt(s.total)}</td>
            <td class="px-3 py-2.5 text-right font-mono font-black text-emerald-700">${fmt(s.vatTotal || 0)}</td>
            <td class="px-2 py-2.5"></td>
          </tr>
          ${!rrBusinessOnly && s.personalTotal > 0 ? `
          <tr class="border-t border-dashed border-amber-200 bg-amber-50/40">
            <td colspan="4" class="px-3 py-2 text-[10px] font-bold text-amber-700 uppercase tracking-wider">
              👤 of which personal — input VAT not claimable
            </td>
            <td class="px-3 py-2 text-right font-mono font-bold text-amber-700">${fmt(s.personalTotal)}</td>
            <td colspan="2"></td>
          </tr>` : ''}
        </tfoot>
      </table>
    </div>

    <!-- Per-account roll-up, so the VAT batch can still be posted by account -->
    <div class="mt-5 pt-4 border-t border-dashed border-gray-200">
      <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">VAT spend by Account Type</p>
      <div class="space-y-1">
        ${s.groups.map((g, i) => `
          <div onclick="openRrJournalDetailAt('${s.key}', ${i})"
            class="flex items-center justify-between text-xs py-1 px-1.5 -mx-1.5 rounded cursor-pointer hover:bg-indigo-50/50 transition">
            <span class="text-gray-600">${escHtml(g.accountType)} <span class="text-gray-300">&middot; ${g.count}</span>${rrPersonalTag(g.personal)}</span>
            <span class="font-mono font-bold text-gray-800">${fmt(g.amount)}</span>
          </div>`).join('')}
      </div>
    </div>`;
}

// =============================================
// JOURNAL DRILL-DOWN — the transactions behind a posting line
// =============================================
// A journal row is a total; this is what it was built from. Every line shows the
// receipt filed against it and carries the two fix-ups the journal exists to
// prompt: re-tag the receipt type, and add or edit the receipt itself.

let rrJrnCtx      = null;   // { sectionKey, accountType } — survives a refresh
let rrJrnLines    = [];     // the section/account's items, oldest first
let rrJrnExpanded = {};     // entry id -> receipt panel open?

function rrJrnSection() {
  return rrJrnCtx ? rrJournalSections().find(s => s.key === rrJrnCtx.sectionKey) : null;
}

// Resolved by index so an account name containing a quote can never break the
// inline onclick — only the safe integer index is interpolated.
function openRrJournalDetailAt(sectionKey, groupIndex) {
  const s = rrJournalSections().find(x => x.key === sectionKey);
  const g = s && s.groups[groupIndex];
  if (g) openRrJournalDetail(sectionKey, g.accountType);
}

// From an itemised (VAT) row — opens that line's account and expands its receipt.
function openRrJournalDetailForItem(sectionKey, itemIndex) {
  const s = rrJournalSections().find(x => x.key === sectionKey);
  const i = s && s.items && s.items[itemIndex];
  if (!i) return;
  rrJrnExpanded = { [i.id]: true };
  openRrJournalDetail(sectionKey, i.accountType, true);
}

function openRrJournalDetail(sectionKey, accountType, keepExpanded) {
  const s = rrJournalSections().find(x => x.key === sectionKey);
  if (!s) return;

  rrJrnCtx = { sectionKey, accountType };
  if (!keepExpanded) rrJrnExpanded = {};
  rrJrnLines = (s.items || []).filter(i => i.accountType === accountType);

  document.getElementById('rrJrnModal').classList.remove('hidden');
  rrJrnRender();
}

function closeRrJournalDetail() {
  document.getElementById('rrJrnModal').classList.add('hidden');
  rrJrnCtx      = null;
  rrJrnLines    = [];
  rrJrnExpanded = {};
}

function rrJrnToggleLine(idx) {
  const line = rrJrnLines[idx];
  if (!line) return;
  rrJrnExpanded[line.id] = !rrJrnExpanded[line.id];
  rrJrnRender();
}

function rrJrnRender() {
  const s = rrJrnSection();
  if (!s || !rrJrnCtx) return;

  const total = rrJrnLines.reduce((t, i) => t + (parseFloat(i.amount) || 0), 0);

  document.getElementById('rrJrnModalTitle').textContent = rrJrnCtx.accountType;
  document.getElementById('rrJrnModalSub').textContent   =
    `${s.label} · ${rrData.periodFrom} → ${rrData.periodTo}`;
  document.getElementById('rrJrnModalTotal').textContent = fmt(total);
  document.getElementById('rrJrnModalNote').textContent  = rrJournalNote(s.key);
  document.getElementById('rrJrnModalCount').textContent =
    `${rrJrnLines.length} line${rrJrnLines.length === 1 ? '' : 's'}`;

  document.getElementById('rrJrnModalBody').innerHTML = rrJrnLines.length
    ? rrJrnLines.map((i, idx) => rrJrnLineHtml(i, idx, s.key)).join('')
    : `<p class="text-sm text-gray-400 italic py-10 text-center">
         Every line here has been reclassified — it now sits in another section.
       </p>`;
}

function rrJrnLineHtml(i, idx, sectionKey) {
  const dateLabel = new Date(i.date + 'T00:00:00')
    .toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
  const open = !!rrJrnExpanded[i.id];

  return `
    <div class="bg-white border ${open ? 'border-indigo-200 shadow-sm' : 'border-gray-200'} rounded-xl overflow-hidden transition">

      <div onclick="rrJrnToggleLine(${idx})" class="flex items-center gap-3 px-3 sm:px-4 py-3 cursor-pointer hover:bg-gray-50/70 transition">
        <span class="shrink-0 text-gray-300 text-xs w-3">${open ? '▾' : '▸'}</span>
        <span class="shrink-0 text-[11px] text-gray-500 font-mono w-[76px]">${dateLabel}</span>
        <div class="min-w-0 flex-1">
          <div class="text-sm text-gray-700 font-medium truncate">
            ${i.isPersonal ? '<span class="mr-1 px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 text-[9px] font-bold align-middle" title="Personal draw — repayable to the fund">👤 PERSONAL</span>' : ''}
            ${escHtml(i.description || '—')}
          </div>
          <div class="text-[10px] text-gray-400 truncate">
            ${i.supplierName ? escHtml(i.supplierName) : 'No supplier on file'}
            ${i.receiptNo ? ` &middot; OR# ${escHtml(i.receiptNo)}` : ''}
            ${i.requestedBy ? ` &middot; ${escHtml(i.requestedBy)}` : ''}
          </div>
        </div>
        ${receiptTypeBadgeHtml(i.receiptType, 'shrink-0 hidden sm:inline-block')}
        <span class="shrink-0 text-sm font-mono font-bold text-gray-800 tabular-nums w-24 text-right">${fmt(i.amount)}</span>
      </div>

      ${open ? rrJrnLinePanelHtml(i, idx, sectionKey) : ''}
    </div>`;
}

// The receipt behind one line, plus the two things you can do about it.
function rrJrnLinePanelHtml(i, idx, sectionKey) {
  const field = (label, value) => `
    <div class="flex justify-between gap-3 py-1.5 border-b border-gray-100 last:border-0">
      <span class="text-[11px] text-gray-400 uppercase tracking-wide shrink-0">${label}</span>
      <span class="text-xs text-gray-700 font-medium text-right break-words">${escHtml(value || '—')}</span>
    </div>`;

  // Only the VAT section has a split to show. Non-VAT, acknowledgement and
  // untagged lines are booked at face value, so no 12% figure is displayed —
  // the amount itself is the whole story.
  const vatRows = (sectionKey === 'VAT' && i.vatAmount != null) ? `
    <div class="flex justify-between gap-3 py-1.5 border-b border-gray-100">
      <span class="text-[11px] text-gray-400 uppercase tracking-wide">Less: VAT (12%)</span>
      <span class="text-xs font-mono text-red-500 font-semibold">${fmt(i.vatAmount)}</span>
    </div>
    <div class="flex justify-between gap-3 py-1.5">
      <span class="text-[11px] text-gray-400 uppercase tracking-wide">Net of VAT</span>
      <span class="text-xs font-mono font-bold text-emerald-700">${fmt(i.vatableSales)}</span>
    </div>` : '';

  const receiptCard = i.hasReceipt ? `
    <div class="rounded-lg border border-emerald-200 bg-emerald-50/40 p-3">
      <p class="text-[10px] font-bold text-emerald-700 uppercase tracking-widest mb-2">🧾 Official receipt on file</p>
      ${field('Supplier',  i.supplierName)}
      ${field('OR No.',    i.receiptNo)}
      ${field('TIN',       i.tin)}
      ${field('Address',   i.address)}
      <div class="flex justify-between gap-3 py-1.5 ${vatRows ? 'border-b border-gray-100' : ''}">
        <span class="text-[11px] text-gray-400 uppercase tracking-wide">Amount</span>
        <span class="text-xs font-mono font-bold text-gray-800">${fmt(i.amount)}</span>
      </div>
      ${vatRows}
    </div>` : `
    <div class="rounded-lg border border-dashed border-gray-300 bg-gray-50 p-3 text-center">
      <p class="text-xs text-gray-500">
        ${i.receiptType === 'ACK'
          ? 'Acknowledgement receipt only — nothing filed with the BIR records.'
          : 'No official receipt on file for this line.'}
      </p>
    </div>`;

  const tagOptions = RECEIPT_TYPE_OPTIONS.map(o =>
    `<option value="${o.value}" ${i.receiptType === o.value ? 'selected' : ''}>${o.label}</option>`
  ).join('');

  return `
    <div class="px-3 sm:px-4 pb-4 pt-1 space-y-3 bg-gray-50/50 border-t border-gray-100">
      ${receiptCard}

      <div class="flex flex-col sm:flex-row sm:items-end gap-2">
        <div class="flex-1 min-w-0">
          <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wide mb-1">Receipt type</label>
          <select onchange="rrJrnRetag(${idx}, this.value)"
            class="w-full p-2 border ${i.receiptType === 'UNTAGGED' ? 'border-rose-300 bg-rose-50' : 'border-gray-200 bg-white'} rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-400">
            ${i.receiptType === 'UNTAGGED' ? '<option value="" selected>— Classify this line —</option>' : ''}
            ${tagOptions}
          </select>
        </div>
        <button onclick="rrJrnOpenReceipt(${idx})"
          class="shrink-0 px-3 py-2 rounded-lg text-xs font-bold transition min-h-[38px] ${
            i.hasReceipt
              ? 'border border-emerald-300 text-emerald-700 bg-emerald-50 hover:bg-emerald-100'
              : 'border-2 border-dashed border-gray-300 text-gray-500 hover:border-green-400 hover:text-green-600 hover:bg-green-50'
          }">
          ${i.hasReceipt ? '✏️ Edit receipt' : '🧾 Add receipt'}
        </button>
      </div>
    </div>`;
}

// ── Re-tag one line ──
async function rrJrnRetag(idx, value) {
  const line = rrJrnLines[idx];
  if (!line || !value || value === line.receiptType) { rrJrnRender(); return; }

  // VAT / Non-VAT assert an official receipt exists. When none is on file, the
  // receipt has to be captured first — the tag and the BIR record must agree —
  // so the choice opens the receipt form instead of failing against the server.
  if (receiptTypeNeedsReceipt(value) && !line.hasReceipt) {
    rrJrnOpenReceipt(idx, value);
    return;
  }

  const res = await callServer('updateEntryReceiptTag', {
    entryId    : line.id,
    receiptType: value
  });

  if (!res.success) {
    toast(res.message || 'Could not change the receipt type', 'error');
    rrJrnRender();   // snap the select back to what is actually on file
    return;
  }

  toast(`Tagged ${receiptTypeShort(value)} ✓`, 'success');
  await rrJrnRefresh();
}

// ── Add / edit the receipt behind one line ──
async function rrJrnOpenReceipt(idx, presetType) {
  const line = rrJrnLines[idx];
  if (!line) return;

  const onSaved = () => rrJrnRefresh();

  if (line.hasReceipt) {
    const res = await callServer('getReceiptByEntryId', line.id);
    if (res.success && res.data) {
      openReceiptModal({
        mode         : 'view',
        receiptData  : res.data,
        entryId      : line.id,
        receiptType  : presetType || res.data.receiptType || line.receiptType,
        fromEditModal: true,          // makes the fields editable + shows Save
        onSaved
      });
      return;
    }
  }

  const type = presetType || (receiptTypeNeedsReceipt(line.receiptType) ? line.receiptType : '');
  if (!type) {
    toast('Tag this line VAT or Non-VAT first — those are the tags that carry an official receipt.', 'warning');
    return;
  }

  openReceiptModal({
    mode       : 'attach',
    entryId    : line.id,
    date       : line.date,           // file it on the entry's own date
    grossAmount: line.amount,
    receiptType: type,
    onSaved
  });
}

// Re-pull the period, then land back on the same account so a run of lines can
// be classified without reopening the drill-down each time.
async function rrJrnRefresh() {
  const ctx = rrJrnCtx;
  await loadReplenishReport();
  if (!ctx) return;

  const s = rrJournalSections().find(x => x.key === ctx.sectionKey);
  const stillThere = s && (s.items || []).some(i => i.accountType === ctx.accountType);
  if (stillThere) openRrJournalDetail(ctx.sectionKey, ctx.accountType, true);
  else            closeRrJournalDetail();
}

// ── Write the journal into the database spreadsheet, one tab per receipt type ──
async function exportReplenishJournal(btn) {
  if (!rrData) { toast('No report data to export', 'warning'); return; }

  btnLoad(btn, true);
  // The tabs get whichever view is on screen — writing the all-in journal while
  // the page shows business-only would put personal draws into the posting
  // sheet the bookkeeper works from.
  const res = await callServer('exportReplenishmentJournal', {
    periodFrom     : rrData.periodFrom,
    excludePersonal: rrBusinessOnly
  });
  btnLoad(btn, false);

  if (!res.success) {
    toast(res.message || 'Failed to write the journal to Sheets', 'error');
    return;
  }

  const rows = (res.data.written || []).reduce((s, w) => s + w.rows, 0);
  toast(`Journal written${rrBusinessOnly ? ' (business only)' : ''} — ` +
        `${rows} row(s) across ${res.data.written.length} tab(s) ✓`, 'success');
}

function renderRrCategoryBreakdown(rows, total) {
  const el = document.getElementById('rr-categoryBreakdown');
  if (!el) return;

  if (!rows || rows.length === 0) {
    el.innerHTML = `<p class="text-sm text-gray-400 italic py-4 text-center">No expenses in this period</p>`;
    return;
  }

  const max = rows[0].amount || 1;   // rows arrive largest-first from the server

  el.innerHTML = rows.map((r, i) => {
    const pctOfMax = Math.max(2, (r.amount / max) * 100);
    // Prefer the server's percent — it is computed against the same total the
    // roll-ups reconcile to. Fall back for snapshots saved before that field.
    const pctOfTot = (r.percent !== undefined && r.percent !== null)
      ? r.percent
      : (total > 0 ? Math.round((r.amount / total) * 100) : 0);
    const color    = RR_COLORS[i % RR_COLORS.length];
    return `
      <div onclick="openRrCategoryDetail(${i})"
        class="no-break-inside cursor-pointer group hover:bg-slate-50 p-1.5 rounded-lg transition-all duration-200">
        <div class="flex items-center justify-between mb-1 gap-2">
          <span class="text-xs font-medium text-gray-700 truncate group-hover:text-blue-600 transition-colors" title="${escHtml(r.category)}">${escHtml(r.category)}</span>
          <span class="text-xs font-mono font-bold text-gray-800 shrink-0">
            ${fmt(r.amount)}
            <span class="text-[10px] text-gray-400 font-sans ml-0.5">${pctOfTot}%</span>
          </span>
        </div>
        <div class="h-2 w-full bg-gray-100 rounded-full overflow-hidden shadow-inner">
          <div class="h-full rounded-full transition-all duration-1000 ease-out" style="width:${pctOfMax}%; background:${color}"></div>
        </div>
      </div>`;
  }).join('');
}

// =============================================
// CATEGORY DRILL-DOWN MODAL
// =============================================

// Resolved by index so a category name containing an apostrophe can never
// break the inline onclick — only the safe integer index is interpolated.
function openRrCategoryDetail(i) {
  // Index into the breakdown that was actually drawn — the business-only list
  // is shorter and reordered, so rrData's copy would open the wrong category.
  const cat = rrView().categoryBreakdown && rrView().categoryBreakdown[i];
  if (!cat) return;
  openRrDetailModal(cat.category);
}

function openRrDetailModal(category) {
  if (!rrData) return;

  rrModalCategory = category;
  rrModalEntries  = (rrData.expenseEntries || [])
    .filter(e => String(e.category).trim() === String(category).trim())
    // Same filter as the bar that was clicked, so the modal's total matches it.
    .filter(e => !(rrBusinessOnly && e.isPersonal));
  rrModalFiltered = [...rrModalEntries];
  rrModalPage     = 1;

  const total = rrModalEntries.reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);

  document.getElementById('rrDetailModalTitle').textContent = category;
  document.getElementById('rrDetailModalSub').textContent   =
    `${rrData.periodFrom} → ${rrData.periodTo}`;
  document.getElementById('rrDetailModalTotal').textContent = fmt(total);
  document.getElementById('rrDetailSearch').value = '';

  rrDetailRender();
  document.getElementById('rrDetailModal').classList.remove('hidden');
}

function closeRrDetailModal() {
  document.getElementById('rrDetailModal').classList.add('hidden');
  rrModalEntries  = [];
  rrModalFiltered = [];
  rrModalCategory = '';
}

function rrDetailFilterAndRender() {
  const q = document.getElementById('rrDetailSearch').value.toLowerCase();
  rrModalFiltered = rrModalEntries.filter(e =>
    (e.description  || '').toLowerCase().includes(q) ||
    (e.supplierName || '').toLowerCase().includes(q) ||
    (e.receiptNo    || '').toLowerCase().includes(q) ||
    (e.referenceNo  || '').toLowerCase().includes(q) ||
    (e.requestedBy  || '').toLowerCase().includes(q)
  );
  rrModalPage = 1;
  rrDetailRender();
}

function rrDetailRender() {
  const total    = rrModalFiltered.length;
  const pages    = Math.max(1, Math.ceil(total / RR_PAGE_SIZE));
  rrModalPage    = Math.min(rrModalPage, pages);
  const start    = (rrModalPage - 1) * RR_PAGE_SIZE;
  const pageRows = rrModalFiltered.slice(start, start + RR_PAGE_SIZE);

  document.getElementById('rrDetailCount').textContent     = `${total} entr${total === 1 ? 'y' : 'ies'}`;
  document.getElementById('rrDetailPageLabel').textContent = `Page ${rrModalPage} of ${pages}`;
  document.getElementById('rrDetailPrev').disabled         = rrModalPage <= 1;
  document.getElementById('rrDetailNext').disabled         = rrModalPage >= pages;

  const tbody = document.getElementById('rrDetailBody');
  if (pageRows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-10 text-center text-slate-400 italic text-sm bg-slate-50/50">No entries found matching your search</td></tr>`;
    return;
  }

  tbody.innerHTML = pageRows.map(e => {
    const dateLabel = new Date(e.date + 'T00:00:00')
      .toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
    const receiptBadge = e.hasReceipt
      ? '<span class="px-1.5 py-0.5 bg-emerald-100 text-emerald-700 text-[9px] font-bold rounded uppercase">Yes</span>'
      : '<span class="px-1.5 py-0.5 bg-slate-100 text-slate-500 text-[9px] font-bold rounded uppercase">No</span>';
    const desc = escHtml(e.description || '—');
    const sup  = e.supplierName ? `<div class="text-[10px] text-slate-400 truncate">${escHtml(e.supplierName)}</div>` : '';
    // Only reachable in the all-in view — business-only never lists these.
    const pers = e.isPersonal
      ? '<span class="ml-1.5 px-1.5 py-0.5 bg-amber-100 text-amber-700 text-[9px] font-bold rounded uppercase">👤 Personal</span>'
      : '';

    return `<tr class="hover:bg-slate-50 transition border-b border-slate-50 last:border-0">
      <td class="px-4 py-3 text-xs text-slate-500 whitespace-nowrap">${dateLabel}</td>
      <td class="px-4 py-3 text-xs text-slate-700 font-medium">${desc}${pers}${sup}</td>
      <td class="px-4 py-3 text-center">${receiptBadge}</td>
      <td class="px-4 py-3 text-xs font-mono text-slate-400">${escHtml(e.receiptNo || e.referenceNo || '—')}</td>
      <td class="px-4 py-3 text-xs text-slate-500 italic">${escHtml(e.requestedBy || '—')}</td>
      <td class="px-4 py-3 text-sm text-right font-mono font-bold text-slate-800">${fmt(e.amount)}</td>
    </tr>`;
  }).join('');
}

function rrDetailPagePrev() {
  if (rrModalPage > 1) { rrModalPage--; rrDetailRender(); }
}

function rrDetailPageNext() {
  const pages = Math.ceil(rrModalFiltered.length / RR_PAGE_SIZE);
  if (rrModalPage < pages) { rrModalPage++; rrDetailRender(); }
}

function renderRrReceiptCoverage(withR, withoutR) {
  const el = document.getElementById('rr-receiptCoverage');
  if (!el) return;

  const wR    = withR    || 0;
  const woR   = withoutR || 0;
  const total = wR + woR;

  if (total === 0) {
    el.innerHTML = `<p class="text-sm text-gray-400 italic text-center">No receipted expenses</p>`;
    return;
  }

  const pct       = (wR / total) * 100;
  const pctColor  = pct >= 90 ? 'text-green-600' : pct >= 70 ? 'text-amber-500' : 'text-red-600';

  el.innerHTML = `
    <div class="text-center mb-4">
      <div class="text-4xl font-black font-mono ${pctColor}">${pct.toFixed(0)}%</div>
      <div class="text-[10px] text-gray-400 uppercase tracking-wider mt-1">of spend has receipts</div>
    </div>
    <div class="flex h-3 w-full rounded-full overflow-hidden mb-4 bg-gray-100">
      <div class="h-full bg-green-500" style="width:${pct}%"></div>
      <div class="h-full bg-red-400" style="width:${100 - pct}%"></div>
    </div>
    <div class="space-y-2">
      <div class="flex items-center justify-between text-xs">
        <span class="flex items-center gap-1.5 text-gray-600"><span class="w-2 h-2 rounded-full bg-green-500"></span> With receipt</span>
        <span class="font-mono font-bold text-gray-800">${fmt(wR)}</span>
      </div>
      <div class="flex items-center justify-between text-xs">
        <span class="flex items-center gap-1.5 text-gray-600"><span class="w-2 h-2 rounded-full bg-red-400"></span> Missing receipt</span>
        <span class="font-mono font-bold ${woR > 0 ? 'text-red-600' : 'text-gray-800'}">${fmt(woR)}</span>
      </div>
    </div>`;
}

function renderRrFusedTable(rows, entries) {
  const tbody = document.getElementById('rrDailyBody');
  const tfoot = document.getElementById('rrDailyFoot');

  if (!rows || rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-gray-400 italic text-sm">No activity in this period</td></tr>`;
    tfoot.innerHTML = '';
    return;
  }

  // Group entries by date
  const entryMap = {};
  if (entries) {
    entries.forEach(e => {
      if (!entryMap[e.date]) entryMap[e.date] = [];
      entryMap[e.date].push(e);
    });
  }

  const statusMap = {
    CLOSED       : '<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-green-100 text-green-700">✅ Closed</span>',
    PENDING_AUDIT: '<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-amber-100 text-amber-700">🔍 Pending</span>',
    FLAGGED      : '<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-red-100 text-red-700">🚩 Flagged</span>',
    OPEN         : '<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-gray-100 text-gray-600">⚪ Open</span>',
  };

  let totExpenses = 0, totReplenish = 0, totCashAdv = 0;
  let html = '';

  rows.forEach(r => {
    // In the business-only view a day is read net of the Admin's personal spend
    // and of any replenishment that was a payback rather than a ceiling top-up.
    // Opening / Closing stay as recorded — those are the drawer, and that cash
    // moved regardless of whose spend it was.
    const dayExp = rrBusinessOnly ? Math.max(0, r.expenses      - (r.personalExpense     || 0)) : r.expenses;
    const dayRep = rrBusinessOnly ? Math.max(0, r.replenishment - (r.nonCeilingReplenish || 0)) : r.replenishment;

    totExpenses  += dayExp;
    totReplenish += dayRep;
    totCashAdv   += r.cashAdvance || 0;

    const dt     = new Date(r.date + 'T00:00:00');
    const label  = dt.toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' });
    const badge  = statusMap[r.status] || statusMap['OPEN'];

    const expCls  = dayExp        > 0 ? 'font-bold text-red-600'    : 'text-gray-300';
    const advCls  = r.cashAdvance > 0 ? 'font-bold text-orange-500' : 'text-gray-300';
    const repCls  = dayRep        > 0 ? 'font-bold text-purple-600' : 'text-gray-300';
    const isClosed = r.status === 'CLOSED';

    const rowCls = dayRep > 0 ? 'bg-purple-50/30' : 'hover:bg-gray-50/50';
    const borderCls = dayRep > 0 ? 'border-l-4 border-purple-400' : '';

    // Main Summary Row
    html += `
      <tr class="transition ${rowCls} ${borderCls} print:bg-white no-break-inside">
        <td class="px-4 py-3 text-sm font-medium text-gray-700">
          ${label}
          ${dayRep > 0 ? '<span class="ml-1 text-[10px] font-bold text-purple-600 bg-purple-100 px-1.5 py-0.5 rounded-full">TOP-UP</span>' : ''}
          ${!rrBusinessOnly && r.personalExpense > 0 ? `<span class="ml-1 text-[10px] font-bold text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded-full" title="Personal spend inside this day's expenses">👤 ${fmt(r.personalExpense)}</span>` : ''}
          ${!rrBusinessOnly && r.nonCeilingReplenish > 0 ? `<span class="ml-1 text-[10px] font-bold text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded-full" title="Personal repayment — not a ceiling top-up">↩ ${fmt(r.nonCeilingReplenish)}</span>` : ''}
        </td>
        <td class="px-4 py-3 text-right font-mono text-xs text-gray-400">${fmt(r.opening)}</td>
        <td class="px-4 py-3 text-right font-mono text-sm ${expCls}">${dayExp > 0 ? fmt(dayExp) : '—'}</td>
        <td class="px-4 py-3 text-right font-mono text-sm ${advCls}">${r.cashAdvance > 0 ? fmt(r.cashAdvance) : '—'}</td>
        <td class="px-4 py-3 text-right font-mono text-sm ${repCls}">${dayRep > 0 ? fmt(dayRep) : '—'}</td>
        <td class="px-4 py-3 text-right font-mono text-sm ${isClosed ? 'text-gray-700' : 'text-gray-300'}">${isClosed ? fmt(r.closing) : '—'}</td>
        <td class="px-4 py-3 text-center">${badge}</td>
      </tr>`;

    // Detailed Nested Rows (Always in DOM, handled by hidden/print classes)
    // The nested lines have to agree with the day's totals above them, so the
    // business-only view drops the personal spend and the paybacks outright
    // rather than showing lines that no longer add up to the row.
    const dayEntries = (entryMap[r.date] || []).filter(e => {
      if (!rrBusinessOnly) return true;
      if (e.isPersonal) return false;
      return !(e.type === 'REPLENISHMENT' && e.isCeilingTopUp === false);
    });

    if (dayEntries.length) {
      html += `
        <tr class="rr-detail-row bg-gray-50/50 hidden print:table-row no-break-inside">
          <td colspan="7" class="px-4 sm:px-6 py-0">
            <div class="border-l-2 border-dashed border-gray-200 ml-2 my-2 py-1 pl-3 sm:pl-4 space-y-0.5">
              ${dayEntries.map(e => {
                // Per-type presentation: short label + pill colour + amount colour
                const typeConf = {
                  CASH_ADVANCE              : { label: 'Advance',     pill: 'bg-amber-100 text-amber-700',   amt: 'text-orange-500' },
                  PCR_ADVANCE               : { label: 'Release',     pill: 'bg-orange-100 text-orange-700', amt: 'text-orange-500' },
                  LIQ_DETAIL                : { label: 'Liquidation', pill: 'bg-blue-100 text-blue-700',     amt: 'text-red-600'    },
                  PCR_DETAIL                : { label: 'Request',     pill: 'bg-indigo-100 text-indigo-700', amt: 'text-red-600'    },
                  CASH_ADVANCE_REIMBURSEMENT: { label: 'Reimburse',   pill: 'bg-rose-100 text-rose-700',     amt: 'text-red-600'    },
                  REPLENISHMENT             : { label: 'Top-up',      pill: 'bg-purple-100 text-purple-700', amt: 'text-purple-600' },
                }[e.type] || { label: 'Entry', pill: 'bg-gray-100 text-gray-600', amt: 'text-red-600' };

                const sign = e.type === 'REPLENISHMENT' ? '+' : '';

                // A payback is a replenishment that does not restore the
                // ceiling, so it reads as its own thing rather than a top-up.
                const isPayback = e.type === 'REPLENISHMENT' && e.isCeilingTopUp === false;
                const pillLabel = isPayback ? 'Payback' : typeConf.label;
                const pillCls   = isPayback ? 'bg-amber-100 text-amber-700' : typeConf.pill;
                const mark      = (!rrBusinessOnly && (e.isPersonal || isPayback))
                  ? '<span class="ml-1.5 px-1 py-0.5 rounded bg-amber-100 text-amber-700 text-[9px] font-bold" title="Personal — excluded by the Business only view">👤</span>'
                  : '';

                return `
                  <div class="flex items-center gap-3 py-1.5 px-2 rounded-lg hover:bg-white/80 transition border-b border-gray-100 last:border-0">
                    <span class="shrink-0 w-[68px] text-center text-[9px] font-bold py-1 rounded ${pillCls} uppercase tracking-wide">${pillLabel}</span>
                    <div class="min-w-0 flex-1">
                      <div class="text-xs text-gray-700 font-medium truncate" title="${e.description}">${e.description}${mark}</div>
                      <div class="text-[10px] text-gray-400 truncate">
                        <span class="uppercase tracking-wide font-semibold">${e.category || 'misc'}</span>${e.requestedBy ? ` &middot; ${e.requestedBy}` : ''}
                      </div>
                    </div>
                    <div class="shrink-0 w-24 text-right font-mono text-xs font-bold tabular-nums ${typeConf.amt}">
                      ${sign}${fmt(e.amount)}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </td>
        </tr>`;
    }
  });

  tbody.innerHTML = html;

  tfoot.innerHTML = `
    <tr class="bg-gray-100/50 print:bg-gray-100">
      <td class="px-4 py-3 text-[10px] font-bold text-gray-500 uppercase tracking-wider">Period Totals</td>
      <td class="px-4 py-3 text-right font-mono font-bold text-gray-400">—</td>
      <td class="px-4 py-3 text-right font-mono font-bold text-red-600">${fmt(totExpenses)}</td>
      <td class="px-4 py-3 text-right font-mono font-bold text-orange-500">${totCashAdv > 0 ? fmt(totCashAdv) : '—'}</td>
      <td class="px-4 py-3 text-right font-mono font-bold text-purple-600">${totReplenish > 0 ? fmt(totReplenish) : '—'}</td>
      <td class="px-4 py-3 text-right font-mono font-bold text-gray-400">—</td>
      <td></td>
    </tr>`;
}

// =============================================
// PDF EXPORT — plain text report, written line by line
// =============================================
//
// This does NOT screenshot the page. It writes text straight into the PDF with
// jsPDF (loaded in Index.html as the UMD build, which exposes window.jspdf), so
// the output is a small, crisp, selectable text document — not a picture of the
// dashboard.

// jsPDF's built-in fonts only cover Latin-1, so ₱ and smart quotes come out as
// garbage. Everything printed goes through here first.
function rrPdfText(s) {
  return String(s == null ? '' : s)
    .replace(/₱/g, 'P')            // ₱ → P
    .replace(/[‘’]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/[–—]/g, '-')
    .replace(/\s+/g, ' ')
    .replace(/[^\x20-\x7E]/g, '')
    .trim();
}

// Bare number, no currency symbol — the header states the currency once.
function rrPdfAmount(n) {
  return (parseFloat(n) || 0)
    .toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Groups the period's expenses by category, largest category first — the same
// order (and the same totals) as "Where the Money Went" on screen.
function rrPdfSections(d) {
  const v = rrView();
  // Business-only prints the same ledger with the personal draws taken out, so
  // the category totals foot to the TOTAL EXPENSES line at the end.
  const entries = (d.expenseEntries || [])
    .filter(e => !(rrBusinessOnly && e.isPersonal));

  // Anything missing from the breakdown is appended so no transaction can
  // silently drop off the export.
  const order = (v.categoryBreakdown || []).map(c => c.category);
  entries.forEach(e => { if (order.indexOf(e.category) === -1) order.push(e.category); });

  return order.map(cat => {
    const rows = entries
      .filter(e => String(e.category).trim() === String(cat).trim())
      .sort((a, b) => a.date > b.date ? 1 : -1);   // oldest first, reads like a ledger
    return {
      cat,
      rows,
      total: rows.reduce((s, e) => s + (parseFloat(e.amount) || 0), 0)
    };
  }).filter(s => s.rows.length > 0);
}

function printReplenishReport() {
  if (!rrData) {
    toast('No report data to export', 'warning');
    return;
  }

  // The UMD build attaches window.jspdf; the bare global and the old 1.x
  // window.jsPDF are checked too so a CDN swap can't silently break the export.
  const ns    = window.jspdf || (typeof jspdf !== 'undefined' ? jspdf : null);
  const JsPDF = (ns && ns.jsPDF) || window.jsPDF;
  if (!JsPDF) {
    toast('PDF library not loaded — refresh the page and try again', 'error');
    return;
  }

  const d   = rrData;
  const doc = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

  // ── Page geometry (A4 = 210 × 297mm) ──
  const LEFT = 15, RIGHT = 195, BOTTOM = 282;
  const DATE_X = 17, DESC_X = 33, DESC_W = 122;   // description wraps before the amount column

  let y = 0;

  const fullDate = (s) => new Date(s + 'T00:00:00')
    .toLocaleDateString('en-PH', { month: 'long', day: 'numeric', year: 'numeric' });
  const dayLabel = (s) => new Date(s + 'T00:00:00')
    .toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });

  const rule = (weight) => {
    doc.setLineWidth(weight);
    doc.line(LEFT, y, RIGHT, y);
    doc.setLineWidth(0.2);
  };

  // Starts a page and prints the report heading. Subsequent pages get the same
  // heading marked "(continued)" so a loose page still identifies itself.
  const startPage = (continued) => {
    y = 18;
    doc.setFont('helvetica', 'bold').setFontSize(13);
    doc.text('PETTY CASH - EXPENSES BY CATEGORY' + (continued ? ' (continued)' : ''), LEFT, y);
    y += 5;
    doc.setFont('helvetica', 'normal').setFontSize(9);
    doc.text(rrPdfText(`${fullDate(d.periodFrom)} to ${fullDate(d.periodTo)}   |   All amounts in PHP`), LEFT, y);
    if (rrBusinessOnly) {
      y += 4;
      doc.setFont('helvetica', 'bold').setFontSize(8);
      doc.text(rrPdfText('BUSINESS ONLY - personal draws excluded'), LEFT, y);
      doc.setFont('helvetica', 'normal').setFontSize(9);
    }
    y += 3;
    rule(0.6);
    y += 7;
  };

  // Reserve space so a category header can never be the last thing on a page.
  const needRoom = (mm) => {
    if (y + mm > BOTTOM) { doc.addPage(); startPage(true); }
  };

  startPage(false);

  const sections = rrPdfSections(d);

  if (sections.length === 0) {
    doc.setFont('helvetica', 'italic').setFontSize(10);
    doc.text('No expenses in this period.', LEFT, y);
  }

  sections.forEach(s => {
    needRoom(16);

    // ── Category header: name left, category total right ──
    doc.setFont('helvetica', 'bold').setFontSize(11);
    doc.text(rrPdfText(s.cat), LEFT, y);
    doc.text(rrPdfAmount(s.total), RIGHT, y, { align: 'right' });
    y += 1.8;
    rule(0.4);
    y += 5;

    // ── Its transactions ──
    doc.setFont('helvetica', 'normal').setFontSize(9);
    s.rows.forEach(e => {
      const desc  = rrPdfText(e.description || '-') +
                    (e.supplierName ? ' (' + rrPdfText(e.supplierName) + ')' : '');
      const lines = doc.splitTextToSize(desc, DESC_W);

      needRoom(lines.length * 4 + 2);

      doc.setTextColor(110);
      doc.text(dayLabel(e.date), DATE_X, y);
      doc.setTextColor(0);
      doc.text(lines, DESC_X, y);
      doc.text(rrPdfAmount(e.amount), RIGHT, y, { align: 'right' });

      y += lines.length * 4 + 1.5;
    });

    y += 5;
  });

  // ── Totals block ──
  needRoom(24);
  y += 2;
  rule(0.6);
  y += 6;
  doc.setFont('helvetica', 'bold').setFontSize(11);
  doc.text(rrBusinessOnly ? 'TOTAL EXPENSES (BUSINESS)' : 'TOTAL EXPENSES', LEFT, y);
  doc.text(rrPdfAmount(rrView().totalExpenses), RIGHT, y, { align: 'right' });
  y += 6;

  if (!rrBusinessOnly && d.personalExpenses > 0) {
    doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(120);
    doc.text(rrPdfText('of which personal (repayable)'), LEFT, y);
    doc.text(rrPdfAmount(d.personalExpenses), RIGHT, y, { align: 'right' });
    doc.setTextColor(0);
    y += 6;
  }

  doc.setFont('helvetica', 'normal').setFontSize(10);
  // Unfiltered on purpose — this is drawer arithmetic against the fund ceiling,
  // and the personal cash that is out has genuinely left the drawer.
  doc.text('Amount to Replenish', LEFT, y);
  doc.setFont('helvetica', 'bold');
  doc.text(rrPdfAmount(d.toReplenish), RIGHT, y, { align: 'right' });

  // ── Footer on every page ──
  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFont('helvetica', 'normal').setFontSize(8).setTextColor(130);
    doc.text(rrPdfText('Generated ' + new Date().toLocaleDateString('en-PH', {
      month: 'long', day: 'numeric', year: 'numeric'
    })), LEFT, 290);
    doc.text(`Page ${p} of ${pages}`, RIGHT, 290, { align: 'right' });
    doc.setTextColor(0);
  }

  const from = d.periodFrom.replace(/-/g, '');
  const to   = d.periodTo.replace(/-/g, '');

  try {
    doc.save(`PettyCash_Expenses${rrBusinessOnly ? '_Business' : ''}_${from}_to_${to}.pdf`);
    toast(`Report${rrBusinessOnly ? ' (business only)' : ''} exported successfully!`, 'success');
  } catch (err) {
    console.error('PDF Export Error:', err);
    toast('Failed to generate PDF', 'error');
  }
}

// =============================================
// JOURNAL PDF — one section per receipt type
// =============================================
// A separate document from the category export above: this is what the
// bookkeeper posts from, so it follows the journal's own structure — the three
// non-creditable sections summed by Account Type, VAT itemised line by line.
function printReplenishJournal() {
  if (!rrData || !rrView().journal) {
    toast('No journal data to export', 'warning');
    return;
  }

  const ns    = window.jspdf || (typeof jspdf !== 'undefined' ? jspdf : null);
  const JsPDF = (ns && ns.jsPDF) || window.jsPDF;
  if (!JsPDF) {
    toast('PDF library not loaded — refresh the page and try again', 'error');
    return;
  }

  const d       = rrData;
  const journal = rrView().journal;   // whichever view is on screen
  const doc     = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

  // ── Page geometry (A4 = 210 × 297mm) ──
  const LEFT = 15, RIGHT = 195, BOTTOM = 282;
  const DATE_X = 17, ACCT_X = 33, DESC_X = 69, DESC_W = 66;
  const AMT_X  = 168;   // right edge of the Amount column, leaving VAT at RIGHT

  let y = 0;

  const fullDate = (s) => new Date(s + 'T00:00:00')
    .toLocaleDateString('en-PH', { month: 'long', day: 'numeric', year: 'numeric' });
  const dayLabel = (s) => new Date(s + 'T00:00:00')
    .toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });

  const rule = (weight) => {
    doc.setLineWidth(weight);
    doc.line(LEFT, y, RIGHT, y);
    doc.setLineWidth(0.2);
  };

  const startPage = (continued) => {
    y = 18;
    doc.setFont('helvetica', 'bold').setFontSize(13);
    doc.text('PETTY CASH - REPLENISHMENT JOURNAL' + (continued ? ' (continued)' : ''), LEFT, y);
    y += 5;
    doc.setFont('helvetica', 'normal').setFontSize(9);
    doc.text(rrPdfText(`${fullDate(journal.periodFrom)} to ${fullDate(journal.periodTo)}   |   All amounts in PHP`), LEFT, y);
    // The filter has to be on the page — a printed journal that silently omits
    // the personal draws is indistinguishable from one where none were taken.
    if (rrBusinessOnly) {
      y += 4;
      doc.setFont('helvetica', 'bold').setFontSize(8);
      doc.text(rrPdfText('BUSINESS ONLY - personal draws excluded (repayable to the fund, posted as a receivable)'), LEFT, y);
      doc.setFont('helvetica', 'normal').setFontSize(9);
    }
    y += 3;
    rule(0.6);
    y += 7;
  };

  const needRoom = (mm) => {
    if (y + mm > BOTTOM) { doc.addPage(); startPage(true); }
  };

  startPage(false);

  const sections = (journal.sections || []).filter(s => s.count > 0);

  if (sections.length === 0) {
    doc.setFont('helvetica', 'italic').setFontSize(10);
    doc.text('No receipted spend in this period.', LEFT, y);
  }

  sections.forEach(s => {
    needRoom(22);

    // ── Section header ──
    doc.setFont('helvetica', 'bold').setFontSize(11);
    doc.text(rrPdfText(s.label.toUpperCase()), LEFT, y);
    doc.text(rrPdfAmount(s.total), RIGHT, y, { align: 'right' });
    y += 1.8;
    rule(0.4);
    y += 5;

    if (!s.itemized) {
      // Summed by Account Type — one posting line per account.
      doc.setFont('helvetica', 'bold').setFontSize(8).setTextColor(120);
      doc.text('ACCOUNT TYPE', LEFT + 2, y);
      doc.text('AMOUNT', RIGHT, y, { align: 'right' });
      doc.setTextColor(0);
      y += 4;

      doc.setFont('helvetica', 'normal').setFontSize(9);
      s.groups.forEach(g => {
        needRoom(6);
        const lines = doc.splitTextToSize(rrPdfText(g.accountType), 120);
        doc.text(lines, LEFT + 2, y);
        doc.setTextColor(150);
        doc.text(`(${g.count})`, LEFT + 128, y);
        doc.setTextColor(0);
        doc.text(rrPdfAmount(g.amount), RIGHT, y, { align: 'right' });
        y += lines.length * 4 + 1.5;
      });
    } else {
      // Itemised — every VAT line, so input VAT traces back to an OR.
      doc.setFont('helvetica', 'bold').setFontSize(8).setTextColor(120);
      doc.text('DATE', DATE_X, y);
      doc.text('ACCOUNT', ACCT_X, y);
      doc.text('PARTICULARS', DESC_X, y);
      doc.text('AMOUNT', AMT_X, y, { align: 'right' });
      doc.text('VAT', RIGHT, y, { align: 'right' });
      doc.setTextColor(0);
      y += 4;

      doc.setFont('helvetica', 'normal').setFontSize(8.5);
      s.items.forEach(i => {
        const particulars = rrPdfText(i.description || '-')
          + (i.supplierName ? ' (' + rrPdfText(i.supplierName) + ')' : '')
          + (i.receiptNo    ? ' OR# ' + rrPdfText(i.receiptNo)      : '');
        const descLines = doc.splitTextToSize(particulars, DESC_W);
        const acctLines = doc.splitTextToSize(rrPdfText(i.accountType), 34);
        const rowLines  = Math.max(descLines.length, acctLines.length);

        needRoom(rowLines * 3.8 + 2);

        doc.setTextColor(110);
        doc.text(dayLabel(i.date), DATE_X, y);
        doc.setTextColor(0);
        doc.text(acctLines, ACCT_X, y);
        doc.text(descLines, DESC_X, y);
        doc.text(rrPdfAmount(i.amount), AMT_X, y, { align: 'right' });
        doc.text(rrPdfAmount(i.vatAmount), RIGHT, y, { align: 'right' });

        y += rowLines * 3.8 + 1.5;
      });

      // Per-account roll-up so the VAT batch can still be posted by account.
      needRoom(10 + s.groups.length * 5);
      y += 3;
      doc.setFont('helvetica', 'bold').setFontSize(8).setTextColor(120);
      doc.text('VAT SPEND BY ACCOUNT TYPE', LEFT + 2, y);
      doc.setTextColor(0);
      y += 4.5;
      doc.setFont('helvetica', 'normal').setFontSize(9);
      s.groups.forEach(g => {
        needRoom(6);
        doc.text(rrPdfText(g.accountType), LEFT + 2, y);
        doc.text(rrPdfAmount(g.amount), RIGHT, y, { align: 'right' });
        y += 4.5;
      });

      y += 1;
      doc.setFont('helvetica', 'bold').setFontSize(9);
      doc.text('Total Input VAT', LEFT + 2, y);
      doc.text(rrPdfAmount(s.vatTotal || 0), RIGHT, y, { align: 'right' });
      y += 4.5;
    }

    // ── Section subtotal ──
    needRoom(10);
    y += 1;
    doc.setFont('helvetica', 'bold').setFontSize(9.5);
    doc.text(rrPdfText(s.label + ' - Total'), LEFT + 2, y);
    doc.text(rrPdfAmount(s.total), RIGHT, y, { align: 'right' });
    y += 5;

    // Inside the subtotal, never added to it — so the all-in journal still says
    // how much of what it just totalled is repayable rather than expense.
    if (!rrBusinessOnly && s.personalTotal > 0) {
      needRoom(6);
      doc.setFont('helvetica', 'italic').setFontSize(8.5).setTextColor(150);
      doc.text(rrPdfText('of which personal (repayable)'), LEFT + 2, y);
      doc.text(rrPdfAmount(s.personalTotal), RIGHT, y, { align: 'right' });
      doc.setTextColor(0);
      y += 5;
    }

    y += 4;
  });

  // ── Grand total ──
  needRoom(20);
  y += 2;
  rule(0.6);
  y += 6;
  doc.setFont('helvetica', 'bold').setFontSize(11);
  doc.text('JOURNAL TOTAL', LEFT, y);
  doc.text(rrPdfAmount(journal.grandTotal), RIGHT, y, { align: 'right' });

  if (!rrBusinessOnly && journal.personalTotal > 0) {
    y += 6;
    doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(120);
    doc.text(rrPdfText('Included above - personal (repayable, not company expense)'), LEFT, y);
    doc.text(rrPdfAmount(journal.personalTotal), RIGHT, y, { align: 'right' });
    doc.setTextColor(0);
  }

  // ── Footer on every page ──
  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFont('helvetica', 'normal').setFontSize(8).setTextColor(130);
    doc.text(rrPdfText('Generated ' + new Date().toLocaleDateString('en-PH', {
      month: 'long', day: 'numeric', year: 'numeric'
    })), LEFT, 290);
    doc.text(`Page ${p} of ${pages}`, RIGHT, 290, { align: 'right' });
    doc.setTextColor(0);
  }

  const from = journal.periodFrom.replace(/-/g, '');
  const to   = journal.periodTo.replace(/-/g, '');

  try {
    // Distinct filename per view — the two documents hold different totals and
    // must not overwrite each other in the download folder.
    doc.save(`PettyCash_Journal${rrBusinessOnly ? '_Business' : ''}_${from}_to_${to}.pdf`);
    toast(`Journal${rrBusinessOnly ? ' (business only)' : ''} exported successfully!`, 'success');
  } catch (err) {
    console.error('Journal PDF Export Error:', err);
    toast('Failed to generate the journal PDF', 'error');
  }
}
</script>
