<script>
// =============================================
// AUDIT REVIEW PAGE LOGIC
// =============================================

const AUDIT_BILLS = [1000, 500, 200, 100, 50, 20, 10, 5, 1, 0.25];
let auditEntryReviews = {}; // { entryId: { status: 'verified'|'flagged', note: '' } }
let auditDenomValues  = {}; // { bill: qty }

async function loadAuditReviewPage() {
  // Date label
  const labelEl = document.getElementById('auditReviewDateLabel');
  if (labelEl) {
    const d = new Date(state.currentDate + 'T00:00:00');
    labelEl.textContent = d.toLocaleDateString('en-PH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  auditEntryReviews = {};
  auditDenomValues  = {};

  buildAuditDenomGrid();

  // Initialize mobile tab state (show entries first on mobile)
  if (typeof switchAuditPanel === 'function' && window.innerWidth < 1024) {
    switchAuditPanel('entries');
  }

  // Show loading state on entries panel
  const entryList = document.getElementById('auditEntryList');
  if (entryList) entryList.innerHTML = '<div class="px-4 py-8 text-center text-gray-400 text-sm animate-pulse">Loading entries...</div>';

  try {
    // Load summary, denomination records, and entries all in parallel
    const [summaryRes, denomRes, entriesRes] = await Promise.all([
      callServer('getDailySummary', state.currentDate),
      callServer('getDenominationRecords', state.currentDate),
      callServer('getExpenseEntries', state.currentDate)
    ]);

    // 1. Summary → needed for expected cash / variance
    if (summaryRes.success && summaryRes.data) {
      state.summary = summaryRes.data;
      // Show opening cash in the Physical Cash Count card header
      const openingEl = document.getElementById('auditOpeningCashHeader');
      if (openingEl) {
        const opening = parseFloat(summaryRes.data.openingCash || 0);
        openingEl.textContent = fmt(opening);
      }
      updateAuditDaySummaryPanel();
    }

    // 2. Denomination END count → pre-fill the auditor's cash count grid
    if (denomRes.success && denomRes.data) {
      const endRecord = denomRes.data.find(d => d.type === 'END');
      if (endRecord && endRecord.denominations) {
        const denoms = endRecord.denominations;
        AUDIT_BILLS.forEach(bill => {
          const qty = parseFloat(denoms[String(bill)]) || 0;
          if (qty > 0) {
            auditDenomValues[String(bill)] = qty;
            const input = document.getElementById('auditDenom-' + bill);
            if (input) input.value = qty;
          }
        });
        updateAuditDenomTotal();
      } else {
        updateAuditVariance();
      }
    } else {
      updateAuditVariance();
    }

    // 3. Entries → render the review list
    const allEntries = entriesRes.success ? (entriesRes.data || []) : [];
    state.entries = allEntries;
    const entries = allEntries.filter(e => e.status !== 'DELETED' && !e.carriedForward);

    // If already closed, pre-mark all entries as verified for consistent UI/variance
    if (state.summary?.status === 'CLOSED') {
      entries.forEach(e => {
        auditEntryReviews[e.id] = { status: 'verified', note: '' };
      });
    }

    renderAuditEntries(entries);
    updateAuditProgress(entries);
    updateAuditStatusBanner();

    // Re-run after entries are loaded so the Day Summary panel shows live entry totals
    // and the variance display reflects the initial unverified state correctly.
    updateAuditDaySummaryPanel();
    updateAuditDenomTotal();

  } catch(e) {
    console.error('loadAuditReviewPage error:', e);
    if (entryList) entryList.innerHTML = '<div class="px-4 py-8 text-center text-red-400 text-sm">Failed to load entries. Please refresh.</div>';
  }
}

// ── Build compact denomination grid ──
function buildAuditDenomGrid() {
  const grid = document.getElementById('auditDenomGrid');
  if (!grid) return;

  const isClosed = state.summary?.status === 'CLOSED';

  grid.innerHTML = AUDIT_BILLS.map(bill => {
    const label = bill >= 1 ? '₱' + bill : '₱' + bill.toFixed(2);
    return `
      <div class="flex items-center gap-1.5">
        <span class="text-[10px] font-bold text-gray-500 w-10 shrink-0">${label}</span>
        <input type="number" min="0" id="auditDenom-${bill}"
          ${isClosed ? 'disabled' : ''}
          oninput="auditDenomValues[String(${bill})] = parseFloat(this.value)||0; updateAuditDenomTotal()"
          class="w-full text-xs text-center border border-gray-200 rounded-lg py-1.5 px-1 outline-none focus:ring-2 focus:ring-gray-400 bg-gray-50 disabled:bg-gray-100 disabled:text-gray-500"
          placeholder="0">
      </div>`;
  }).join('');
}

function updateAuditDenomTotal() {
  let total = 0;
  AUDIT_BILLS.forEach(bill => {
    total += (parseFloat(auditDenomValues[String(bill)]) || 0) * bill;
  });
  const totalEl = document.getElementById('auditDenomTotal');
  if (totalEl) totalEl.textContent = fmt(total);
  updateAuditVariance(total);
}

function updateAuditVariance(actualCash) {
  const summary = state.summary;
  if (!summary) return;

  const opening = parseFloat(summary.openingCash || 0);

  // Expected starts at opening cash only.
  // Each verified entry moves the expected toward the fully-accounted value:
  //   verified outflow (EXPENSE, CASH_ADVANCE, LIQ_DETAIL) → expected decreases
  //   verified inflow  (REPLENISHMENT, CASH_OVER, CASH_RETURN) → expected increases
  // Result: variance = −totalEntries when nothing verified, → ₱0 when all verified.
  const reviewableEntries = (state.entries || []).filter(e => e.status !== 'DELETED' && !e.carriedForward);
  let expectedAdj = 0;
  reviewableEntries
    .filter(e => auditEntryReviews[e.id]?.status === 'verified')
    .forEach(e => {
      // Skip LIQ_DETAIL and past cash advances; they do not alter today's physical cash expected balance
      if (e.type === 'LIQ_DETAIL' || (e.type === 'CASH_ADVANCE' && e.originalDate && e.originalDate < state.currentDate)) return;

      const amt = parseFloat(e.amount || 0);
      if (e.type === 'REPLENISHMENT' || e.type === 'CASH_OVER' || e.type === 'CASH_RETURN') {
        expectedAdj += amt;
      } else {
        expectedAdj -= amt;
      }
    });
  const expected = opening + expectedAdj;

  const expEl = document.getElementById('auditExpectedCash');
  if (expEl) expEl.textContent = fmt(expected);

  if (actualCash === undefined) return;

  const variance = actualCash - expected;

  const varEl   = document.getElementById('auditVarianceDisplay');
  const alertEl = document.getElementById('auditVarianceAlert');

  if (varEl) {
    varEl.textContent = (variance >= 0 ? '+' : '') + fmt(variance);
    varEl.className   = 'font-mono text-xs font-bold ' + (
      Math.abs(variance) < 0.01 ? 'text-green-600' :
      variance > 0 ? 'text-blue-600' : 'text-red-600'
    );
  }

  if (alertEl) {
    if (variance < -0.01) {
      alertEl.className   = 'mt-2 text-xs rounded-lg px-3 py-2 font-medium bg-red-50 border border-red-200 text-red-700';
      alertEl.textContent = '⚠️ Cash short ' + fmt(Math.abs(variance)) + ' — cashier must add adjustment.';
      alertEl.classList.remove('hidden');
    } else if (variance > 0.01) {
      alertEl.className   = 'mt-2 text-xs rounded-lg px-3 py-2 font-medium bg-blue-50 border border-blue-200 text-blue-700';
      alertEl.textContent = '💙 Cash over ' + fmt(variance) + ' — note required on approval.';
      alertEl.classList.remove('hidden');
    } else {
      alertEl.classList.add('hidden');
    }
  }
}

// ── Render entries with verify/flag controls ──
function renderAuditEntries(entries) {
  const container = document.getElementById('auditEntryList');
  if (!container) return;

  if (!entries.length) {
    container.innerHTML = '<div class="px-4 py-8 text-center text-gray-400 text-sm italic">No entries for this day.</div>';
    return;
  }

  const typeColors = {
    EXPENSE      : 'bg-gray-100 text-gray-600',
    CASH_ADVANCE : 'bg-purple-100 text-purple-700',
    REPLENISHMENT: 'bg-green-100 text-green-700',
    CASH_OVER    : 'bg-blue-100 text-blue-700',
    CASH_RETURN  : 'bg-teal-100 text-teal-700'
  };

  container.innerHTML = entries.map(e => {
    const isLiqPending = e.type === 'CASH_ADVANCE' && e.status === 'LIQUIDATION_PENDING';

    const typeBadge = isLiqPending
      ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">💳 LIQUIDATION</span>`
      : `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${typeColors[e.type] || 'bg-gray-100 text-gray-600'}">${e.type.replace(/_/g,' ')}</span>`;

    const receiptBadge = e.hasReceipt
      ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-green-50 text-green-600 border border-green-200">🧾 Receipt</span>'
      : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-50 text-amber-600 border border-amber-200">⚠️ No Receipt</span>';

    // Build liquidation breakdown for LIQUIDATION_PENDING advances
    let breakdownHtml = '';
    if (isLiqPending && e.liqBreakdown) {
      const bd       = e.liqBreakdown;
      const subItems = bd.entries || [];
      const toggleId = 'auditLiqBreakdown-' + e.id;

      const subRows = subItems.map(sub =>
        `<div class="flex justify-between text-xs py-0.5 gap-2">
          <span class="text-gray-600 flex items-center gap-1">
            <span class="text-gray-300">└</span>
            ${sub.desc || '—'}
            <span class="text-gray-400">(${sub.category || ''})</span>
            ${sub.hasReceipt ? '<span class="text-green-600">🧾</span>' : '<span class="text-amber-500">⚠️</span>'}
          </span>
          <span class="font-mono text-gray-700 shrink-0">${fmt(parseFloat(sub.amount) || 0)}</span>
        </div>`
      ).join('');

      const changeRow = bd.change > 0.005
        ? `<div class="flex justify-between text-xs pt-1 border-t border-amber-200 mt-1 font-bold">
             <span class="text-amber-700">↩ Change to Return</span>
             <span class="font-mono text-amber-700">${fmt(bd.change)}</span>
           </div>`
        : `<div class="text-xs text-green-600 pt-1 border-t border-green-200 mt-1 font-medium">✓ Fully spent</div>`;

      breakdownHtml = `
        <div class="mt-1.5">
          <button onclick="document.getElementById('${toggleId}').classList.toggle('hidden')"
            class="text-[10px] font-bold text-purple-600 hover:text-purple-800 transition">
            ▼ View breakdown (${subItems.length} item${subItems.length !== 1 ? 's' : ''})
          </button>
          <div id="${toggleId}" class="hidden mt-1 bg-amber-50 border border-amber-200 rounded-lg p-2 space-y-0.5">
            ${subRows || '<div class="text-xs text-gray-400 italic">No items recorded</div>'}
            ${changeRow}
            ${bd.note ? `<div class="text-[10px] text-gray-400 italic mt-1">Note: ${bd.note}</div>` : ''}
          </div>
        </div>`;
    }

    const isClosed = state.summary?.status === 'CLOSED';

    return `
      <div id="auditEntry-${e.id}" class="px-4 py-3 transition hover:bg-gray-50 ${isLiqPending ? 'border-l-4 border-amber-400 bg-amber-50/30' : ''}">
        <div class="flex items-start justify-between gap-3">
          <!-- Entry info -->
          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-1.5 mb-1">
              ${typeBadge}
              ${isLiqPending ? '' : receiptBadge}
              <span class="text-[10px] text-gray-400 font-mono">${e.referenceNo || ''}</span>
              ${isClosed ? '<span class="text-[10px] font-bold text-green-600 ml-1">✓ Verified</span>' : ''}
            </div>
            <div class="text-sm font-semibold text-gray-800 truncate">${e.description}</div>
            <div class="text-xs text-gray-500 mt-0.5">
              ${e.category}${e.requestedBy ? ' · ' + e.requestedBy : ''}
              ${isLiqPending ? ' · <span class="font-mono">Issued: ' + e.date + '</span>' : ''}
            </div>
            ${breakdownHtml}
          </div>
          <!-- Amount -->
          <div class="text-right shrink-0">
            <div class="font-mono font-bold text-gray-800">${fmt(e.amount)}</div>
            ${isLiqPending && e.liqBreakdown
              ? `<div class="text-[10px] text-amber-600 font-mono mt-0.5">spent: ${fmt(e.liqBreakdown.totalSpent || 0)}</div>`
              : ''}
          </div>
        </div>

        <!-- Audit controls -->
        <div class="mt-2.5 flex flex-col sm:flex-row items-start sm:items-center gap-2 ${isClosed ? 'hidden' : ''}">
          <div class="flex gap-2">
            <button onclick="markEntry('${e.id}', 'verified')"
              id="auditBtn-verified-${e.id}"
              class="audit-btn px-3 py-1.5 text-xs font-bold rounded-lg border border-gray-200 bg-white hover:bg-green-50 hover:border-green-400 hover:text-green-700 transition">
              ✅ Verified
            </button>
            <button onclick="markEntry('${e.id}', 'flagged')"
              id="auditBtn-flagged-${e.id}"
              class="audit-btn px-3 py-1.5 text-xs font-bold rounded-lg border border-gray-200 bg-white hover:bg-red-50 hover:border-red-400 hover:text-red-700 transition">
              🚩 Flag
            </button>
          </div>
          <input type="text" id="auditNote-${e.id}"
            placeholder="Auditor note (required if flagged)..."
            class="flex-1 text-xs px-2 py-1.5 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-amber-400 bg-gray-50 hidden"
            oninput="auditEntryReviews['${e.id}'] && (auditEntryReviews['${e.id}'].note = this.value)">
        </div>
      </div>`;
  }).join('');
}

// ── Mark entry as verified or flagged ──
function markEntry(id, status) {
  auditEntryReviews[id] = auditEntryReviews[id] || { status: '', note: '' };
  auditEntryReviews[id].status = status;

  // Update button styles
  const verifiedBtn = document.getElementById('auditBtn-verified-' + id);
  const flaggedBtn  = document.getElementById('auditBtn-flagged-'  + id);
  const noteInput   = document.getElementById('auditNote-' + id);
  const entryRow    = document.getElementById('auditEntry-' + id);

  if (status === 'verified') {
    verifiedBtn?.classList.add('bg-green-100', 'border-green-400', 'text-green-700');
    verifiedBtn?.classList.remove('bg-white', 'border-gray-200');
    flaggedBtn?.classList.remove('bg-red-100', 'border-red-400', 'text-red-700');
    flaggedBtn?.classList.add('bg-white', 'border-gray-200');
    noteInput?.classList.add('hidden');
    entryRow?.classList.remove('bg-red-50');
    entryRow?.classList.add('bg-green-50');
  } else {
    flaggedBtn?.classList.add('bg-red-100', 'border-red-400', 'text-red-700');
    flaggedBtn?.classList.remove('bg-white', 'border-gray-200');
    verifiedBtn?.classList.remove('bg-green-100', 'border-green-400', 'text-green-700');
    verifiedBtn?.classList.add('bg-white', 'border-gray-200');
    noteInput?.classList.remove('hidden');
    entryRow?.classList.add('bg-red-50');
    entryRow?.classList.remove('bg-green-50');
  }

  // Recalculate variance live whenever an entry is verified/flagged
  updateAuditDenomTotal();

  // Re-evaluate progress
  const entries = (state.entries || []).filter(e => e.status !== 'DELETED' && !e.carriedForward);
  updateAuditProgress(entries);
}

// ── Update progress bar and button states ──
function updateAuditProgress(entries) {
  const total    = entries.length;
  const reviewed = entries.filter(e => auditEntryReviews[e.id]?.status).length;
  const flagged  = entries.filter(e => auditEntryReviews[e.id]?.status === 'flagged').length;
  const allDone  = reviewed === total && total > 0;

  const progressEl = document.getElementById('auditProgressBar');
  if (progressEl) {
    const pct = total > 0 ? Math.round((reviewed / total) * 100) : 0;
    progressEl.innerHTML = `
      <div class="flex justify-between text-xs text-gray-500 mb-1">
        <span>${reviewed} of ${total} reviewed</span>
        <span>${pct}%</span>
      </div>
      <div class="w-full bg-gray-100 rounded-full h-1.5">
        <div class="h-1.5 rounded-full transition-all ${flagged > 0 ? 'bg-red-400' : 'bg-green-400'}"
          style="width:${pct}%"></div>
      </div>
      ${flagged > 0 ? `<div class="text-xs text-red-600 mt-1 font-medium">⚠️ ${flagged} entr${flagged > 1 ? 'ies' : 'y'} flagged</div>` : ''}`;
  }

  const approveBtn  = document.getElementById('auditApproveBtn');
  const sendBackBtn = document.getElementById('auditSendBackBtn');
  const holidayBtn  = document.getElementById('auditHolidayBtn');
  const isClosed    = state.summary?.status === 'CLOSED';

  if (total === 0 && !isClosed) {
    if (holidayBtn) holidayBtn.classList.remove('hidden');
    if (progressEl) progressEl.innerHTML = '<div class="text-xs text-gray-500 mb-1">No entries for this day. You can mark this day as a holiday or closed.</div>';
  } else {
    if (holidayBtn) holidayBtn.classList.add('hidden');
  }

  if (isClosed) {
    if (approveBtn)  { approveBtn.classList.add('hidden'); }
    if (sendBackBtn) { sendBackBtn.classList.add('hidden'); }
    if (progressEl)  { progressEl.innerHTML = '<div class="flex items-center gap-2 text-green-600 font-bold py-1"><span>✅ Audit Complete</span></div>'; }
    const noteArea = document.getElementById('auditDecisionNote');
    if (noteArea) noteArea.classList.add('hidden');
    return;
  }

  if (!allDone && total > 0) {
    if (approveBtn)  { approveBtn.disabled  = true; }
    if (sendBackBtn) { sendBackBtn.disabled = true; }
    return;
  }

  if (flagged > 0) {
    if (approveBtn)  { approveBtn.disabled  = true; }
    if (sendBackBtn) { sendBackBtn.disabled = false; }
  } else {
    if (approveBtn)  { approveBtn.disabled  = false; }
    if (sendBackBtn) { sendBackBtn.disabled = true; }
  }
}

async function confirmAuditHoliday() {
  if (!confirm("Close this day as a Holiday / Store Closed? The opening cash will automatically be carried forward as the physical count for the next day.")) return;

  const btn = document.getElementById('auditHolidayBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Closing...'; }

  const summary = state.summary;
  const opening = parseFloat(summary?.openingCash || 0);

  // Note: we place the total in the '1000' bucket temporarily so the backend parser computes the correct total
  // and saves the END denomination accurately. This effectively carries the cash forward without zeroing it.
  await callServer('saveDenominationRecord', {
    date     : state.currentDate,
    type     : 'END',
    breakdown: JSON.stringify({'1000': opening / 1000}),
    total    : opening,
    notes    : 'Holiday / Store Closed'
  });

  const res = await callServer('auditApproveDay', {
    date          : state.currentDate,
    actualCash    : opening,
    note          : 'Holiday / Store Closed',
    flaggedEntries: []
  });

  if (res.success) {
    toast('Day marked as Holiday / Closed ✓', 'success');
    loadAuditReviewPage();
    loadDayData();
  } else {
    if (btn) { btn.disabled = false; btn.textContent = '🏖️ Mark as Holiday / Closed'; }
    toast(res.message || 'Failed to close day', 'error');
  }
}

function updateAuditStatusBanner() {
  const banner = document.getElementById('auditReviewStatusBanner');
  if (!banner) return;
  const status = state.summary?.status;
  if (status === 'PENDING_AUDIT') {
    banner.className = 'flex items-center gap-3 px-4 py-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-800 text-sm font-medium';
    banner.innerHTML = '🔍 This day is pending your audit. Review all entries below, count the physical cash, then approve or send back.';
    banner.classList.remove('hidden');
  } else if (status === 'FLAGGED') {
    banner.className = 'flex items-center gap-3 px-4 py-3 rounded-xl bg-red-50 border border-red-300 text-red-800 text-sm font-medium';
    banner.innerHTML = '🚩 This day was flagged and sent back to the cashier. Waiting for corrections.';
    banner.classList.remove('hidden');
  } else if (status === 'CLOSED') {
    banner.className = 'flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-50 border border-blue-300 text-blue-800 text-sm font-medium';
    banner.innerHTML = '🔒 This day has been approved and closed.';
    banner.classList.remove('hidden');
  } else {
    banner.classList.add('hidden');
  }
}

// ── Save denomination count ──
async function saveAuditDenomCount() {
  let total = 0;
  const breakdown = {};
  AUDIT_BILLS.forEach(bill => {
    const qty = parseFloat(auditDenomValues[bill]) || 0;
    if (qty > 0) breakdown[bill] = qty;
    total += qty * bill;
  });

  const res = await callServer('saveDenominationRecord', {
    date     : state.currentDate,
    type     : 'END',
    breakdown: JSON.stringify(breakdown),
    total    : total,
    notes    : ''
  });

  if (res.success) {
    toast('Cash count saved ✓', 'success');
    updateAuditVariance(total);
  } else {
    toast(res.message || 'Failed to save count', 'error');
  }
}

// ── Approve or Send Back ──
async function confirmAuditDecision(decision) {
  const note    = document.getElementById('auditDecisionNote')?.value?.trim() || '';
  const entries = (state.entries || []).filter(e => e.status !== 'DELETED' && !e.carriedForward);
  const flagged = entries.filter(e => auditEntryReviews[e.id]?.status === 'flagged');

  const summary = state.summary;

  const opening = parseFloat(summary?.openingCash || 0);

  let actualCash = 0;
  AUDIT_BILLS.forEach(bill => { actualCash += (parseFloat(auditDenomValues[bill]) || 0) * bill; });

  // Same formula as the live variance display: opening + verified adjustments.
  // At approval time all entries must be verified, so this equals the full expected.
  let expectedAdj = 0;
  entries.forEach(e => {
    // Skip LIQ_DETAIL and past cash advances; they do not alter today's physical cash expected balance
    if (e.type === 'LIQ_DETAIL' || (e.type === 'CASH_ADVANCE' && e.originalDate && e.originalDate < state.currentDate)) return;

    const amt = parseFloat(e.amount || 0);
    if (e.type === 'REPLENISHMENT' || e.type === 'CASH_OVER' || e.type === 'CASH_RETURN') {
      expectedAdj += amt;
    } else {
      expectedAdj -= amt;
    }
  });
  const expected = opening + expectedAdj;

  const variance = actualCash - expected;

  if (decision === 'approve') {
    openAuditApproveModal(variance, actualCash);
    return;
  } else {
    if (!confirm(`Send back to cashier with ${flagged.length} flagged entr${flagged.length > 1 ? 'ies' : 'y'}? The cashier will be notified to correct them.`)) return;

    const flaggedPayload = flagged.map(e => ({
      id  : e.id,
      note: auditEntryReviews[e.id]?.note || ''
    }));

    const res = await callServer('flagDay', {
      date          : state.currentDate,
      note          : note,
      flaggedEntries: flaggedPayload
    });

    if (res.success) {
      toast('Day sent back to cashier 🚩', 'warning');
      loadAuditReviewPage();
      loadDayData();
    } else {
      toast(res.message || 'Failed to send back', 'error');
    }
  }
}

function openAuditApproveModal(variance, actualCash) {
  const entries  = (state.entries || []).filter(e => e.status !== 'DELETED' && !e.carriedForward);
  const verified = entries.filter(e => auditEntryReviews[e.id]?.status === 'verified').length;
  const flagged  = entries.filter(e => auditEntryReviews[e.id]?.status === 'flagged').length;
  const total    = entries.length;

  const summary   = state.summary;

  const opening = parseFloat(summary?.openingCash || 0);
  let expectedAdjModal = 0;
  entries.forEach(e => {
    // Skip LIQ_DETAIL and past cash advances; they do not alter today's physical cash expected balance
    if (e.type === 'LIQ_DETAIL' || (e.type === 'CASH_ADVANCE' && e.originalDate && e.originalDate < state.currentDate)) return;

    const amt = parseFloat(e.amount || 0);
    if (e.type === 'REPLENISHMENT' || e.type === 'CASH_OVER' || e.type === 'CASH_RETURN') {
      expectedAdjModal += amt;
    } else {
      expectedAdjModal -= amt;
    }
  });
  const expected = opening + expectedAdjModal;

  const isZero = Math.abs(variance) < 0.01;
  const isOver = variance > 0.01;
  const fmtVar = (variance >= 0 ? '+' : '') + fmt(variance);

  // Date label
  const d = new Date(state.currentDate + 'T00:00:00');
  const dateLabel = d.toLocaleDateString('en-PH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('auditApproveModalDate').textContent = dateLabel;

  // Counts
  document.getElementById('auditModalVerifiedCount').textContent = verified;
  document.getElementById('auditModalFlaggedCount').textContent  = flagged;
  document.getElementById('auditModalTotalCount').textContent    = total;

  // Cash summary
  document.getElementById('auditModalExpected').textContent = fmt(expected);
  document.getElementById('auditModalActual').textContent   = fmt(actualCash);
  const varEl = document.getElementById('auditModalVariance');
  varEl.textContent = fmtVar;
  varEl.className   = 'text-base font-black font-mono ' + (isZero ? 'text-green-600' : isOver ? 'text-blue-600' : 'text-red-600');

  // Variance block
  const varBlock = document.getElementById('auditApproveVarianceBlock');
  if (isZero) {
    varBlock.className = 'rounded-xl p-4 border border-green-200 bg-green-50 text-sm font-medium text-green-700';
    varBlock.innerHTML = '✅ Variance is ₱0.00 — cash is balanced.';
  } else if (isOver) {
    varBlock.className = 'rounded-xl p-4 border border-blue-200 bg-blue-50 text-sm font-medium text-blue-700';
    varBlock.innerHTML = '💙 Cash over by ' + fmt(Math.abs(variance)) + ' — please explain the overage below.';
  } else {
    varBlock.className = 'rounded-xl p-4 border border-red-200 bg-red-50 text-sm font-medium text-red-700';
    varBlock.innerHTML = '⚠️ Cash short by ' + fmt(Math.abs(variance)) + ' — consider sending back to cashier instead.';
  }

  // Carry forward notice
  const carryNotice = document.getElementById('auditCarryForwardNotice');
  carryNotice?.classList.toggle('hidden', !isZero || actualCash <= 0);

  // Overage note field
  const overageBlock = document.getElementById('auditOverageNoteBlock');
  overageBlock?.classList.toggle('hidden', !isOver);

  // Clear fields
  document.getElementById('auditApproveNote').value = '';
  if (document.getElementById('auditApproveOverageNote')) {
    document.getElementById('auditApproveOverageNote').value = '';
  }

  // Store values for executeAuditApprove
  const modal = document.getElementById('auditApproveModal');
  modal.dataset.variance   = variance.toFixed(4);
  modal.dataset.actualCash = actualCash.toFixed(4);
  modal.dataset.isOver     = isOver ? '1' : '0';
  modal.dataset.isZero     = isZero ? '1' : '0';

  modal.classList.remove('hidden');
}

function closeAuditApproveModal() {
  document.getElementById('auditApproveModal')?.classList.add('hidden');
}

async function executeAuditApprove() {
  const modal      = document.getElementById('auditApproveModal');
  const isOver     = modal.dataset.isOver     === '1';
  const isZero     = modal.dataset.isZero     === '1';
  const actualCash = parseFloat(modal.dataset.actualCash || '0');
  const note       = document.getElementById('auditApproveNote')?.value?.trim() || '';
  const overNote   = document.getElementById('auditApproveOverageNote')?.value?.trim() || '';

  // Require overage explanation
  if (isOver && !overNote) {
    toast('Please explain the cash overage before approving.', 'warning');
    return;
  }

  const flaggedEntries = (state.entries || [])
    .filter(e => auditEntryReviews[e.id]?.status === 'flagged')
    .map(e => ({ id: e.id, note: auditEntryReviews[e.id]?.note || '' }));

  const btn = document.getElementById('auditApproveConfirmBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Approving...'; }

  // Always save the auditor's physical denom count before approving
  // so the carry-forward to next day's opening is always reliable
  const denomBreakdown = {};
  let denomTotal = 0;
  AUDIT_BILLS.forEach(bill => {
    const qty = parseFloat(auditDenomValues[bill]) || 0;
    if (qty > 0) denomBreakdown[bill] = qty;
    denomTotal += qty * bill;
  });
  // Always save the auditor's physical count — even if zero — so carry-forward is reliable
  await callServer('saveDenominationRecord', {
    date     : state.currentDate,
    type     : 'END',
    breakdown: JSON.stringify(denomBreakdown),
    total    : denomTotal,
    notes    : 'Auto-saved on audit approval'
  });

  const res = await callServer('auditApproveDay', {
    date          : state.currentDate,
    actualCash    : denomTotal,
    note          : note + (overNote ? ' | Overage note: ' + overNote : ''),
    flaggedEntries: flaggedEntries
  });

  if (btn) { btn.disabled = false; btn.textContent = '✅ Confirm Approval'; }

  if (res.success) {
    closeAuditApproveModal();
    toast('Day approved and closed ✓', 'success');
    loadAuditReviewPage();
    loadDayData();
  } else {
    toast(res.message || 'Approval failed', 'error');
  }
}

function updateAuditDaySummaryPanel() {
  const s = state.summary;
  if (!s) return;

  const opening = parseFloat(s.openingCash || 0);

  // Compute totals from live entries when available; fall back to summary before entries load.
  const liveEntries = (state.entries || []).filter(e => e.status !== 'DELETED' && !e.carriedForward);
  let replenish = 0, cashOver = 0, expenses = 0, advance = 0, cashReturn = 0;

  if (liveEntries.length > 0 || state.entries !== undefined) {
    liveEntries.forEach(e => {
      // Skip LIQ_DETAIL from cash movement calculations
      if (e.type === 'LIQ_DETAIL') return;

      const amt = parseFloat(e.amount || 0);
      if      (e.type === 'REPLENISHMENT') replenish  += amt;
      else if (e.type === 'CASH_OVER')     cashOver   += amt;
      else if (e.type === 'CASH_RETURN')   cashReturn += amt;
      else if (e.type === 'CASH_ADVANCE' && (e.status === 'ACTIVE' || e.status === 'LIQUIDATION_PENDING')) {
        // Only deduct advance if it was issued today
        if (!e.originalDate || e.originalDate >= state.currentDate) advance += amt;
      }
      else if (e.type === 'EXPENSE') expenses += amt;
    });
  } else {
    replenish = parseFloat(s.totalReplenishment || 0);
    cashOver  = parseFloat(s.totalCashOver      || 0);
    expenses  = parseFloat(s.totalExpenses      || 0);
    advance   = parseFloat(s.cashAdvance        || 0);
  }

  const expected = (opening + replenish + cashOver + cashReturn) - (expenses + advance);

  // Physical: use live denomination inputs; fall back to saved closingCash
  let physical = 0;
  AUDIT_BILLS.forEach(bill => { physical += (parseFloat(auditDenomValues[String(bill)]) || 0) * bill; });
  if (physical === 0) physical = parseFloat(s.closingCash || 0);

  const variance  = physical - expected;

  const set = (id, val, color) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = fmt(val);
    if (color) el.className = `font-mono font-bold ${color}`;
  };

  set('ads-opening',      opening,   'text-gray-700');
  set('ads-replenishment',replenish, replenish > 0 ? 'text-green-600' : 'text-gray-400');
  set('ads-cashover',     cashOver,  cashOver  > 0 ? 'text-green-600' : 'text-gray-400');
  set('ads-expenses',     expenses,  expenses  > 0 ? 'text-red-600'   : 'text-gray-400');
  set('ads-advance',      advance,   advance   > 0 ? 'text-red-600'   : 'text-gray-400');
  set('ads-expected',     expected,  'text-blue-700');
  set('ads-physical',     physical,  'text-gray-700');

  const varianceEl = document.getElementById('ads-variance');
  if (varianceEl) {
    varianceEl.textContent = (variance >= 0 ? '+' : '') + fmt(variance);
    varianceEl.className = 'font-mono font-bold ' + (
      Math.abs(variance) < 0.01 ? 'text-green-600' :
      variance > 0              ? 'text-blue-600'  : 'text-red-600'
    );
  }
}
</script>
