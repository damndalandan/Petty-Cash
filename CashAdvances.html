<!-- CASH ADVANCES PAGE -->
<div id="page-advances" class="page-view hidden space-y-6">

  <div class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 border-b border-gray-200">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-gray-800 font-display">Cash Advances</h1>
      <p class="text-sm text-gray-500 mt-1">Track outstanding and liquidated advances</p>
    </div>
    <button onclick="loadAdvances()" class="mt-3 md:mt-0 text-sm text-blue-600 hover:text-blue-800 font-medium transition">↺ Refresh</button>
  </div>

  <!-- Filter Tabs -->
  <div class="flex gap-1 bg-gray-100 p-1 rounded-lg w-fit">
    <button onclick="switchAdvanceTab('outstanding')" id="adv-tab-outstanding"
      class="px-4 py-2 text-sm font-medium rounded-md transition-all shadow-sm bg-white text-gray-800">
      🔴 Outstanding
    </button>
    <button onclick="switchAdvanceTab('liquidated')" id="adv-tab-liquidated"
      class="px-4 py-2 text-sm font-medium rounded-md transition-all text-gray-500 hover:text-gray-700">
      ✅ Liquidated
    </button>
  </div>

  <!-- List -->
  <div id="advances-list" class="space-y-3">
    <div class="text-center py-10 text-gray-400 text-sm">Loading...</div>
  </div>

</div><!-- end page-advances -->

<!-- Liquidation Modal — global, accessible from any page -->
<div id="liquidationModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
  <div id="liqModalInner" class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">

    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-700 to-blue-600 p-5 flex justify-between items-center shrink-0">
      <div>
        <h3 class="text-white font-bold text-lg" id="liqModalTitle">Submit Liquidation</h3>
        <p class="text-blue-100 text-xs mt-0.5" id="liqModalSubtitle">Add expense entries to liquidate this advance</p>
      </div>
      <button onclick="closeLiquidationModal()" class="text-white/70 hover:text-white text-2xl font-light">&times;</button>
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-hidden">

      <!-- SUBMIT: two-column layout -->
      <div id="liqTwoCol" class="hidden grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100 overflow-y-auto md:overflow-hidden md:h-[calc(90vh-130px)]">

        <!-- LEFT: Entries -->
        <div class="p-5 space-y-4 overflow-y-auto md:h-full">
          <div class="bg-blue-50 rounded-xl p-3 border border-blue-200 text-sm">
            <div class="text-blue-500 text-xs uppercase font-bold mb-1">Advance Details</div>
            <div id="liqAdvanceDetails" class="text-gray-800 font-medium"></div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-bold text-gray-500 uppercase">Expense Entries</span>
              <button onclick="addLiqEntry()" class="text-xs font-bold text-blue-600 hover:text-blue-800 px-2 py-1 rounded-lg hover:bg-blue-50 transition">+ Add Entry</button>
            </div>
            <div id="liqEntriesList" class="space-y-3"></div>
          </div>
        </div>

        <!-- RIGHT: Summary + Notes -->
        <div class="p-5 space-y-4 flex flex-col overflow-y-auto md:h-full md:overflow-hidden">
          <div>
            <p class="text-xs font-bold text-gray-500 uppercase mb-3">Summary</p>
            <div class="space-y-2 text-sm">
              <div class="flex justify-between text-gray-500 py-2 border-b border-gray-100">
                <span>Advance Amount</span>
                <span class="font-mono font-bold" id="liqAdvanceAmt">₱0.00</span>
              </div>
              <div class="flex justify-between text-gray-500 py-2 border-b border-gray-100">
                <span>Total Liquidated</span>
                <span class="font-mono font-bold text-blue-700" id="liqTotalAmt">₱0.00</span>
              </div>
              <div class="flex justify-between font-bold py-2 text-base">
                <span id="liqBalanceLabel">Balance</span>
                <span class="font-mono" id="liqBalanceAmt">₱0.00</span>
              </div>
            </div>
          </div>

          <div class="flex-1 flex flex-col min-h-0">
            <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Notes <span class="text-gray-400 font-normal normal-case">(optional)</span></label>
            <textarea id="liqNote" placeholder="Enter summary or breakdown..."
              class="w-full p-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none bg-gray-50 h-28"></textarea>
          </div>
        </div>
      </div>

      <!-- APPROVE / REJECT: single column -->
      <div id="liqSingleCol" class="hidden p-6 space-y-4">
        <div class="bg-blue-50 rounded-xl p-3 border border-blue-200 text-sm">
          <div class="text-blue-500 text-xs uppercase font-bold mb-1">Advance Details</div>
          <div id="liqAdvanceDetailsSingle" class="text-gray-800 font-medium"></div>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Notes <span class="text-red-400">(required)</span></label>
          <textarea id="liqNote" rows="3" placeholder="Enter reason..."
            class="w-full p-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none bg-gray-50"></textarea>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="p-4 bg-gray-50 border-t flex gap-3 shrink-0">
      <input type="hidden" id="liqAdvanceId">
      <input type="hidden" id="liqAction">
      <button onclick="closeLiquidationModal()" class="flex-1 py-2.5 text-sm font-bold text-gray-600 hover:bg-gray-200 rounded-xl transition">Cancel</button>
      <button onclick="confirmLiquidationAction()" id="liqConfirmBtn"
        class="flex-1 py-2.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow transition">
        Confirm
      </button>
    </div>
  </div>
</div>
