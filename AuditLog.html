<!-- AUDIT LOG PAGE — Auditor & Admin only -->
<div id="page-auditlog" class="page-view hidden space-y-4">

  <div class="flex flex-col md:flex-row justify-between items-start md:items-center pb-3 border-b border-gray-200 gap-2">
    <div>
      <h1 class="text-xl md:text-3xl font-bold text-gray-800 font-display">Audit Log</h1>
      <p class="text-xs text-gray-500 mt-0.5">Complete trail of all system actions</p>
    </div>
    <button onclick="loadAuditLog()" class="text-sm text-blue-600 hover:text-blue-800 font-medium transition px-3 py-2 border border-blue-200 rounded-lg min-h-[44px] self-start md:self-auto">↺ Refresh</button>
  </div>

  <!-- Filters — responsive stacking -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 space-y-3">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">From</label>
        <input type="date" id="auditFrom"
          class="w-full p-3 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white min-h-[44px]">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">To</label>
        <input type="date" id="auditTo"
          class="w-full p-3 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white min-h-[44px]">
      </div>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Action</label>
      <select id="auditAction"
        class="w-full p-3 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white min-h-[44px]">
        <option value="">All Actions</option>
        <option value="OPENING_SAVED">Opening Saved</option>
        <option value="CLOSING_SAVED">Closing Saved</option>
        <option value="DAY_APPROVED">Day Approved</option>
        <option value="DAY_FLAGGED">Day Flagged</option>
        <option value="CASH_ADVANCE_ISSUED">Cash Advance Issued</option>
        <option value="LIQUIDATION_SUBMITTED">Liquidation Submitted</option>
        <option value="LIQUIDATION_FINALIZED">Liquidation Finalized</option>
        <option value="ENTRY_UPDATED">Entry Updated</option>
        <option value="ENTRY_DELETED">Entry Deleted</option>
        <option value="FILING_SAVED">Filing Saved</option>
        <option value="FILING_UPDATED">Filing Updated</option>
        <option value="CASH_RETURN_RECORDED">Cash Return Recorded</option>
        <option value="REQUEST_SETTLEMENT_EDITED">Settlement Edited</option>
        <optgroup label="Replenishment">
          <option value="LOW_FUND_ALERT">Low Fund Alert</option>
          <option value="LOW_FUND_CLEARED">Low Fund Cleared</option>
          <option value="REPLENISH_REQUEST_SUBMITTED">Replenish Request Submitted</option>
          <option value="REPLENISH_REQUEST_APPROVED">Replenish Request Approved</option>
          <option value="REPLENISH_REQUEST_RETURNED">Replenish Request Returned</option>
          <option value="REPLENISH_REQUEST_REJECTED">Replenish Request Rejected</option>
          <option value="REPLENISH_REQUEST_RESUBMITTED">Replenish Request Resubmitted</option>
          <option value="REPLENISH_REQUEST_FULFILLED">Replenish Request Fulfilled</option>
        </optgroup>
      </select>
    </div>
    <div class="flex gap-3">
      <button onclick="loadAuditLog()"
        class="flex-1 px-4 py-3 bg-gray-900 hover:bg-gray-700 text-white text-sm font-bold rounded-lg shadow transition min-h-[48px]">
        🔍 Filter
      </button>
      <button onclick="clearAuditFilters()"
        class="flex-1 px-4 py-3 bg-white border border-gray-300 text-gray-600 text-sm font-medium rounded-lg hover:bg-gray-50 transition min-h-[48px]">
        ✕ Clear
      </button>
    </div>
  </div>

  <!-- Log Table -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm min-w-[640px]">
        <thead class="bg-gray-50 text-xs uppercase text-gray-500 font-semibold border-b border-gray-200">
          <tr>
            <th class="px-3 py-3 whitespace-nowrap">Timestamp</th>
            <th class="px-3 py-3 whitespace-nowrap">Date</th>
            <th class="px-3 py-3 whitespace-nowrap">Action</th>
            <th class="px-3 py-3 whitespace-nowrap">Actor</th>
            <th class="px-3 py-3 whitespace-nowrap hidden sm:table-cell">Role</th>
            <th class="px-3 py-3">Details</th>
            <th class="px-3 py-3 whitespace-nowrap hidden md:table-cell">Ref ID</th>
          </tr>
        </thead>
        <tbody id="auditLogBody" class="divide-y divide-gray-100">
          <tr><td colspan="7" class="px-4 py-10 text-center text-gray-400 text-sm animate-pulse">Loading...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="auditLogFooter" class="p-3 border-t border-gray-100 bg-gray-50 text-xs text-gray-400 text-right hidden">
      Showing <span id="auditLogCount">0</span> records
    </div>
  </div>

</div>
