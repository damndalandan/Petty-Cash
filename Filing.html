<!-- FILING CHECKLIST PAGE -->
<div id="page-filing" class="page-view hidden space-y-6">

  <div class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 border-b border-gray-200">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-gray-800 font-display">Filing Checklist</h1>
      <p class="text-sm text-gray-500 mt-1">Track daily document filing status</p>
    </div>
    <button onclick="loadFilingPage()" class="mt-3 md:mt-0 text-sm text-blue-600 hover:text-blue-800 font-medium transition">↺ Refresh</button>
  </div>

  <div class="grid lg:grid-cols-3 gap-6">

    <!-- LEFT: Submit checklist for today (Cashier) -->
    <div class="lg:col-span-1" id="filingSubmitPanel">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 sticky top-4 space-y-4">
        <div>
          <h2 class="text-base font-bold text-gray-800">📋 Today's Filing</h2>
          <p class="text-xs text-gray-500 mt-1" id="filingTodayLabel"></p>
        </div>

        <div id="filingStatusBanner" class="hidden"></div>

        <div class="space-y-3" id="filingCheckboxes">
          <label class="flex items-start gap-3 p-3 rounded-xl border border-gray-200 bg-gray-50 hover:bg-gray-100 cursor-pointer transition">
            <input type="checkbox" id="chkFiling_Receipts" class="mt-0.5 w-4 h-4 text-green-600 rounded border-gray-300 focus:ring-green-500">
            <div>
              <div class="text-sm font-bold text-gray-700">🧾 Official Receipts Filed</div>
              <div class="text-xs text-gray-500 mt-0.5">All ORs placed in the receipts folder.</div>
            </div>
          </label>
          <label class="flex items-start gap-3 p-3 rounded-xl border border-gray-200 bg-gray-50 hover:bg-gray-100 cursor-pointer transition">
            <input type="checkbox" id="chkFiling_NoReceipts" class="mt-0.5 w-4 h-4 text-green-600 rounded border-gray-300 focus:ring-green-500">
            <div>
              <div class="text-sm font-bold text-gray-700">⚠️ No-Receipt Forms Filed</div>
              <div class="text-xs text-gray-500 mt-0.5">All acknowledgment slips signed and filed.</div>
            </div>
          </label>
          <label class="flex items-start gap-3 p-3 rounded-xl border border-gray-200 bg-gray-50 hover:bg-gray-100 cursor-pointer transition">
            <input type="checkbox" id="chkFiling_Report" class="mt-0.5 w-4 h-4 text-green-600 rounded border-gray-300 focus:ring-green-500">
            <div>
              <div class="text-sm font-bold text-gray-700">📋 Daily Report Saved</div>
              <div class="text-xs text-gray-500 mt-0.5">Report printed or saved for records.</div>
            </div>
          </label>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Notes <span class="font-normal text-gray-400">(optional)</span></label>
          <textarea id="filingNotes" rows="2" placeholder="Any remarks or exceptions..."
            class="w-full p-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-400 outline-none resize-none bg-gray-50"></textarea>
        </div>

        <button id="submitFilingBtn" onclick="submitFilingChecklist()"
          class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl shadow-sm transition text-sm">
          ✓ Submit Filing Checklist
        </button>
      </div>
    </div>

    <!-- RIGHT: History / review (Auditor sees unfiled days highlighted) -->
    <div class="lg:col-span-2">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">

        <!-- Filter bar -->
        <div class="p-4 border-b border-gray-200 bg-gray-50 flex flex-wrap items-center justify-between gap-3">
          <h2 class="font-bold text-gray-700 text-sm uppercase tracking-wide">Filing History</h2>
          <div class="flex items-center gap-2">
            <input type="month" id="filingMonthFilter" onchange="loadFilingPage()"
              class="text-xs p-1.5 border border-gray-200 rounded-lg bg-white outline-none focus:ring-2 focus:ring-amber-400">
            <span id="filing-unfiled-badge" class="hidden text-xs font-bold px-2.5 py-1 rounded-full bg-red-100 text-red-700"></span>
          </div>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead class="bg-gray-50 text-xs uppercase text-gray-500 font-semibold border-b border-gray-200">
              <tr>
                <th class="px-4 py-3">Date</th>
                <th class="px-4 py-3 text-center">🧾 OR</th>
                <th class="px-4 py-3 text-center">⚠️ No-Receipt</th>
                <th class="px-4 py-3 text-center">📋 Report</th>
                <th class="px-4 py-3">Status</th>
                <th class="px-4 py-3">Submitted By</th>
              </tr>
            </thead>
            <tbody id="filingHistoryBody" class="divide-y divide-gray-100">
              <tr><td colspan="6" class="px-4 py-8 text-center text-gray-400 text-sm">Loading...</td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>
</div>
