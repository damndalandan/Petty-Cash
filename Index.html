<style>
  .font-display { font-family: 'Syne', sans-serif; }
  .font-body { font-family: 'DM Sans', sans-serif; }
  .font-mono { font-family: 'DM Mono', monospace; }

  /* Loader */
  .loader {
    width: 1rem; height: 1rem;
    border: 2px solid #e5e7eb;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast Animation */
  @keyframes slideIn {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .toast-anim { animation: slideIn 0.3s ease-out; }

  /* Toggle Switch */
  .toggle-checkbox:checked {
    right: 0;
    border-color: #68D391;
  }
  .toggle-checkbox:checked + .toggle-label {
    background-color: #68D391;
  }
  
  /* Sidebar transition */
  .sidebar-transition { transition: transform 0.3s ease-in-out; }

  /* ── MOBILE GLOBAL ── */

  /* Prevent iOS double-tap zoom on buttons & links */
  button, a, [role="button"] { touch-action: manipulation; }

  /* Prevent iOS zoom on focused inputs (requires font-size >= 16px) */
  @media (max-width: 767px) {
    input, select, textarea {
      font-size: 16px !important;
    }
  }

  /* Smooth momentum scroll on iOS */
  .overflow-y-auto, .overflow-x-auto {
    -webkit-overflow-scrolling: touch;
  }

  /* Safe-area padding for notched / home-bar phones */
  body {
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  header {
    padding-top: max(env(safe-area-inset-top), 0px);
  }

  /* Minimum touch target (44 × 44 px) on mobile */
  @media (max-width: 767px) {
    .touch-target {
      min-height: 44px;
      display: flex;
      align-items: center;
    }
  }

  /* Mobile form-toggle button (hidden on lg+) */
  .mobile-form-toggle {
    display: none;
  }
  @media (max-width: 1023px) {
    .mobile-form-toggle {
      display: inline-flex;
    }

    /* PCR New Request form: rises as a bottom-sheet on mobile */
    #pcr-form-section:not(.hidden) {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      border-radius: 1.5rem 1.5rem 0 0;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.18);
      padding-bottom: env(safe-area-inset-bottom);
    }
  }

  /* Mobile-only tab bar for pages that use a two-panel layout */
  .mobile-panel-tabs {
    display: flex;
  }
  @media (min-width: 1024px) {
    .mobile-panel-tabs { display: none; }
  }
</style>
</head>
