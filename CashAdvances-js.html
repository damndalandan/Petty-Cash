<script>
// =============================================
// CASH ADVANCES PAGE LOGIC
// =============================================

let allAdvances     = [];
let currentAdvTab   = 'outstanding';

async function loadAdvances() {
  const listEl = document.getElementById('advances-list');
  if (!listEl) return;
  listEl.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm animate-pulse">Loading advances...</div>';

  const res = await callServer('getOutstandingCashAdvances');
  if (!res.success) {
    listEl.innerHTML = '<div class="text-center py-10 text-red-400 text-sm">Failed to load advances.</div>';
    return;
  }

  // Include liquidated ones too for the liquidated tab — fetch all
  const allRes = await callServer('getAllCashAdvances');
  allAdvances = allRes.success ? allRes.data : res.data;

  updateAdvancesBadge(res.data);
  renderAdvances();
}

function updateAdvancesBadge(outstanding) {
  const badge = document.getElementById('advances-badge');
  if (!badge) return;
  const count = outstanding.filter(a => a.status === 'ACTIVE').length;
  if (count > 0) {
    badge.textContent = count;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function switchAdvanceTab(tab) {
  currentAdvTab = tab;
  ['outstanding','pending','liquidated'].forEach(t => {
    const btn = document.getElementById('adv-tab-' + t);
    if (!btn) return;
    if (t === tab) {
      btn.className = 'px-4 py-2 text-sm font-medium rounded-md transition-all shadow-sm bg-white text-gray-800';
    } else {
      btn.className = 'px-4 py-2 text-sm font-medium rounded-md transition-all text-gray-500 hover:text-gray-700';
    }
  });
  renderAdvances();
}

function renderAdvances() {
  const listEl = document.getElementById('advances-list');
  if (!listEl) return;

  let filtered = allAdvances.filter(a => {
    if (currentAdvTab === 'outstanding') return a.status === 'ACTIVE';
    if (currentAdvTab === 'pending')     return a.status === 'LIQUIDATION_PENDING';
    if (currentAdvTab === 'liquidated')  return a.status === 'LIQUIDATED';
    return true;
  });

  if (!filtered.length) {
    const msgs = {
      outstanding: '🎉 No outstanding cash advances!',
      pending    : 'No advances pending review.',
      liquidated : 'No liquidated advances yet.'
    };
    listEl.innerHTML = `<div class="text-center py-12 bg-white rounded-2xl border border-dashed border-gray-300 text-gray-400 text-sm">${msgs[currentAdvTab]}</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(a => {
    const urgency = a.daysOutstanding >= 7
      ? 'border-red-300 bg-red-50'
      : a.daysOutstanding >= 3
        ? 'border-amber-300 bg-amber-50'
        : 'border-gray-200 bg-white';

    const daysBadge = a.status === 'LIQUIDATED'
      ? '<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-green-100 text-green-700">✅ Liquidated</span>'
      : a.daysOutstanding >= 7
        ? `<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-red-100 text-red-700">🔴 ${a.daysOutstanding} days</span>`
        : a.daysOutstanding >= 3
          ? `<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-amber-100 text-amber-700">🟡 ${a.daysOutstanding} days</span>`
          : `<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-gray-100 text-gray-600">${a.daysOutstanding} day${a.daysOutstanding !== 1 ? 's' : ''}</span>`;

    const pendingBadge = a.status === 'LIQUIDATION_PENDING'
      ? '<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 ml-2">Pending Review</span>'
      : '';

    // Action buttons based on role and status
    let actions = '';
    if (a.status === 'ACTIVE' && isCashier()) {
      actions = `
        <button onclick="openLiquidationModal('${a.id}', 'submit')"
          class="px-3 py-1.5 text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow transition">
          Submit Liquidation
        </button>`;
    }
    if (a.status === 'LIQUIDATION_PENDING' && isAuditor()) {
      actions = `
        <button onclick="openLiquidationModal('${a.id}', 'approve')"
          class="px-3 py-1.5 text-xs font-bold bg-green-600 hover:bg-green-700 text-white rounded-lg shadow transition">
          ✓ Approve
        </button>
        <button onclick="openLiquidationModal('${a.id}', 'reject')"
          class="px-3 py-1.5 text-xs font-bold bg-red-500 hover:bg-red-600 text-white rounded-lg shadow transition">
          ✕ Reject
        </button>`;
    }

    return `
      <div class="rounded-xl border ${urgency} p-4 shadow-sm transition-all">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs font-mono text-gray-400">${a.id}</span>
              ${daysBadge}
              ${pendingBadge}
            </div>
            <div class="font-bold text-gray-800 mt-1 text-sm">${a.description || 'Cash Advance'}</div>
            <div class="text-xs text-gray-500 mt-0.5">
              👤 <span class="font-medium">${a.requestedBy || '—'}</span>
              &nbsp;·&nbsp;
              📅 Issued: <span class="font-mono">${a.date}</span>
            </div>
            ${a.liquidationNote ? `<div class="text-xs text-gray-400 mt-1 italic">${a.liquidationNote}</div>` : ''}
          </div>
          <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
            <div class="text-right">
              <div class="text-lg font-black font-mono text-gray-800">${fmt(a.amount)}</div>
            </div>
            <div class="flex gap-2">${actions}</div>
          </div>
        </div>
      </div>`;
  }).join('');
}

// ─── Liquidation state ───
let liqEntries = [];
let liqAdvanceAmount = 0;

const LIQ_CATEGORIES = [
  'Office Supplies','Transportation','Meals & Entertainment',
  'Utilities','Repairs & Maintenance','Postage & Courier','Miscellaneous'
];

function openLiquidationModal(id, action) {
  const advance = allAdvances.find(a => a.id === id);
  if (!advance) return;

  liqEntries = [];
  liqAdvanceAmount = parseFloat(advance.amount) || 0;

  document.getElementById('liqAdvanceId').value = id;
  document.getElementById('liqAction').value    = action;

  // Clear all liqNote fields
  document.querySelectorAll('#liqNote').forEach(el => el.value = '');

  const titles    = { submit: 'Submit Liquidation', approve: 'Approve Liquidation', reject: 'Reject Liquidation' };
  const subtitles = { submit: 'Add expense entries to liquidate this advance', approve: 'Confirm this advance has been properly liquidated', reject: 'Send back to outstanding — state the reason' };
  const btnColors = { submit: 'bg-blue-600 hover:bg-blue-700', approve: 'bg-green-600 hover:bg-green-700', reject: 'bg-red-500 hover:bg-red-600' };

  document.getElementById('liqModalTitle').textContent    = titles[action];
  document.getElementById('liqModalSubtitle').textContent = subtitles[action];
  document.getElementById('liqConfirmBtn').className      = `flex-1 py-2.5 text-sm font-bold text-white ${btnColors[action]} rounded-xl shadow transition`;

  const advanceDetailsHTML = `
    <div class="flex justify-between items-center">
      <span>${advance.description || 'Cash Advance'}</span>
      <span class="font-black font-mono text-blue-700">${fmt(advance.amount)}</span>
    </div>
    <div class="text-xs text-gray-500 mt-1">👤 ${advance.requestedBy || '—'} · 📅 ${advance.date} · ${advance.daysOutstanding} days outstanding</div>
  `;

  // Set advance details in whichever element exists
  const detailEl = document.getElementById('liqAdvanceDetails');
  const detailElSingle = document.getElementById('liqAdvanceDetailsSingle');
  if (detailEl) detailEl.innerHTML = advanceDetailsHTML;
  if (detailElSingle) detailElSingle.innerHTML = advanceDetailsHTML;

  // Two-col vs single-col layout (new HTML)
  const twoCol    = document.getElementById('liqTwoCol');
  const singleCol = document.getElementById('liqSingleCol');
  const inner     = document.getElementById('liqModalInner');

  if (twoCol && singleCol) {
    if (action === 'submit') {
      twoCol.classList.remove('hidden');
      twoCol.classList.add('grid');
      singleCol.classList.add('hidden');
      if (inner) { inner.classList.remove('max-w-md'); inner.classList.add('max-w-4xl'); }
      const advAmt = document.getElementById('liqAdvanceAmt');
      if (advAmt) advAmt.textContent = fmt(liqAdvanceAmount);
      addLiqEntry();
      renderLiqEntries();
    } else {
      twoCol.classList.add('hidden');
      twoCol.classList.remove('grid');
      singleCol.classList.remove('hidden');
      if (inner) { inner.classList.remove('max-w-4xl'); inner.classList.add('max-w-md'); }
    }
  } else {
    // Fallback: old HTML — show/hide liqEntriesSection if it exists
    const entriesSection = document.getElementById('liqEntriesSection');
    if (entriesSection) {
      if (action === 'submit') {
        entriesSection.classList.remove('hidden');
        const advAmt = document.getElementById('liqAdvanceAmt');
        if (advAmt) advAmt.textContent = fmt(liqAdvanceAmount);
        addLiqEntry();
        renderLiqEntries();
      } else {
        entriesSection.classList.add('hidden');
      }
    }
  }

  document.getElementById('liquidationModal').classList.remove('hidden');
}

function closeLiquidationModal() {
  document.getElementById('liquidationModal').classList.add('hidden');
  liqEntries = [];
}

function addLiqEntry() {
  liqEntries.push({ desc: '', category: 'Miscellaneous', amount: '', receipt: null });
  renderLiqEntries();
}

function removeLiqEntry(idx) {
  liqEntries.splice(idx, 1);
  renderLiqEntries();
}

function updateLiqEntry(idx, field, value) {
  liqEntries[idx][field] = value;
  if (field === 'amount') updateLiqTotals();
}

function attachLiqReceipt(idx) {
  // Open the shared receipt modal; on save, store receipt data on the entry
  openReceiptModal({
    mode: 'new',
    onAttach: (receiptData) => {
      liqEntries[idx].receipt = receiptData;
      renderLiqEntries();
    }
  });
}

function removeLiqReceipt(idx) {
  liqEntries[idx].receipt = null;
  renderLiqEntries();
}

function updateLiqTotals() {
  const total   = liqEntries.reduce((sum, e) => sum + (parseFloat(e.amount) || 0), 0);
  const balance = liqAdvanceAmount - total;

  document.getElementById('liqTotalAmt').textContent = fmt(total);

  const labelEl   = document.getElementById('liqBalanceLabel');
  const amountEl  = document.getElementById('liqBalanceAmt');

  if (balance > 0.005) {
    labelEl.textContent  = 'Change to Return';
    amountEl.textContent = fmt(balance);
    amountEl.className   = 'font-mono text-amber-600';
  } else if (balance < -0.005) {
    labelEl.textContent  = 'Over by';
    amountEl.textContent = fmt(Math.abs(balance));
    amountEl.className   = 'font-mono text-red-600';
  } else {
    labelEl.textContent  = '✓ Fully Liquidated';
    amountEl.textContent = '';
    amountEl.className   = 'font-mono text-green-600';
  }
}

function renderLiqEntries() {
  const container = document.getElementById('liqEntriesList');
  if (!liqEntries.length) {
    container.innerHTML = `<div class="text-center py-4 text-gray-400 text-xs border-2 border-dashed border-gray-200 rounded-xl">No entries yet — click "+ Add Entry"</div>`;
    updateLiqTotals();
    return;
  }

  container.innerHTML = liqEntries.map((e, i) => {
    const catOptions = LIQ_CATEGORIES.map(c =>
      `<option value="${c}" ${e.category === c ? 'selected' : ''}>${c}</option>`
    ).join('');

    const receiptBtn = e.receipt
      ? `<div class="flex items-center gap-2 bg-green-50 border border-green-200 rounded-lg px-3 py-2">
           <span class="text-green-600 text-sm">🧾</span>
           <span class="text-xs font-medium text-green-700 flex-1">${e.receipt.supplierName || 'Receipt'} · ${fmt(e.receipt.grossAmount)}</span>
           <button onclick="removeLiqReceipt(${i})" class="text-xs text-red-400 hover:text-red-600 font-medium">✕</button>
         </div>`
      : `<button onclick="attachLiqReceipt(${i})"
           class="w-full flex items-center justify-center gap-2 px-3 py-2 border-2 border-dashed border-gray-300 rounded-lg text-xs font-medium text-gray-500 hover:border-green-400 hover:text-green-600 hover:bg-green-50 transition">
           🧾 Add Official Receipt <span class="text-[10px] text-gray-400 ml-1">(optional)</span>
         </button>`;

    return `
      <div class="bg-gray-50 border border-gray-200 rounded-xl p-3 space-y-2">
        <div class="flex gap-2">
          <select onchange="updateLiqEntry(${i}, 'category', this.value)"
            class="flex-1 p-1.5 border border-gray-200 rounded-lg text-xs bg-white focus:ring-1 focus:ring-blue-400 outline-none">
            ${catOptions}
          </select>
          <button onclick="removeLiqEntry(${i})" class="text-red-400 hover:text-red-600 text-lg leading-none px-1 shrink-0">×</button>
        </div>
        <input type="text" placeholder="Description" value="${e.desc}"
          oninput="updateLiqEntry(${i}, 'desc', this.value)"
          class="w-full p-1.5 border border-gray-200 rounded-lg text-xs bg-white focus:ring-1 focus:ring-blue-400 outline-none">
        <input type="number" placeholder="0.00" value="${e.amount}" step="0.01"
          oninput="updateLiqEntry(${i}, 'amount', this.value)"
          class="w-full p-1.5 border border-gray-200 rounded-lg text-xs font-mono bg-white focus:ring-1 focus:ring-blue-400 outline-none">
        ${receiptBtn}
      </div>`;
  }).join('');

  updateLiqTotals();
}

async function confirmLiquidationAction() {
  const id     = document.getElementById('liqAdvanceId').value;
  const action = document.getElementById('liqAction').value;
  const noteEls = document.querySelectorAll('#liqNote');
  const note    = Array.from(noteEls).find(el => el.offsetParent !== null)?.value.trim() || '';

  if (action === 'submit') {
    const valid = liqEntries.filter(e => e.desc.trim() && parseFloat(e.amount) > 0);
    if (!valid.length) { toast('Add at least one entry with a description and amount', 'warning'); return; }
  } else {
    if (!note) { toast('Please provide a note', 'warning'); return; }
  }

  const btn = document.getElementById('liqConfirmBtn');
  btn.disabled = true; btn.textContent = 'Saving...';

  const fnMap = { submit: 'submitLiquidation', approve: 'approveLiquidation', reject: 'rejectLiquidation' };

  const payload = {
    id,
    note,
    entries: action === 'submit'
      ? liqEntries.filter(e => e.desc.trim() && parseFloat(e.amount) > 0).map(e => ({
          category  : e.category,
          desc      : e.desc,
          amount    : parseFloat(e.amount),
          hasReceipt: !!e.receipt,
          receipt   : e.receipt || null
        }))
      : []
  };

  const res = await callServer(fnMap[action], payload);
  btn.disabled = false; btn.textContent = 'Confirm';

  if (res.success) {
    const msgs = { submit: 'Liquidation submitted ✓', approve: 'Advance liquidated ✓', reject: 'Sent back to outstanding' };
    toast(msgs[action], 'success');
    closeLiquidationModal();
    loadAdvances();
  } else {
    toast(res.message || 'Action failed', 'error');
  }
}

</script>
