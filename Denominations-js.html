<script>
  // =============================================
  // DENOMINATIONS — ROLE-SEPARATED LOGIC
  // Admin  = Opening card only (START)
  // Cashier = Closing card only (END)
  // =============================================

  function buildDenomGrid() {
    // Build opening grid (Admin)
    const openingContainer = document.getElementById('denomGrid');
    if (openingContainer) {
      openingContainer.innerHTML = BILLS.map(bill => {
        let colorClass = 'text-gray-700';
        if (bill >= 1000) colorClass = 'text-blue-600';
        else if (bill >= 500) colorClass = 'text-yellow-600';
        else if (bill >= 100) colorClass = 'text-purple-600';
        else if (bill >= 20) colorClass = 'text-orange-600';
        return `
        <div class="bg-white rounded-xl border border-gray-200 px-3 py-2.5 transition-all hover:shadow-md hover:border-blue-300 group flex-1 min-w-[85px]">
          <div class="flex flex-col items-center gap-2">
            <div class="text-base xl:text-lg font-black font-mono ${colorClass} opacity-80 group-hover:opacity-100 transition-opacity">₱${bill}</div>
            <input type="number" id="denom-${bill}" data-bill="${bill}" min="0" placeholder="0"
              class="w-full text-center text-lg font-bold py-2 px-1 border border-gray-200 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none text-gray-800"
              oninput="calcOpeningTotal()">
            <div class="w-full text-center border-t border-gray-100 pt-1.5">
              <span class="font-mono text-xs text-gray-500 group-hover:text-blue-600 transition-colors" id="dsub-${bill}">₱0.00</span>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    // Build closing grid (Cashier)
    const closingContainer = document.getElementById('denomGridClosing');
    if (closingContainer) {
      closingContainer.innerHTML = BILLS.map(bill => {
        let colorClass = 'text-gray-700';
        if (bill >= 1000) colorClass = 'text-blue-600';
        else if (bill >= 500) colorClass = 'text-yellow-600';
        else if (bill >= 100) colorClass = 'text-purple-600';
        else if (bill >= 20) colorClass = 'text-orange-600';
        return `
        <div class="bg-white rounded-xl border border-gray-200 px-3 py-2.5 transition-all hover:shadow-md hover:border-amber-300 group flex-1 min-w-[85px]">
          <div class="flex flex-col items-center gap-2">
            <div class="text-base xl:text-lg font-black font-mono ${colorClass} opacity-80 group-hover:opacity-100 transition-opacity">₱${bill}</div>
            <input type="number" id="denom-closing-${bill}" data-bill="${bill}" min="0" placeholder="0"
              class="w-full text-center text-lg font-bold py-2 px-1 border border-gray-200 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all outline-none text-gray-800"
              oninput="calcClosingTotal()">
            <div class="w-full text-center border-t border-gray-100 pt-1.5">
              <span class="font-mono text-xs text-gray-500 group-hover:text-amber-600 transition-colors" id="dsub-closing-${bill}">₱0.00</span>
            </div>
          </div>
        </div>`;
      }).join('');
    }
  }

  // ── Show only the card relevant to the user's role ──
  function applyDenomCardVisibility() {
    const openingCard = document.getElementById('denomOpeningCard');
    const closingCard = document.getElementById('denomClosingCard');
    if (!openingCard || !closingCard) return;

    if (isAdmin()) {
      openingCard.classList.remove('hidden');
      closingCard.classList.add('hidden');
      state.denomTab = 'START';
    } else if (isCashier() && !isAdmin()) {
      openingCard.classList.add('hidden');
      closingCard.classList.remove('hidden');
      state.denomTab = 'END';
    } else {
      // Auditor — hide both
      openingCard.classList.add('hidden');
      closingCard.classList.add('hidden');
    }
  }

  // ── Calc totals ──
  function calcOpeningTotal() {
    let total = 0;
    BILLS.forEach(bill => {
      const el = document.getElementById('denom-' + bill);
      const qty = parseFloat(el?.value) || 0;
      const sub = qty * bill;
      total += sub;
      const sEl = document.getElementById('dsub-' + bill);
      if (sEl) sEl.textContent = fmt(sub);
    });
    const totalEl = document.getElementById('openingTotalDisplay');
    if (totalEl) {
      totalEl.textContent = fmt(total).replace('₱', '');
      totalEl.classList.toggle('text-gray-400', total === 0);
      totalEl.classList.toggle('text-gray-800', total > 0);
    }
    refreshPrevClosingMatch();
  }

  function calcClosingTotal() {
    let total = 0;
    BILLS.forEach(bill => {
      const el = document.getElementById('denom-closing-' + bill);
      const qty = parseFloat(el?.value) || 0;
      const sub = qty * bill;
      total += sub;
      const sEl = document.getElementById('dsub-closing-' + bill);
      if (sEl) sEl.textContent = fmt(sub);
    });
    const totalEl = document.getElementById('closingTotalDisplay');
    if (totalEl) {
      totalEl.textContent = fmt(total).replace('₱', '');
      totalEl.classList.toggle('text-gray-400', total === 0);
      totalEl.classList.toggle('text-gray-800', total > 0);
    }
  }

  // Keep old name working (used in receipt sync etc.)
  function calcDenomTotal() { calcOpeningTotal(); }

  // ── Clear forms ──
  function clearDenomForm() {
    BILLS.forEach(bill => {
      const el = document.getElementById('denom-' + bill);
      if (el) el.value = '';
      const sEl = document.getElementById('dsub-' + bill);
      if (sEl) sEl.textContent = '₱0.00';
    });
    const notesEl = document.getElementById('openingNotes');
    if (notesEl) notesEl.value = '';
    const totalEl = document.getElementById('openingTotalDisplay');
    if (totalEl) { totalEl.textContent = '0.00'; totalEl.classList.add('text-gray-400'); }
  }

  function clearClosingForm() {
    BILLS.forEach(bill => {
      const el = document.getElementById('denom-closing-' + bill);
      if (el) el.value = '';
      const sEl = document.getElementById('dsub-closing-' + bill);
      if (sEl) sEl.textContent = '₱0.00';
    });
    const notesEl = document.getElementById('closingNotes');
    if (notesEl) notesEl.value = '';
    const totalEl = document.getElementById('closingTotalDisplay');
    if (totalEl) { totalEl.textContent = '0.00'; totalEl.classList.add('text-gray-400'); }
  }

  // ── Opening: lock/unlock display after save ──
  function lockOpeningDisplay(total) {
    const card = document.getElementById('denomOpeningCard');
    if (!card) return;
    card.setAttribute('data-opening-total', total);

    const totalEl = document.getElementById('openingTotalDisplay');
    if (totalEl) {
      totalEl.textContent = fmt(total).replace('₱', '');
      totalEl.classList.remove('text-gray-400');
      totalEl.classList.add('text-gray-800');
    }

    document.getElementById('openingGridSection')?.classList.add('hidden');
    document.getElementById('openingNotesSection')?.classList.add('hidden');

    if (!document.getElementById('openingLockedMsg')) {
      const msg = document.createElement('div');
      msg.id = 'openingLockedMsg';
      msg.className = 'px-6 pb-6 pt-2';
      msg.innerHTML = `
        <div class="flex items-center justify-between bg-blue-50 border border-blue-200 rounded-xl p-4">
          <div class="flex items-center gap-3">
            <span class="text-2xl">🔒</span>
            <div>
              <div class="text-sm font-bold text-blue-800">Opening Cash Locked</div>
              <div class="text-xs text-blue-500 mt-0.5">Opening count has been saved and locked.</div>
            </div>
          </div>
          <button onclick="openEditOpeningModal()" class="px-4 py-2 bg-white border border-blue-300 text-blue-700 text-xs font-bold rounded-lg hover:bg-blue-50 transition shadow-sm">✏️ Edit Opening</button>
        </div>`;
      card.appendChild(msg);
    }

    BILLS.forEach(bill => {
      const el = document.getElementById('denom-' + bill);
      if (el) { el.disabled = true; el.classList.add('opacity-50', 'cursor-not-allowed'); }
    });
  }

  function unlockOpeningDisplay() {
    document.getElementById('openingLockedMsg')?.remove();
    document.getElementById('openingGridSection')?.classList.remove('hidden');
    document.getElementById('openingNotesSection')?.classList.remove('hidden');
    BILLS.forEach(bill => {
      const el = document.getElementById('denom-' + bill);
      if (el) { el.disabled = false; el.classList.remove('opacity-50', 'cursor-not-allowed'); }
    });
  }

  // ── Closing: lock display after day is CLOSED ──
  function lockClosingDisplay() {
    document.getElementById('closingGridSection')?.classList.add('hidden');
    document.getElementById('closingNotesSection')?.classList.add('hidden');
    if (!document.getElementById('closingLockedMsg')) {
      const msg = document.createElement('div');
      msg.id = 'closingLockedMsg';
      msg.className = 'px-6 pb-6 pt-2';
      msg.innerHTML = `
        <div class="flex items-center gap-3 bg-green-50 border border-green-200 rounded-xl p-4">
          <span class="text-2xl">🔒</span>
          <div>
            <div class="text-sm font-bold text-green-800">Day Closed</div>
            <div class="text-xs text-green-600 mt-0.5">This day has been audited and locked.</div>
          </div>
        </div>`;
      document.getElementById('denomClosingCard')?.appendChild(msg);
    }
  }

  // ── Previous closing reference (Admin opening tab) ──
  function updatePrevClosingRef() {
    const banner   = document.getElementById('prevClosingRef');
    const amountEl = document.getElementById('prevClosingAmount');
    const matchEl  = document.getElementById('prevClosingMatch');
    if (!banner || !isAdmin()) return;

    const hasOpening = (state.denomRecords || []).some(r => r.type === 'START');
    if (hasOpening) { banner.classList.add('hidden'); return; }

    banner.classList.remove('hidden');
    if (state.prevDayClosing !== null) {
      amountEl.textContent = fmt(state.prevDayClosing);
      refreshPrevClosingMatch();
    } else {
      amountEl.textContent = '—';
      matchEl.textContent  = 'First Day';
      matchEl.className    = 'text-xs font-bold px-2.5 py-1 rounded-full bg-gray-100 text-gray-500';
    }
  }

  function refreshPrevClosingMatch() {
    const matchEl = document.getElementById('prevClosingMatch');
    if (!matchEl || state.prevDayClosing === null) return;
    let currentTotal = 0;
    BILLS.forEach(bill => {
      const el = document.getElementById('denom-' + bill);
      currentTotal += (parseFloat(el?.value) || 0) * bill;
    });
    const diff = currentTotal - state.prevDayClosing;
    if (Math.abs(diff) < 0.01) {
      matchEl.textContent = '✓ Matched';
      matchEl.className   = 'text-xs font-bold px-2.5 py-1 rounded-full bg-green-100 text-green-700';
    } else if (diff > 0) {
      matchEl.textContent = `+${fmt(diff)} Over`;
      matchEl.className   = 'text-xs font-bold px-2.5 py-1 rounded-full bg-blue-100 text-blue-700';
    } else {
      matchEl.textContent = `${fmt(Math.abs(diff))} Short`;
      matchEl.className   = 'text-xs font-bold px-2.5 py-1 rounded-full bg-red-100 text-red-700';
    }
  }

  // ── Opening eligibility check (Admin) ──
  async function checkOpeningEligibility() {
    document.getElementById('openingBlockedMessage')?.remove();

    const res = await callServer('findUnclosedPastDate', state.currentDate);
    if (res.success && res.date) {
      BILLS.forEach(bill => {
        const el = document.getElementById('denom-' + bill);
        if (el) { el.disabled = true; el.classList.add('opacity-50', 'cursor-not-allowed'); }
      });
      const saveBtn = document.querySelector('button[onclick="saveDenomination()"]');
      if (saveBtn) { saveBtn.disabled = true; saveBtn.classList.add('opacity-50', 'cursor-not-allowed'); }

      const gridSection = document.getElementById('openingGridSection');
      if (gridSection && !document.getElementById('openingBlockedMessage')) {
        const msg = document.createElement('div');
        msg.id = 'openingBlockedMessage';
        msg.className = 'mx-6 mt-4 mb-2 flex items-center justify-between gap-4 bg-red-50 border border-red-300 rounded-xl p-4';
        msg.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-2xl">🚫</span>
            <div>
              <div class="text-sm font-bold text-red-700">Previous Day Unclosed</div>
              <div class="text-xs text-red-500 mt-0.5">Close <span class="font-mono font-bold">${res.date}</span> first before entering today's opening.</div>
            </div>
          </div>
          <button onclick="goToDate('${res.date}')" class="shrink-0 px-4 py-2 bg-red-600 text-white text-xs font-bold rounded-lg shadow hover:bg-red-700 transition">Go to ${res.date}</button>`;
        gridSection.insertBefore(msg, gridSection.firstChild);
      }
    }
  }

  function goToDate(date) {
    const picker = document.getElementById('globalDate');
    if (picker) {
      picker.value = date;
      if (typeof onDateChange === 'function') onDateChange();
      setTimeout(() => navigate('denominations'), 500);
    }
  }

  // ── Save Opening (Admin) ──
  async function saveDenomination() {
    if (state.summary && state.summary.status === 'CLOSED') {
      toast('This day is already CLOSED. Use Edit Opening to make corrections.', 'warning');
      return;
    }
    const breakdown = {};
    let total = 0;
    BILLS.forEach(bill => {
      const el = document.getElementById('denom-' + bill);
      const qty = parseFloat(el?.value) || 0;
      if (qty > 0) breakdown[bill] = qty;
      total += qty * bill;
    });
    if (total === 0 && !confirm('Total is ₱0.00. Save anyway?')) return;

    const data = {
      date     : state.currentDate,
      type     : 'START',
      breakdown: JSON.stringify(breakdown),
      total    : total,
      notes    : document.getElementById('openingNotes')?.value || ''
    };
    await executeSave(data);
  }

  // ── Save Closing (Cashier) ──
  async function saveClosing() {
    if (state.summary && state.summary.status === 'CLOSED') {
      toast('This day is already CLOSED.', 'warning');
      return;
    }
    const breakdown = {};
    let total = 0;
    BILLS.forEach(bill => {
      const el = document.getElementById('denom-closing-' + bill);
      const qty = parseFloat(el?.value) || 0;
      if (qty > 0) breakdown[bill] = qty;
      total += qty * bill;
    });
    if (total === 0 && !confirm('Total is ₱0.00. Save anyway?')) return;

    pendingClosingData = {
      date     : state.currentDate,
      type     : 'END',
      breakdown: JSON.stringify(breakdown),
      total    : total,
      notes    : document.getElementById('closingNotes')?.value || ''
    };

    await refreshStateForClosingModal();
    showClosingModal(total);
  }

  function showLoading(bool) {
    const btn = document.querySelector('button[onclick="saveDenomination()"]');
    if (!btn) return;
    if (bool) {
      btn.dataset.original = btn.innerHTML;
      btn.innerHTML = `<span class="animate-spin inline-block mr-2">⟳</span> Saving...`;
      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-wait');
    } else {
      btn.innerHTML = btn.dataset.original || `<span>💾</span> Save Count`;
      btn.disabled = false;
      btn.classList.remove('opacity-75', 'cursor-wait');
    }
  }

  let pendingClosingData = null;

  async function refreshStateForClosingModal() {
    const [entriesRes, summaryRes] = await Promise.all([
      callServer('getExpenseEntries', state.currentDate),
      callServer('getDailySummary', state.currentDate)
    ]);
    if (entriesRes.success) state.entries = entriesRes.data || [];
    if (summaryRes.success && summaryRes.data) state.summary = summaryRes.data;
  }

  // =============================================
  // CLOSING MODAL — VARIANCE HANDLING
  // =============================================
  function showClosingModal(actual) {
    const modal = document.getElementById('closingModal');
    if (!modal) return;

    const opening = parseFloat(state.summary?.openingCash || 0);
    const expenses = state.entries
      .filter(e => e.type === 'EXPENSE' && e.status !== 'DELETED')
      .reduce((s, e) => s + parseFloat(e.amount || 0), 0);
    const cashAdvance = state.entries
      .filter(e => e.type === 'CASH_ADVANCE' && e.status !== 'DELETED')
      .reduce((s, e) => s + parseFloat(e.amount || 0), 0);
    const replenishment = state.entries
      .filter(e => e.type === 'REPLENISHMENT' && e.status !== 'DELETED')
      .reduce((s, e) => s + parseFloat(e.amount || 0), 0);

    const expected = (opening + replenishment) - (expenses + cashAdvance);
    const variance = actual - expected;

    document.getElementById('modExpected').textContent = fmt(expected);
    document.getElementById('modActual').textContent   = fmt(actual);

    const vEl = document.getElementById('modVariance');
    vEl.dataset.value = variance.toFixed(2);
    vEl.textContent = (variance > 0 ? '+' : '') + fmt(Math.abs(variance));
    vEl.className = 'font-mono font-black text-2xl ' +
      (Math.abs(variance) < 0.01 ? 'text-green-600' : variance < 0 ? 'text-red-600' : 'text-blue-600');

    const sEl = document.getElementById('modStatus');
    const shortagePanel = document.getElementById('shortagePanel');
    const overagePanel  = document.getElementById('overagePanel');
    if (shortagePanel) shortagePanel.classList.add('hidden');
    if (overagePanel)  overagePanel.classList.add('hidden');

    const chkShortage  = document.getElementById('chkCreateShortage');
    const chkCustodian = document.getElementById('chkCustodianTopUp');
    const chkOverage   = document.getElementById('chkCreateOverage');
    if (chkShortage)  chkShortage.checked  = false;
    if (chkCustodian) chkCustodian.checked = false;
    if (chkOverage)   chkOverage.checked   = false;

    if (Math.abs(variance) < 0.01) {
      sEl.textContent = '✅ BALANCED';
      sEl.className = 'text-xs text-green-600 font-bold uppercase tracking-widest mt-1';
    } else if (variance < 0) {
      sEl.textContent = '⚠️ SHORTAGE';
      sEl.className = 'text-xs text-red-500 font-bold uppercase tracking-widest mt-1';
      if (shortagePanel) {
        shortagePanel.classList.remove('hidden');
        shortagePanel.querySelectorAll('.variance-amount').forEach(el => el.textContent = fmt(Math.abs(variance)));
      }
    } else {
      sEl.textContent = '💰 OVERAGE';
      sEl.className = 'text-xs text-blue-500 font-bold uppercase tracking-widest mt-1';
      if (overagePanel) {
        overagePanel.classList.remove('hidden');
        overagePanel.querySelectorAll('.variance-amount').forEach(el => el.textContent = fmt(variance));
      }
    }

    const entriesListEl = document.getElementById('closingEntriesList');
    if (entriesListEl) {
      const dayEntries = state.entries.filter(e => e.status !== 'DELETED' && !e.carriedForward);
      if (!dayEntries.length) {
        entriesListEl.innerHTML = '<div class="px-4 py-3 text-xs text-gray-400 text-center italic">No entries for today</div>';
      } else {
        entriesListEl.innerHTML = dayEntries.map(e => {
          const typeLabel = e.type === 'CASH_ADVANCE' ? '💳' : e.type === 'REPLENISHMENT' ? '🔄' : '💸';
          const rcptBadge = e.type === 'EXPENSE'
            ? (e.hasReceipt
                ? '<span class="text-[10px] font-bold text-green-700 bg-green-100 px-1.5 py-0.5 rounded">🧾 OR</span>'
                : '<span class="text-[10px] font-bold text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded">⚠️ No Receipt</span>')
            : '';
          return `
            <div class="flex items-center justify-between px-4 py-2.5 text-sm gap-2">
              <div class="flex items-center gap-2 flex-1 min-w-0">
                <span>${typeLabel}</span>
                <span class="truncate text-gray-700 font-medium">${e.description || '—'}</span>
                ${rcptBadge}
              </div>
              <span class="font-mono text-gray-600 shrink-0">${fmt(e.amount)}</span>
            </div>`;
        }).join('');
      }
    }
    modal.classList.remove('hidden');
  }

  function closeClosingModal() {
    const modal = document.getElementById('closingModal');
    if (modal) modal.classList.add('hidden');
    pendingClosingData = null;
  }

  async function confirmClosingSave() {
    if (!pendingClosingData) return;

    const vEl         = document.getElementById('modVariance');
    const varianceVal = parseFloat(vEl?.dataset.value || '0');

    const chkShortage  = document.getElementById('chkCreateShortage');
    const chkCustodian = document.getElementById('chkCustodianTopUp');
    const chkOverage   = document.getElementById('chkCreateOverage');

    const createShortageEntry  = chkShortage?.checked  && varianceVal < -0.01;
    const createCustodianTopUp = chkCustodian?.checked && varianceVal < -0.01;
    const createOverageEntry   = chkOverage?.checked   && varianceVal >  0.01;

    const dataToSave = { ...pendingClosingData };
    closeClosingModal();

    await executeSave(dataToSave);

    if (createShortageEntry) {
      const amt = Math.abs(varianceVal);
      toast('Recording shortage entry...', 'info');
      const res = await callServer('saveExpenseEntry', {
        date: dataToSave.date, type: 'EXPENSE', category: 'Miscellaneous',
        description: `Cash Shortage — ₱${amt.toFixed(2)} unaccounted`,
        amount: amt, hasReceipt: false, referenceNo: 'SHORTAGE-ADJ',
        requestedBy: 'System', approvedBy: 'Auto'
      });
      if (res.success) toast(`Shortage of ${fmt(amt)} recorded ✓`, 'success');
      else toast('Failed to record shortage: ' + res.message, 'error');
    }

    if (createCustodianTopUp) {
      const amt = Math.abs(varianceVal);
      toast('Recording custodian top-up...', 'info');
      const res = await callServer('saveReplenishmentEntry', {
        date: dataToSave.date, type: 'REPLENISHMENT', category: 'Replenishment',
        description: `Custodian Top-Up — ₱${amt.toFixed(2)} replaced by custodian`,
        amount: amt, hasReceipt: false, referenceNo: 'CUSTODIAN-TOPUP',
        requestedBy: 'Custodian', approvedBy: ''
      });
      if (res.success) toast(`Custodian top-up of ${fmt(amt)} logged ✓`, 'success');
      else toast('Failed to log top-up: ' + res.message, 'error');
    }

    if (createOverageEntry) {
      const amt = Math.abs(varianceVal);
      toast('Recording overage entry...', 'info');
      const res = await callServer('saveCashOverEntry', {
        date: dataToSave.date, type: 'CASH_OVER', category: 'Miscellaneous',
        description: `Cash Overage — ₱${amt.toFixed(2)} more than expected`,
        amount: amt, hasReceipt: false, referenceNo: 'OVER-ADJ',
        requestedBy: 'System', approvedBy: 'Auto'
      });
      if (res.success) toast(`Overage of ${fmt(amt)} recorded ✓`, 'success');
      else toast('Failed to record overage: ' + res.message, 'error');
    }

    loadDayData();
  }

  async function executeSave(data) {
    showLoading(true);
    try {
      const res = await callServer('saveDenominationRecord', data);
      if (res.success) {
        if (state.editingOpening) {
          toast('Opening count updated & change logged ✓', 'success');
          state.editingOpening = false;
        } else {
          toast('Cash count saved ✓', 'success');
        }
        clearDenomForm();
        loadDayData();
        loadDenominations();
      } else {
        toast(res.message || 'Failed to save', 'error');
      }
    } catch(e) {
      console.error(e);
      toast('Error saving record', 'error');
    } finally {
      showLoading(false);
    }
  }

  // ── Load denominations (called on page navigate) ──
  async function loadDenominations() {
    const container = document.getElementById('savedDenomsContainer');
    if (!container) return;

    applyDenomCardVisibility();
    if (isAdmin()) checkOpeningEligibility();

    container.innerHTML = '<div class="text-center py-6 text-gray-400 text-sm animate-pulse">Loading records...</div>';

    try {
      const [denomRes, summaryRes, prevRes] = await Promise.all([
        callServer('getDenominationRecords', state.currentDate),
        callServer('getDailySummary', state.currentDate),
        callServer('getPreviousDayClosing', state.currentDate)
      ]);

      if (summaryRes.success && summaryRes.data) state.summary = summaryRes.data;
      state.prevDayClosing = (prevRes.success && prevRes.data) ? prevRes.data.closingCash : null;
      state.prevDayDate    = (prevRes.success && prevRes.data) ? prevRes.data.date : null;

      if (denomRes.success) {
        state.denomRecords = denomRes.data || [];

        const opening = state.denomRecords.find(r => r.type === 'START');

        if (isAdmin()) {
          if (opening) lockOpeningDisplay(opening.total);
          else unlockOpeningDisplay();
          updatePrevClosingRef();
        }

        if (isCashier() && !isAdmin()) {
          if (state.summary?.status === 'CLOSED') lockClosingDisplay();
        }

        renderDenomRecords(state.denomRecords);
        applyClosedDayGuard();
      }
    } catch(e) {
      console.error(e);
      container.innerHTML = '<div class="text-center text-red-400 py-4 text-sm">Failed to load records</div>';
    }
  }

  // ── applyClosedDayGuard — banners only ──
  function applyClosedDayGuard() {
    const status    = state.summary?.status;
    const isClosed  = status === 'CLOSED';
    const isFlagged = status === 'FLAGGED';
    const isToday   = state.currentDate === new Date().toISOString().split('T')[0];

    if (state.userRole === 'Auditor') return;

    document.getElementById('closedDayBanner')?.remove();
    document.getElementById('flaggedDayBanner')?.remove();

    if (isFlagged && isCashier()) {
      const card = document.getElementById('denomClosingCard');
      if (card) {
        const b = document.createElement('div');
        b.id = 'flaggedDayBanner';
        b.className = 'mb-4 flex items-start gap-3 bg-red-50 border border-red-400 rounded-xl p-4 shadow-sm';
        b.innerHTML = `<span class="text-2xl">🚩</span><div><div class="text-sm font-bold text-red-800">Recount Required</div><div class="text-xs text-red-600 mt-0.5">The auditor flagged this day. Please recount and re-enter your closing.</div></div>`;
        card.parentElement.insertBefore(b, card);
      }
    }

    if (isClosed) {
      const card = isAdmin()
        ? document.getElementById('denomOpeningCard')
        : document.getElementById('denomClosingCard');
      if (card) {
        const b = document.createElement('div');
        b.id = 'closedDayBanner';
        b.className = 'mb-4 flex items-center justify-between gap-4 bg-green-50 border border-green-300 rounded-xl p-4 shadow-sm';
        b.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-2xl">🔒</span>
            <div>
              <div class="text-sm font-bold text-green-800">This Day is Closed</div>
              <div class="text-xs text-green-600 mt-0.5">Cash has been audited and locked for ${state.currentDate}.${isToday ? ' Use Edit Opening for corrections.' : ''}</div>
            </div>
          </div>
          <div class="text-xs font-bold text-green-700 bg-green-100 px-3 py-1.5 rounded-full border border-green-200">✓ CLOSED</div>`;
        card.parentElement.insertBefore(b, card);
      }
    }
  }

  function renderDenomRecords(data) {
    const container = document.getElementById('savedDenomsContainer');
    if (!container) return;
    if (data && data.length > 0) {
      container.innerHTML = data.map(d => {
        const isStart = d.type === 'START';
        const color = isStart ? 'text-blue-600 bg-blue-50 border-blue-200' : 'text-amber-600 bg-amber-50 border-amber-200';
        const icon  = isStart ? '☀️' : '🌙';
        const label = isStart ? 'Opening' : 'Closing';
        const ts    = d.timestamp ? new Date(d.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--:--';
        const editBtn = isStart
          ? `<button onclick="openEditOpeningModal()" class="mt-1 text-xs text-blue-500 hover:text-blue-700 font-medium transition">✏️ Edit Opening</button>`
          : '';
        return `
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-white hover:bg-gray-50 rounded-xl border border-gray-200 transition-all shadow-sm">
            <div class="flex items-center gap-3 mb-2 sm:mb-0">
              <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg border ${color}">${icon}</div>
              <div>
                <div class="font-bold text-gray-800 text-sm">${label} Count</div>
                <div class="text-xs text-gray-400 font-mono">${ts}</div>
                ${editBtn}
              </div>
            </div>
            <div class="text-right w-full sm:w-auto">
              <div class="font-black text-xl text-gray-800 tracking-tight">${fmt(d.total)}</div>
              <div class="text-xs text-gray-400 italic truncate max-w-[180px]">${d.notes || 'No notes'}</div>
            </div>
          </div>`;
      }).join('');
    } else {
      container.innerHTML = `<div class="text-center py-8 bg-gray-50 rounded-xl border border-dashed border-gray-300 text-gray-400 text-sm">No denomination records for this date</div>`;
    }
  }

  // ── Edit Opening Modal (Admin) ──
  function openEditOpeningModal() {
    const openingRecord = (state.denomRecords || []).find(r => r.type === 'START');
    if (!openingRecord) return;

    if (!document.getElementById('editOpeningModal')) {
      const gridHTML = BILLS.map(bill => `
        <div class="flex flex-col items-center bg-gray-50 rounded-xl p-3 border border-gray-100">
          <span class="text-xs font-black font-mono text-gray-500 mb-2">₱${bill}</span>
          <input type="number" id="edit-denom-${bill}" min="0" placeholder="0"
            class="w-full text-center text-lg font-bold p-2 border border-gray-200 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none"
            oninput="calcEditOpeningTotal()">
          <span class="text-xs font-mono text-gray-400 mt-1" id="edit-dsub-${bill}">₱0.00</span>
        </div>`).join('');

      const modal = document.createElement('div');
      modal.id = 'editOpeningModal';
      modal.className = 'hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4';
      modal.innerHTML = `
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
          <div class="bg-gradient-to-r from-blue-700 to-blue-600 p-5 flex justify-between items-center">
            <div>
              <h3 class="text-white font-bold text-lg">✏️ Edit Opening Count</h3>
              <p class="text-blue-100 text-xs mt-0.5">Changes will be logged as a new record</p>
            </div>
            <button onclick="closeEditOpeningModal()" class="text-white/70 hover:text-white text-2xl font-light">&times;</button>
          </div>
          <div class="p-6 space-y-4 overflow-y-auto max-h-[60vh]">
            <div class="grid grid-cols-3 sm:grid-cols-5 gap-3" id="editOpeningGrid">${gridHTML}</div>
            <div>
              <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Reason for Edit</label>
              <input type="text" id="editOpeningNotes" placeholder="e.g. Miscounted earlier"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>
          <div class="p-5 border-t border-gray-100 flex justify-between items-center bg-gray-50">
            <span class="text-sm font-bold text-gray-700">Total: <span id="editOpeningTotal" class="font-mono text-blue-700">₱0.00</span></span>
            <div class="flex gap-2">
              <button onclick="closeEditOpeningModal()" class="px-4 py-2 bg-white border border-gray-300 text-gray-600 text-sm font-medium rounded-lg hover:bg-gray-50 transition">Cancel</button>
              <button onclick="saveEditOpening()" class="px-5 py-2 bg-blue-600 text-white text-sm font-bold rounded-lg hover:bg-blue-700 transition">💾 Save Changes</button>
            </div>
          </div>
        </div>`;
      document.body.appendChild(modal);
    }

    BILLS.forEach(bill => {
      const el = document.getElementById('edit-denom-' + bill);
      if (el) el.value = openingRecord.denominations?.[String(bill)] || '';
      const sub = document.getElementById('edit-dsub-' + bill);
      if (sub) sub.textContent = fmt((parseFloat(openingRecord.denominations?.[String(bill)]) || 0) * bill);
    });
    document.getElementById('editOpeningNotes').value = '';
    calcEditOpeningTotal();
    document.getElementById('editOpeningModal').classList.remove('hidden');
  }

  function closeEditOpeningModal() {
    document.getElementById('editOpeningModal')?.classList.add('hidden');
  }

  function calcEditOpeningTotal() {
    let total = 0;
    BILLS.forEach(bill => {
      const qty = parseFloat(document.getElementById('edit-denom-' + bill)?.value) || 0;
      const sub = qty * bill;
      total += sub;
      const subEl = document.getElementById('edit-dsub-' + bill);
      if (subEl) subEl.textContent = fmt(sub);
    });
    const totalEl = document.getElementById('editOpeningTotal');
    if (totalEl) totalEl.textContent = fmt(total);
  }

  async function saveEditOpening() {
    const breakdown = {};
    let total = 0;
    BILLS.forEach(bill => {
      const qty = parseFloat(document.getElementById('edit-denom-' + bill)?.value) || 0;
      if (qty > 0) breakdown[bill] = qty;
      total += qty * bill;
    });
    const notes = document.getElementById('editOpeningNotes')?.value.trim() || 'Opening count revised';
    const saveBtn = document.querySelector('#editOpeningModal button[onclick="saveEditOpening()"]');
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving...'; }

    const res = await callServer('updateDenominationRecord', {
      date     : state.currentDate,
      type     : 'START',
      breakdown: JSON.stringify(breakdown),
      total    : total,
      notes    : `[EDIT] ${notes}`
    });

    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '💾 Save Changes'; }
    if (res.success) {
      toast('Opening count updated & logged ✓', 'success');
      closeEditOpeningModal();
      loadDayData();
      loadDenominations();
    } else {
      toast(res.message || 'Failed to save', 'error');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    buildDenomGrid();
  });

  window.refreshDenomGrid = buildDenomGrid;
</script>
