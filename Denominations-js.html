<script>
// =============================================
// DENOMINATIONS: MODERN CARD LOGIC
// =============================================

function buildDenomGrid() {
  const container = document.getElementById('denomGrid');
  if(!container) return;
  
  // Use global BILLS if available, otherwise fallback
  const billTypes = (typeof BILLS !== 'undefined') ? BILLS : [1000, 500, 200, 100, 50, 20, 10, 5, 1, 0.25];

  container.innerHTML = billTypes.map(bill => {
    // Determine color/icon based on bill value for visual distinctness
    let colorClass = 'text-gray-700'; 
    if(bill >= 1000) colorClass = 'text-blue-600';
    else if(bill >= 500) colorClass = 'text-yellow-600';
    else if(bill >= 100) colorClass = 'text-purple-600';
    else if(bill >= 20) colorClass = 'text-orange-600';
    
    return `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 xl:p-4 transition-all hover:shadow-md hover:-translate-y-1 group flex-1 min-w-[110px]">
       <div class="flex flex-col items-center gap-2">
          <!-- Bill Image/Value -->
          <div class="text-xl xl:text-2xl font-black font-mono ${colorClass} opacity-80 group-hover:opacity-100 transition-opacity">
            ₱${bill}
          </div>
          
          <!-- Input -->
          <input type="number" 
                 id="denom-${bill}" 
                 data-bill="${bill}"
                 min="0" 
                 placeholder="0" 
                 class="w-full text-center text-xl font-bold p-2 border border-gray-200 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none text-gray-800"
                 oninput="calcDenomTotal(this)">
          
          <!-- Subtotal -->
          <div class="w-full text-center text-xs font-medium text-gray-400 border-t border-gray-100 pt-2 mt-1">
             <span class="font-mono text-gray-600 group-hover:text-blue-600 transition-colors" id="dsub-${bill}">₱0.00</span>
          </div>
       </div>
    </div>
    `;
  }).join('');
}

function calcDenomTotal(changedInput) {
  let total = 0;
  
  // Recalculate all
  // Use global BILLS or fallback
  const billTypes = (typeof BILLS !== 'undefined') ? BILLS : [1000, 500, 200, 100, 50, 20, 10, 5, 1, 0.25];

  billTypes.forEach(bill => {
    const el = document.getElementById('denom-' + bill);
    if (!el) return;
    
    const qty = parseFloat(el.value) || 0; 
    const sub = qty * bill;
    total += sub;
    
    // Update subtotal display
    const sEl = document.getElementById('dsub-' + bill);
    if(sEl) sEl.textContent = fmt(sub);
  });
  
  // Update Total Display with animation effect 
  const totalEl = document.getElementById('denomTotalDisplay');
  // Simple check to add color if positive
  if (total > 0) {
      totalEl.classList.remove('text-gray-400');
      totalEl.classList.add('text-gray-800');
  } else {
      totalEl.classList.add('text-gray-400');
  }
  totalEl.textContent = fmt(total).replace('₱', ''); // Remove symbol as it's separate in new design
}

function clearDenomForm() {
  const billTypes = (typeof BILLS !== 'undefined') ? BILLS : [1000, 500, 200, 100, 50, 20, 10, 5, 1, 0.25];
  billTypes.forEach(bill => {
    const el = document.getElementById('denom-' + bill);
    if(el) el.value = '';
    const sel = document.getElementById('dsub-' + bill);
    if(sel) sel.textContent = '₱0.00';
  });
  document.getElementById('denomNotes').value = '';
  document.getElementById('denomTotalDisplay').textContent = '0.00';
}

function switchDenomTab(type) {
  state.denomTab = type;
  document.getElementById('denomType').value = type;
  
  // UI References
  const btnStart = document.getElementById('btn-tab-start');
  const btnEnd = document.getElementById('btn-tab-end');
  const container = document.getElementById('denomCardContainer');
  const label = document.getElementById('denomLabel');

  // Reset basic styles
  btnStart.className = "px-6 py-2.5 text-sm font-bold rounded-lg transition-all flex items-center gap-2";
  btnEnd.className = "px-6 py-2.5 text-sm font-bold rounded-lg transition-all flex items-center gap-2";
  container.className = "bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden transition-colors duration-500 border-t-4";

  if (type === 'START') {
     // Opening Styles (Blue)
     btnStart.classList.add('bg-blue-600', 'text-white', 'shadow-md');
     btnEnd.classList.add('text-gray-500', 'hover:bg-gray-200', 'hover:text-gray-700');
     
     container.classList.add('border-blue-500');
     label.textContent = "Opening Total";
     
  } else {
     // Closing Styles (Orange/Yellow)
     btnStart.classList.add('text-gray-500', 'hover:bg-gray-200', 'hover:text-gray-700');
     btnEnd.classList.add('bg-amber-500', 'text-white', 'shadow-md');
     
     container.classList.add('border-amber-500');
     label.textContent = "Closing Total";
  }
}

// Backend Integration
function showLoading(bool) {
  const btn = document.querySelector('button[onclick="saveDenomination()"]');
  if(!btn) return;
  
  if(bool) {
    btn.dataset.original = btn.innerHTML;
    btn.innerHTML = `<span class="animate-spin inline-block mr-2">⟳</span> Saving...`;
    btn.disabled = true;
    btn.classList.add('opacity-75', 'cursor-wait');
  } else {
    btn.innerHTML = btn.dataset.original || `<span>💾</span> Save Record`;
    btn.disabled = false;
    btn.classList.remove('opacity-75', 'cursor-wait');
  }
}

async function saveDenomination() {
  const breakdown = {};
  let total = 0;
  const billTypes = (typeof BILLS !== 'undefined') ? BILLS : [1000, 500, 200, 100, 50, 20, 10, 5, 1, 0.25];

  billTypes.forEach(bill => {
    const el = document.getElementById('denom-' + bill);
    const qty = parseFloat(el?.value) || 0;
    if (qty > 0) {
        breakdown[bill] = qty;
    }
    total += (qty * bill);
  });

  if (total === 0 && !confirm("Total is 0.00. Save anyway?")) return;

  const data = {
    date: state.currentDate,
    type: state.denomTab,
    breakdown: JSON.stringify(breakdown), 
    total: total,
    notes: document.getElementById('denomNotes').value
  };
  
  showLoading(true);
  try {
      const res = await callServer('saveDenominationRecord', data);
      if (res.success) {
        toast('Denomination record saved successfully', 'success');
        clearDenomForm();
        // Removed history loading
      } else {
        toast(res.message || 'Failed to save', 'error'); 
      }
  } catch(e) {
      console.error(e);
      toast('Error saving record', 'error');
  } finally {
      showLoading(false);
  }
}

async function loadDenominations() {
  const container = document.getElementById('savedDenomsContainer');
  container.innerHTML = '<div class="text-center py-6 text-gray-400 animate-pulse">Loading records...</div>';
  
  try {
      const res = await callServer('getDenominationRecords', state.currentDate);
      
      if (res.success && res.data && res.data.length > 0) {
        container.innerHTML = res.data.map(d => {
            const isStart = d.type === 'START';
            const color = isStart ? 'text-blue-600 bg-blue-50 border-blue-100' : 'text-amber-600 bg-amber-50 border-amber-100';
            const icon = isStart ? '☀️' : '🌙';
            const label = isStart ? 'Opening' : 'Closing';
            
            return `
           <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-white hover:bg-gray-50 rounded-xl border border-gray-200 transition-all shadow-sm">
              <div class="flex items-center gap-3 mb-2 sm:mb-0">
                  <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg ${color}">
                    ${icon}
                  </div>
                  <div>
                    <div class="font-bold text-gray-800 text-sm">${label} Count</div>
                    <div class="text-xs text-gray-400 font-mono">${new Date(d.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                  </div>
              </div>
              
              <div class="text-right w-full sm:w-auto">
                 <div class="font-black text-xl text-gray-800 tracking-tight">${fmt(d.total)}</div>
                 <div class="text-xs text-gray-400 italic truncate max-w-[150px]">${d.notes || 'No notes'}</div>
              </div>
           </div>
        `}).join('');
      } else {
        container.innerHTML = `
           <div class="text-center py-8 bg-gray-50 rounded-xl border border-dashed border-gray-300 text-gray-400 text-sm">
              No records found for today
           </div>`;
      }
  } catch (e) {
      console.error(e);
      container.innerHTML = '<div class="text-center text-red-400 py-4 text-sm">Failed to load records</div>';
  }
}

// Initial Setup when page view is activated
// This is likely handled by global router, but we ensure grid is built
// We can hook into a hypothetical 'onViewLoad' if it exists, or just ensure buildDenomGrid is called
// when script loads or when tab is switched. 
// Ideally global script calls init functions. 
// For now, let's expose an init function or just run it if page is visible?
// 'BILLS' might not be ready if this runs too early. 
// Let's assume the main Index logic calls `buildDenomGrid` or we attach it to window load.

document.addEventListener('DOMContentLoaded', () => {
    // Retry building grid if BILLS wasn't ready immediately
    setTimeout(buildDenomGrid, 100); 
});

// Also expose it globally if needed
window.refreshDenomGrid = buildDenomGrid;

</script>
