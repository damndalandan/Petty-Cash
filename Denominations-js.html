<script>
// =============================================
// DENOMINATIONS: MODERN CARD LOGIC
// =============================================

function buildDenomGrid() {
  const container = document.getElementById('denomGrid');
  if(!container) return;
  
  const billTypes = (typeof BILLS !== 'undefined') ? BILLS : [1000, 500, 200, 100, 50, 20, 10, 5, 1];

  container.innerHTML = billTypes.map(bill => {
    let colorClass = 'text-gray-700'; 
    if(bill >= 1000) colorClass = 'text-blue-600';
    else if(bill >= 500) colorClass = 'text-yellow-600';
    else if(bill >= 100) colorClass = 'text-purple-600';
    else if(bill >= 20) colorClass = 'text-orange-600';
    
    return `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 xl:p-4 transition-all hover:shadow-md hover:-translate-y-1 group flex-1 min-w-[110px]">
       <div class="flex flex-col items-center gap-2">
          <div class="text-xl xl:text-2xl font-black font-mono ${colorClass} opacity-80 group-hover:opacity-100 transition-opacity">
            ₱${bill}
          </div>
          <input type="number" 
                 id="denom-${bill}" 
                 data-bill="${bill}"
                 min="0" 
                 placeholder="0" 
                 class="w-full text-center text-xl font-bold p-2 border border-gray-200 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none text-gray-800"
                 oninput="calcDenomTotal(this)">
          <div class="w-full text-center text-xs font-medium text-gray-400 border-t border-gray-100 pt-2 mt-1">
             <span class="font-mono text-gray-600 group-hover:text-blue-600 transition-colors" id="dsub-${bill}">₱0.00</span>
          </div>
       </div>
    </div>
    `;
  }).join('');
}

function calcDenomTotal() {
  let total = 0;
  const billTypes = (typeof BILLS !== 'undefined') ? BILLS : [1000, 500, 200, 100, 50, 20, 10, 5, 1];

  billTypes.forEach(bill => {
    const el = document.getElementById('denom-' + bill);
    if (!el) return;
    const qty = parseFloat(el.value) || 0; 
    const sub = qty * bill;
    total += sub;
    const sEl = document.getElementById('dsub-' + bill);
    if(sEl) sEl.textContent = fmt(sub);
  });
  
  const totalEl = document.getElementById('denomTotalDisplay');
  if (!totalEl) return;
  if (total > 0) {
    totalEl.classList.remove('text-gray-400');
    totalEl.classList.add('text-gray-800');
  } else {
    totalEl.classList.add('text-gray-400');
  }
  totalEl.textContent = fmt(total).replace('₱', '');
}

function clearDenomForm() {
  const billTypes = (typeof BILLS !== 'undefined') ? BILLS : [1000, 500, 200, 100, 50, 20, 10, 5, 1];
  billTypes.forEach(bill => {
    const el = document.getElementById('denom-' + bill);
    if(el) el.value = '';
    const sel = document.getElementById('dsub-' + bill);
    if(sel) sel.textContent = '₱0.00';
  });
  const notesEl = document.getElementById('denomNotes');
  if(notesEl) notesEl.value = '';
  const totalEl = document.getElementById('denomTotalDisplay');
  if(totalEl) { totalEl.textContent = '0.00'; totalEl.classList.add('text-gray-400'); }
}

function switchDenomTab(type) {
  state.denomTab = type;
  const denomTypeEl = document.getElementById('denomType');
  if(denomTypeEl) denomTypeEl.value = type;
  
  const btnStart = document.getElementById('btn-tab-start');
  const btnEnd = document.getElementById('btn-tab-end');
  const container = document.getElementById('denomCardContainer');
  const label = document.getElementById('denomLabel');

  const existingMsg = document.getElementById('openingBlockedMessage');
  if(existingMsg) existingMsg.remove();
  if(container) container.classList.remove('hidden');

  if(btnStart) btnStart.className = "px-6 py-2.5 text-sm font-bold rounded-lg transition-all flex items-center gap-2";
  if(btnEnd)   btnEnd.className   = "px-6 py-2.5 text-sm font-bold rounded-lg transition-all flex items-center gap-2";
  if(container) container.className = "bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden transition-colors duration-500 border-t-4";

  if (type === 'START') {
    if(btnStart) btnStart.classList.add('bg-blue-600', 'text-white', 'shadow-md');
    if(btnEnd)   btnEnd.classList.add('text-gray-500', 'hover:bg-gray-200', 'hover:text-gray-700');
    if(container) container.classList.add('border-blue-500');
    if(label) label.textContent = "Opening Total";
    checkOpeningEligibility();
  } else {
    if(btnStart) btnStart.classList.add('text-gray-500', 'hover:bg-gray-200', 'hover:text-gray-700');
    if(btnEnd)   btnEnd.classList.add('bg-amber-500', 'text-white', 'shadow-md');
    if(container) container.classList.add('border-amber-500');
    if(label) label.textContent = "Closing Total";
  }
}

async function checkOpeningEligibility() {
  const res = await callServer('findUnclosedPastDate', state.currentDate);
  if (res.success && res.date) {
    const container = document.getElementById('denomCardContainer');
    if(container) container.classList.add('hidden');
    const wrapper = container ? container.parentElement : null;
    if(!wrapper || document.getElementById('openingBlockedMessage')) return;
    const msg = document.createElement('div');
    msg.id = 'openingBlockedMessage';
    msg.className = 'p-8 text-center bg-red-50 border-l-4 border-red-500 rounded-r-xl shadow-sm';
    msg.innerHTML = `
      <div class="text-4xl mb-4">🚫</div>
      <h3 class="text-lg font-bold text-red-700 mb-2">Previous Day Unclosed</h3>
      <p class="text-gray-600 mb-4">The cash for <span class="font-mono font-bold bg-white px-2 py-1 rounded border">${res.date}</span> was never closed.</p>
      <button onclick="goToDate('${res.date}')" class="px-5 py-2 bg-red-600 text-white font-bold rounded-lg shadow hover:bg-red-700 transition">Go to ${res.date}</button>
    `;
    wrapper.insertBefore(msg, container);
  }
}

function goToDate(date) {
  const picker = document.getElementById('globalDate');
  if(picker) {
    picker.value = date;
    if(typeof onDateChange === 'function') onDateChange();
    setTimeout(() => { navigate('denominations'); switchDenomTab('END'); }, 500);
  }
}

function showLoading(bool) {
  const btn = document.querySelector('button[onclick="saveDenomination()"]');
  if(!btn) return;
  if(bool) {
    btn.dataset.original = btn.innerHTML;
    btn.innerHTML = `<span class="animate-spin inline-block mr-2">⟳</span> Saving...`;
    btn.disabled = true;
    btn.classList.add('opacity-75', 'cursor-wait');
  } else {
    btn.innerHTML = btn.dataset.original || `<span>💾</span> Save Count`;
    btn.disabled = false;
    btn.classList.remove('opacity-75', 'cursor-wait');
  }
}

let pendingClosingData = null;

async function saveDenomination() {
  // Guard: don't allow saving on a closed day
  if (state.summary && state.summary.status === 'CLOSED' && state.denomTab === 'END') {
    if (!confirm('This day is already CLOSED. Override and save a new closing count?')) return;
  }

  const breakdown = {};
  let total = 0;
  const billTypes = (typeof BILLS !== 'undefined') ? BILLS : [1000, 500, 200, 100, 50, 20, 10, 5, 1];

  billTypes.forEach(bill => {
    const el = document.getElementById('denom-' + bill);
    const qty = parseFloat(el?.value) || 0;
    if (qty > 0) breakdown[bill] = qty;
    total += (qty * bill);
  });

  if (total === 0 && !confirm("Total is ₱0.00. Save anyway?")) return;

  const data = {
    date: state.currentDate,
    type: state.denomTab,
    breakdown: JSON.stringify(breakdown),
    total: total,
    notes: document.getElementById('denomNotes')?.value || ''
  };

  if (state.denomTab === 'END') {
    pendingClosingData = data;
    // Always fetch fresh state before computing variance
    await refreshStateForClosingModal();
    showClosingModal(total);
    return;
  }

  await executeSave(data);
}

// Re-fetch entries + summary fresh from server before opening the closing modal
// so variance is never computed against stale in-memory state
async function refreshStateForClosingModal() {
  const [entriesRes, summaryRes] = await Promise.all([
    callServer('getExpenseEntries', state.currentDate),
    callServer('getDailySummary', state.currentDate)
  ]);
  if (entriesRes.success) state.entries = entriesRes.data || [];
  if (summaryRes.success && summaryRes.data) state.summary = summaryRes.data;
}

// =============================================
// CLOSING MODAL — VARIANCE HANDLING
// =============================================
function showClosingModal(actual) {
  const modal = document.getElementById('closingModal');
  if(!modal) return;

  // Compute expected from fresh state
  const opening = parseFloat(state.summary?.openingCash || 0);

  const expenses = state.entries
    .filter(e => e.type === 'EXPENSE' && e.status !== 'DELETED')
    .reduce((s, e) => s + parseFloat(e.amount || 0), 0);

  const cashAdvance = state.entries
    .filter(e => e.type === 'CASH_ADVANCE' && e.status !== 'DELETED')
    .reduce((s, e) => s + parseFloat(e.amount || 0), 0);

  // Cash overs already recorded should be counted as reducing the box outflow
  // (they were already stored as positive CASH_OVER entries — excluded from expected calc)
  const expected = opening - (expenses + cashAdvance);
  // Variance: positive = overage (more cash than expected), negative = shortage
  const variance = actual - expected;

  document.getElementById('modExpected').textContent = fmt(expected);
  document.getElementById('modActual').textContent = fmt(actual);

  const vEl = document.getElementById('modVariance');
  // Store raw numeric value on element for confirmClosingSave to read reliably
  vEl.dataset.value = variance.toFixed(2);
  vEl.textContent = (variance > 0 ? '+' : '') + fmt(Math.abs(variance));
  vEl.className = 'font-mono font-black text-2xl ' +
    (Math.abs(variance) < 0.01 ? 'text-green-600' : variance < 0 ? 'text-red-600' : 'text-blue-600');

  const sEl = document.getElementById('modStatus');

  // Shortage panel
  const shortagePanel  = document.getElementById('shortagePanel');
  // Overage panel
  const overagePanel   = document.getElementById('overagePanel');

  if(shortagePanel) shortagePanel.classList.add('hidden');
  if(overagePanel)  overagePanel.classList.add('hidden');

  // Reset checkboxes
  const chkShortage = document.getElementById('chkCreateShortage');
  const chkOverage  = document.getElementById('chkCreateOverage');
  const chkReplenish = document.getElementById('chkReplenish');
  if(chkShortage) chkShortage.checked = false;
  if(chkOverage)  chkOverage.checked  = false;
  if(chkReplenish) chkReplenish.checked = false;

  if (Math.abs(variance) < 0.01) {
    // ── BALANCED ──
    sEl.textContent = '✅ BALANCED';
    sEl.className = 'text-xs text-green-600 font-bold uppercase tracking-widest mt-1';
  } else if (variance < 0) {
    // ── SHORTAGE: actual cash is LESS than expected ──
    sEl.textContent = '⚠️ SHORTAGE';
    sEl.className = 'text-xs text-red-500 font-bold uppercase tracking-widest mt-1';

    const amt = Math.abs(variance);
    if(shortagePanel) {
      shortagePanel.classList.remove('hidden');
      const label = shortagePanel.querySelector('.variance-amount');
      if(label) label.textContent = fmt(amt);
    }
  } else {
    // ── OVERAGE: actual cash is MORE than expected ──
    sEl.textContent = '💰 OVERAGE';
    sEl.className = 'text-xs text-blue-500 font-bold uppercase tracking-widest mt-1';

    if(overagePanel) {
      overagePanel.classList.remove('hidden');
      const label = overagePanel.querySelector('.variance-amount');
      if(label) label.textContent = fmt(variance);
    }
  }

  modal.classList.remove('hidden');
}

function closeClosingModal() {
  const modal = document.getElementById('closingModal');
  if(modal) modal.classList.add('hidden');
  pendingClosingData = null;
}

async function confirmClosingSave() {
  if (!pendingClosingData) return;

  const vEl = document.getElementById('modVariance');
  // Read from data attribute — reliable, no regex on currency strings
  const varianceVal = parseFloat(vEl?.dataset.value || '0');

  const chkShortage  = document.getElementById('chkCreateShortage');
  const chkOverage   = document.getElementById('chkCreateOverage');
  const chkReplenish = document.getElementById('chkReplenish');

  const createShortageEntry = chkShortage?.checked && varianceVal < -0.01;
  const createOverageEntry  = chkOverage?.checked  && varianceVal >  0.01;
  const createReplenish     = chkReplenish?.checked && varianceVal < -0.01;

  const dataToSave = { ...pendingClosingData };
  closeClosingModal();

  // 1. Save the closing denomination record
  await executeSave(dataToSave);

  // 2. Handle SHORTAGE
  if (createShortageEntry) {
    // Record a "Cash Shortage" expense — the cash is gone, this is the audit trail
    const shortageAmt = Math.abs(varianceVal);
    const adjData = {
      date: dataToSave.date,
      type: 'EXPENSE',
      category: 'Miscellaneous',
      description: `Cash Shortage — actual is ${fmt(shortageAmt)} less than expected`,
      amount: shortageAmt,
      hasReceipt: false,
      referenceNo: 'SHORTAGE-ADJ',
      requestedBy: 'System',
      approvedBy: 'Auto'
    };
    toast('Recording shortage entry...', 'info');
    const res = await callServer('saveExpenseEntry', adjData);
    if(res.success) toast(`Shortage of ${fmt(shortageAmt)} recorded`, 'success');
    else toast('Failed to record shortage: ' + res.message, 'error');
  }

  // 3. Handle OVERAGE
  if (createOverageEntry) {
    // Record a CASH_OVER entry — this is a special type that adds back to the fund
    const overAmt = Math.abs(varianceVal);
    const overData = {
      date: dataToSave.date,
      type: 'CASH_OVER',
      category: 'Miscellaneous',
      description: `Cash Overage — actual is ${fmt(overAmt)} more than expected`,
      amount: overAmt,
      hasReceipt: false,
      referenceNo: 'OVER-ADJ',
      requestedBy: 'System',
      approvedBy: 'Auto'
    };
    toast('Recording overage entry...', 'info');
    const res = await callServer('saveCashOverEntry', overData);
    if(res.success) toast(`Overage of ${fmt(overAmt)} recorded`, 'success');
    else toast('Failed to record overage: ' + res.message, 'error');
  }

  // 4. Handle REPLENISHMENT request (shortage path only)
  if (createReplenish) {
    const replenishAmt = Math.abs(varianceVal);
    const repData = {
      date: dataToSave.date,
      type: 'REPLENISHMENT',
      category: 'Replenishment',
      description: `Fund replenishment request for shortage of ${fmt(replenishAmt)}`,
      amount: replenishAmt,
      hasReceipt: false,
      referenceNo: 'REPLENISH-REQ',
      requestedBy: 'System',
      approvedBy: ''
    };
    toast('Creating replenishment request...', 'info');
    const res = await callServer('saveReplenishmentEntry', repData);
    if(res.success) toast(`Replenishment request of ${fmt(replenishAmt)} created`, 'success');
    else toast('Failed to create replenishment: ' + res.message, 'error');
  }

  // Refresh everything
  loadDayData();
}

async function executeSave(data) {
  showLoading(true);
  try {
    const res = await callServer('saveDenominationRecord', data);
    if (res.success) {
      toast('Cash count saved', 'success');
      clearDenomForm();
      loadDayData();
      loadDenominations();
    } else {
      toast(res.message || 'Failed to save', 'error');
    }
  } catch(e) {
    console.error(e);
    toast('Error saving record', 'error');
  } finally {
    showLoading(false);
  }
}

async function loadDenominations() {
  const container = document.getElementById('savedDenomsContainer');
  if (!container) return;

  container.innerHTML = '<div class="text-center py-6 text-gray-400 text-sm animate-pulse">Loading records...</div>';

  try {
    const res = await callServer('getDenominationRecords', state.currentDate);
    if (res.success && res.data && res.data.length > 0) {
      container.innerHTML = res.data.map(d => {
        const isStart = d.type === 'START';
        const color = isStart
          ? 'text-blue-600 bg-blue-50 border-blue-200'
          : 'text-amber-600 bg-amber-50 border-amber-200';
        const icon  = isStart ? '☀️' : '🌙';
        const label = isStart ? 'Opening' : 'Closing';
        const ts = d.timestamp ? new Date(d.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '--:--';
        return `
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-white hover:bg-gray-50 rounded-xl border border-gray-200 transition-all shadow-sm">
            <div class="flex items-center gap-3 mb-2 sm:mb-0">
              <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg border ${color}">${icon}</div>
              <div>
                <div class="font-bold text-gray-800 text-sm">${label} Count</div>
                <div class="text-xs text-gray-400 font-mono">${ts}</div>
              </div>
            </div>
            <div class="text-right w-full sm:w-auto">
              <div class="font-black text-xl text-gray-800 tracking-tight">${fmt(d.total)}</div>
              <div class="text-xs text-gray-400 italic truncate max-w-[180px]">${d.notes || 'No notes'}</div>
            </div>
          </div>`;
      }).join('');
    } else {
      container.innerHTML = `<div class="text-center py-8 bg-gray-50 rounded-xl border border-dashed border-gray-300 text-gray-400 text-sm">No denomination records for this date</div>`;
    }
  } catch(e) {
    console.error(e);
    container.innerHTML = '<div class="text-center text-red-400 py-4 text-sm">Failed to load records</div>';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(buildDenomGrid, 100);
});

window.refreshDenomGrid = buildDenomGrid;
</script>
