<script>
// =============================================
// FILING CHECKLIST PAGE LOGIC
// =============================================

async function loadFilingPage() {
  // Set default month filter to current month
  const monthEl = document.getElementById('filingMonthFilter');
  if (monthEl && !monthEl.value) {
    monthEl.value = state.currentDate.slice(0, 7);
  }

  const month   = monthEl?.value || state.currentDate.slice(0, 7);
  const from    = month + '-01';
  const lastDay = new Date(month.slice(0,4), month.slice(5,7), 0).getDate();
  const to      = month + '-' + String(lastDay).padStart(2,'0');

  // Date label
  const todayLabel = document.getElementById('filingTodayLabel');
  if (todayLabel) {
    const d = new Date(state.currentDate + 'T00:00:00');
    todayLabel.textContent = d.toLocaleDateString('en-PH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  // Load existing filing for today to pre-fill checkboxes
  const res = await callServer('getFilingChecklists', { from: state.currentDate, to: state.currentDate });
  if (res.success && res.data.length) {
    const rec = res.data[0];
    setCheckbox('chkFiling_Receipts',   rec.filedReceipts);
    setCheckbox('chkFiling_NoReceipts', rec.filedNoReceipts);
    setCheckbox('chkFiling_Report',     rec.filedReport);
    const notesEl = document.getElementById('filingNotes');
    if (notesEl) notesEl.value = rec.notes || '';

    const banner = document.getElementById('filingStatusBanner');
    if (banner) {
      if (rec.fullyFiled) {
        banner.className = 'flex items-center gap-2 p-3 rounded-xl bg-green-50 border border-green-200 text-sm text-green-700 font-medium';
        banner.innerHTML = '✅ Fully filed — last updated by ' + (rec.submittedBy || '—');
      } else {
        banner.className = 'flex items-center gap-2 p-3 rounded-xl bg-amber-50 border border-amber-200 text-sm text-amber-700 font-medium';
        banner.innerHTML = '⚠️ Partially filed — some items still pending';
      }
      banner.classList.remove('hidden');
    }
  } else {
    const banner = document.getElementById('filingStatusBanner');
    if (banner) banner.classList.add('hidden');
  }

  // Load history
  const histRes = await callServer('getFilingChecklists', { from, to });
  renderFilingHistory(histRes.success ? histRes.data : []);
}

function setCheckbox(id, val) {
  const el = document.getElementById(id);
  if (el) el.checked = !!val;
}

function renderFilingHistory(records) {
  const tbody   = document.getElementById('filingHistoryBody');
  const badge   = document.getElementById('filing-unfiled-badge');
  if (!tbody) return;

  if (!records.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-400 text-sm italic">No filing records for this period</td></tr>';
    if (badge) badge.classList.add('hidden');
    return;
  }

  const unfiled = records.filter(r => !r.fullyFiled).length;
  if (badge) {
    if (unfiled > 0) {
      badge.textContent = unfiled + ' unfiled';
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  // Update sidebar badge
  const sidebarBadge = document.getElementById('filing-badge');
  if (sidebarBadge) {
    if (unfiled > 0) {
      sidebarBadge.textContent = unfiled;
      sidebarBadge.classList.remove('hidden');
    } else {
      sidebarBadge.classList.add('hidden');
    }
  }

  const tick  = (val) => val
    ? '<span class="text-green-600 font-bold text-base">✓</span>'
    : '<span class="text-red-400 font-bold text-base">✗</span>';

  tbody.innerHTML = records.map(r => {
    const rowBg = r.fullyFiled ? '' : 'bg-red-50';
    const status = r.fullyFiled
      ? '<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-green-100 text-green-700">✅ Filed</span>'
      : '<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700">⚠️ Incomplete</span>';
    return `
      <tr class="hover:bg-gray-50 transition ${rowBg}">
        <td class="px-4 py-3 font-mono text-sm text-gray-700 font-medium">${r.date}</td>
        <td class="px-4 py-3 text-center">${tick(r.filedReceipts)}</td>
        <td class="px-4 py-3 text-center">${tick(r.filedNoReceipts)}</td>
        <td class="px-4 py-3 text-center">${tick(r.filedReport)}</td>
        <td class="px-4 py-3">${status}${r.notes ? '<div class="text-xs text-gray-400 mt-0.5">' + r.notes + '</div>' : ''}</td>
        <td class="px-4 py-3 text-xs text-gray-500 truncate max-w-[160px]">${r.submittedBy || '—'}</td>
      </tr>`;
  }).join('');
}

async function submitFilingChecklist() {
  const data = {
    date            : state.currentDate,
    filedReceipts   : document.getElementById('chkFiling_Receipts')?.checked   || false,
    filedNoReceipts : document.getElementById('chkFiling_NoReceipts')?.checked || false,
    filedReport     : document.getElementById('chkFiling_Report')?.checked     || false,
    notes           : document.getElementById('filingNotes')?.value.trim()      || ''
  };

  const btn = document.getElementById('submitFilingBtn');
  btn.disabled = true; btn.textContent = 'Saving...';

  const res = await callServer('saveFilingChecklist', data);

  btn.disabled = false; btn.innerHTML = '✓ Submit Filing Checklist';

  if (res.success) {
    toast(res.updated ? 'Filing checklist updated ✓' : 'Filing checklist submitted ✓', 'success');
    loadFilingPage();
  } else {
    toast(res.message || 'Failed to save', 'error');
  }
}
</script>
