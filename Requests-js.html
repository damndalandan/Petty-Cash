<script>
// =============================================
// PETTY CASH REQUESTS PAGE LOGIC
// =============================================

let allRequests     = [];
let currentPcrFilter = 'active';
let _pcrSettleCtx   = {};   // { requestId, amount, date, purpose }
let pcrExpanded     = new Set();

function togglePcrExpand(id) {
  if (pcrExpanded.has(id)) pcrExpanded.delete(id);
  else pcrExpanded.add(id);
  renderRequests();
}

// ── Load ─────────────────────────────────────

async function loadRequests() {
  const listEl = document.getElementById('pcr-list');
  if (!listEl) return;
  listEl.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm animate-pulse">Loading requests...</div>';

  const res = await callServer('getPettyCashRequests');
  if (!res.success) {
    listEl.innerHTML = '<div class="text-center py-10 text-red-400 text-sm">Failed to load requests.</div>';
    return;
  }
  allRequests = res.data || [];
  updatePcrCards();
  renderRequests();
}

function updatePcrCards() {
  const today    = state.currentDate;
  const pending  = allRequests.filter(r => r.status === 'PENDING_APPROVAL').length;
  const approved = allRequests.filter(r => r.status === 'APPROVED').length;
  const released = allRequests.filter(r => r.status === 'RELEASED').length;
  const settled  = allRequests.filter(r => r.status === 'SETTLED' && (r.settledAt || '').slice(0, 10) === today).length;
  const rejected = allRequests.filter(r => ['REJECTED', 'VOIDED'].includes(r.status)).length;

  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('pcr-count-pending',  pending);
  set('pcr-count-approved', approved);
  set('pcr-count-released', released);
  set('pcr-count-settled',  settled);
  set('pcr-count-rejected', rejected);

  // Sidebar badge: pending + released need action
  const sb = document.getElementById('requests-badge');
  const actionable = pending + released;
  if (sb) { sb.textContent = actionable; actionable > 0 ? sb.classList.remove('hidden') : sb.classList.add('hidden'); }

  highlightPcrCard(currentPcrFilter);
}

// ── Filter Cards ──────────────────────────────

function switchPcrFilter(filter) {
  currentPcrFilter = filter;
  highlightPcrCard(filter);
  renderRequests();
}

function highlightPcrCard(filter) {
  const cardStyles = {
    pending : { active: 'border-amber-400 bg-amber-50',  inactive: 'border-transparent bg-white' },
    approved: { active: 'border-green-400 bg-green-50',  inactive: 'border-transparent bg-white' },
    released: { active: 'border-blue-400 bg-blue-50',    inactive: 'border-transparent bg-white' },
    settled : { active: 'border-slate-400 bg-slate-50',  inactive: 'border-transparent bg-white' },
    rejected: { active: 'border-red-400 bg-red-50',      inactive: 'border-transparent bg-white' },
  };
  ['pending','approved','released','settled','rejected'].forEach(f => {
    const card = document.getElementById('pcr-card-' + f);
    if (!card) return;
    const s = cardStyles[f];
    const base = 'pcr-metric-card text-left p-4 rounded-2xl border-2 shadow-sm hover:shadow-md transition-all ';
    card.className = base + (filter === f ? s.active : s.inactive);
  });

  const labels = {
    active  : 'Showing: All Active',
    pending : 'Showing: Pending Approval',
    approved: 'Showing: Approved — Ready to Release',
    released: 'Showing: Released — Pending Settlement',
    settled : 'Showing: Settled Today',
    rejected: 'Showing: Rejected / Voided',
  };
  const labelEl = document.getElementById('pcr-filter-label');
  if (labelEl) labelEl.textContent = labels[filter] || 'Showing: All Active';

  const showAllBtn = document.getElementById('pcr-show-all-btn');
  if (showAllBtn) showAllBtn.classList.toggle('hidden', filter === 'active');
}

function togglePcrForm() {
  const section  = document.getElementById('pcr-form-section');
  const backdrop = document.getElementById('pcrFormBackdrop');
  if (!section) return;
  const isHidden = section.classList.contains('hidden');
  section.classList.toggle('hidden');
  if (backdrop) backdrop.classList.toggle('hidden', !isHidden);
  const btn = document.getElementById('pcrFormToggleBtn');
  if (btn) btn.innerHTML = isHidden ? '✕ Close' : '➕ New Request';
}

// ── Render ────────────────────────────────────

function renderRequests() {
  const listEl = document.getElementById('pcr-list');
  if (!listEl) return;

  const today = state.currentDate;
  const filterMap = {
    active  : r => ['PENDING_APPROVAL','APPROVED','RELEASED'].includes(r.status),
    pending : r => r.status === 'PENDING_APPROVAL',
    approved: r => r.status === 'APPROVED',
    released: r => r.status === 'RELEASED',
    settled : r => r.status === 'SETTLED'  && (r.settledAt || '').slice(0, 10) === today,
    rejected: r => ['REJECTED', 'VOIDED'].includes(r.status),
  };
  const filtered = allRequests.filter(filterMap[currentPcrFilter] || filterMap.active);

  const emptyMsgs = {
    active  : 'No active requests. All caught up!',
    pending : 'No requests pending approval.',
    approved: 'No approved requests awaiting release.',
    released: 'No released requests awaiting settlement.',
    settled : 'No requests settled today.',
    rejected: 'No rejected or voided requests.',
  };

  if (!filtered.length) {
    listEl.innerHTML = `<div class="text-center py-12 bg-white rounded-2xl border border-dashed border-gray-300 text-gray-400 text-sm">${emptyMsgs[currentPcrFilter] || emptyMsgs.active}</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(r => renderRequestCard(r)).join('');
}

function renderRequestCard(r) {
  const statusStyles = {
    PENDING_APPROVAL: 'bg-amber-100 text-amber-700',
    APPROVED        : 'bg-green-100 text-green-700',
    RELEASED        : 'bg-blue-100 text-blue-700',
    SETTLED         : 'bg-slate-100 text-slate-600',
    REJECTED        : 'bg-red-100 text-red-600',
    VOIDED          : 'bg-gray-200 text-gray-600'
  };
  const statusLabels = {
    PENDING_APPROVAL: 'Pending Approval',
    APPROVED        : 'Approved',
    RELEASED        : 'Released',
    SETTLED         : 'Settled',
    REJECTED        : 'Rejected',
    VOIDED          : 'Voided'
  };

  const typeBadge = r.requestType === 'Cash Advance'
    ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-700">ADVANCE</span>`
    : `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-700">EXPENSE</span>`;

  // Cash Advance PCRs whose linked advance is awaiting auditor sign-off get a
  // distinct badge so cashier/auditor can tell at a glance that liquidation was
  // already submitted and is just waiting on day-close approval.
  const isAdvanceAwaiting = r.status === 'RELEASED'
    && r.requestType === 'Cash Advance'
    && r.advanceStatus === 'LIQUIDATION_PENDING';
  const badgeStyle = isAdvanceAwaiting ? 'bg-amber-100 text-amber-700' : (statusStyles[r.status] || 'bg-gray-100 text-gray-500');
  const badgeLabel = isAdvanceAwaiting ? 'Awaiting Audit' : (statusLabels[r.status] || r.status);
  const badge = `<span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${badgeStyle}">${badgeLabel}</span>`;

  let actions = '';

  // Admin-only approval actions (Auditors are read-only on PCR)
  if (r.status === 'PENDING_APPROVAL' && isAdmin()) {
    actions = `
      <button onclick="approveRequest(this,'${r.id}')"
        class="flex-1 py-2.5 bg-green-600 hover:bg-green-700 text-white text-sm font-bold rounded-xl shadow transition min-h-[44px]">
        Approve
      </button>
      <button onclick="openPcrRejectModal('${r.id}','${escHtml(r.purpose)}','${fmt(r.amount)}')"
        class="flex-1 py-2.5 bg-red-500 hover:bg-red-600 text-white text-sm font-bold rounded-xl shadow transition min-h-[44px]">
        Reject
      </button>`;
  }

  // Cashier: release approved requests
  if (r.status === 'APPROVED' && isCashier()) {
    actions = `
      <button onclick="releaseRequest(this,'${r.id}')"
        class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl shadow transition min-h-[44px]">
        💵 Release Cash
      </button>`;
  }

  // Admin: void an approved request before it is released (no cash disbursed yet).
  // Appended so an Admin (who is also a cashier) keeps the Release button too.
  if (r.status === 'APPROVED' && isAdmin()) {
    actions += `
      <button onclick="openPcrVoidModal('${r.id}','${escHtml(r.purpose)}','${fmt(r.amount)}')"
        class="flex-1 py-2.5 bg-gray-600 hover:bg-gray-700 text-white text-sm font-bold rounded-xl shadow transition min-h-[44px]">
        Void
      </button>`;
  }

  // Cashier: released state differs by type
  if (r.status === 'RELEASED' && isCashier()) {
    if (r.requestType === 'Cash Advance') {
      if (r.advanceStatus === 'LIQUIDATION_PENDING') {
        actions = `<span class="text-xs text-amber-600 font-medium flex items-center gap-1">
          🕒 Liquidation submitted — awaiting audit approval to mark settled.</span>`;
      } else {
        actions = `<span class="text-xs text-blue-600 font-medium flex items-center gap-1">
          💳 Liquidate this advance from the <button onclick="navigate('advances')" class="underline font-bold">Cash Advances</button> or <button onclick="navigate('entries')" class="underline font-bold">Entries</button> page</span>`;
      }
    } else {
      actions = `
        <button onclick="openPcrSettleModal('${r.id}','${escHtml(r.purpose)}',${r.amount},'${r.date}','${escHtml(r.requestedByName || '')}')"
          class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl shadow transition min-h-[44px]">
          ✅ Settle
        </button>`;
    }
  }

  const approvalLine = r.approvedBy
    ? `<span class="text-gray-400">• ${r.status === 'REJECTED' ? 'Rejected' : 'Approved'} by ${r.approvedBy.split('@')[0]}</span>` : '';
  const rejectionLine = r.rejectionNote
    ? `<div class="mt-2 text-xs text-red-600 bg-red-50 rounded-lg px-3 py-2">Reason: ${escHtml(r.rejectionNote)}</div>` : '';

  let breakdownHtml = '';
  let toggleBtn     = '';
  let summaryLine   = '';
  const isSettled   = r.status === 'SETTLED' && r.settlementItems && r.settlementItems.length;
  if (isSettled) {
    const itemCount  = r.settlementItems.length;
    const totalSpent = r.settlementItems.reduce((s, item) => s + item.amount, 0);
    const change     = parseFloat((r.amount - totalSpent).toFixed(2));
    const isExpanded = pcrExpanded.has(r.id);

    toggleBtn = `<button onclick="togglePcrExpand('${r.id}')"
        class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700 hover:bg-indigo-200 transition">
        ${isExpanded ? '▼ Hide items (' + itemCount + ')' : '▶ View items (' + itemCount + ')'}
      </button>`;

    summaryLine = `<div class="text-[10px] text-gray-400 mt-1">Released: <span class="font-mono">${fmt(r.amount)}</span>${change > 0.005 ? ' &middot; Returned: <span class="font-mono">' + fmt(change) + '</span>' : ''}</div>`;

    if (isExpanded) {
      const itemRows = r.settlementItems.map(item => `
        <div class="flex items-start justify-between gap-2 pl-3 py-1.5 border-l-4 border-indigo-200 bg-indigo-50/60">
          <div class="flex items-start gap-1.5 min-w-0">
            <span class="text-gray-300 text-xs shrink-0">└</span>
            <div class="min-w-0">
              <div class="text-xs font-medium text-gray-700 leading-tight">${escHtml(item.description)}${item.hasReceipt ? ' <span class="text-[10px] text-green-600" title="Has official receipt">🧾</span>' : ''}</div>
              <div class="text-[10px] text-gray-400 leading-tight">${escHtml(item.category)}</div>
            </div>
          </div>
          <span class="text-xs font-mono font-semibold text-gray-700 shrink-0">${fmt(item.amount)}</span>
        </div>`).join('');
      const cashReturnedRow = change > 0.005
        ? `<div class="flex justify-between items-center pl-3 py-1.5 border-l-4 border-teal-200 bg-teal-50/60">
             <span class="text-xs font-bold text-teal-700">↩ Cash Returned</span>
             <span class="text-xs font-mono font-bold text-teal-700">${fmt(change)}</span>
           </div>`
        : '';
      breakdownHtml = `
        <div class="pt-2 border-t border-dashed border-gray-200 space-y-1">
          ${itemRows}
          ${cashReturnedRow}
          <div class="flex justify-between text-[11px] font-bold text-gray-700 pt-1.5 mt-0.5 border-t border-gray-200">
            <span>Total Spent</span><span class="font-mono">${fmt(totalSpent)}</span>
          </div>
        </div>`;
    }
  }

  return `
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 space-y-3">
      <!-- Top row: badges + amount -->
      <div class="flex items-start justify-between gap-3">
        <div class="flex flex-wrap items-center gap-1.5">
          ${typeBadge}
          ${badge}
          ${toggleBtn}
        </div>
        <div class="text-right shrink-0">
          <p class="text-xl font-bold font-mono text-gray-800">${fmt(r.amount)}</p>
          <p class="text-xs text-gray-500">for <span class="font-semibold text-gray-700">${escHtml(r.requestedByName || '')}</span></p>
        </div>
      </div>
      <!-- Purpose: full text, wraps naturally -->
      <div>
        <p class="font-semibold text-gray-800 text-sm leading-snug">${escHtml(r.purpose)}</p>
        <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-1.5 text-[11px] text-gray-400">
          <span class="font-mono">${r.id}</span>
          <span>•</span>
          <span>${r.date}</span>
          ${approvalLine}
          <span>•</span>
          <span>by ${r.submittedBy || ''}</span>
        </div>
        ${summaryLine}
      </div>
      ${rejectionLine}
      ${breakdownHtml}
      ${actions ? `<div class="flex gap-2 pt-2 border-t border-gray-100">${actions}</div>` : ''}
    </div>`;
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── New Request Form ──────────────────────────

async function submitPettyCashRequest() {
  const purpose     = document.getElementById('pcrPurpose')?.value.trim();
  const amount      = parseFloat(document.getElementById('pcrAmount')?.value);
  const requestedBy = document.getElementById('pcrRequestedBy')?.value.trim();
  const requestType = document.querySelector('input[name="pcrType"]:checked')?.value || 'Expense';
  const date        = state.currentDate;

  if (!purpose)               { toast('Purpose is required.', 'warning'); return; }
  if (!amount || amount <= 0) { toast('Amount must be greater than zero.', 'warning'); return; }
  if (!requestedBy)           { toast('Please enter who is requesting.', 'warning'); return; }

  const btn = document.querySelector('#pcr-form-section button[onclick="submitPettyCashRequest()"]');
  btnLoad(btn, true);
  const res = await callServer('savePettyCashRequest', { date, purpose, amount, requestedBy, requestType });
  btnLoad(btn, false);

  if (!res.success) { toast(res.message || 'Failed to submit request.', 'error'); return; }

  toast('Request submitted for approval.');
  document.getElementById('pcrPurpose').value      = '';
  document.getElementById('pcrAmount').value       = '';
  document.getElementById('pcrRequestedBy').value  = '';
  switchPcrFilter('pending');
  loadRequests();
}

// ── Approve / Reject ──────────────────────────

async function approveRequest(btn, requestId) {
  btnLoad(btn, true);
  const res = await callServer('approvePettyCashRequest', requestId);
  btnLoad(btn, false);
  if (!res.success) { toast(res.message || 'Failed to approve.', 'error'); return; }
  toast('Request approved.');
  loadRequests();
}

function openPcrRejectModal(requestId, purpose, amountStr) {
  document.getElementById('pcrRejectId').value   = requestId;
  document.getElementById('pcrRejectInfo').textContent = `${purpose} — ${amountStr}`;
  document.getElementById('pcrRejectNote').value  = '';
  document.getElementById('pcrRejectModal').classList.remove('hidden');
}

function closePcrRejectModal() {
  document.getElementById('pcrRejectModal').classList.add('hidden');
}

async function confirmPcrReject() {
  const requestId = document.getElementById('pcrRejectId').value;
  const note      = document.getElementById('pcrRejectNote').value.trim();
  if (!note) { toast('Please enter a reason for rejection.', 'warning'); return; }

  const btn = document.querySelector('#pcrRejectModal button[onclick="confirmPcrReject()"]');
  btnLoad(btn, true);
  const res = await callServer('rejectPettyCashRequest', { requestId, note });
  btnLoad(btn, false);
  if (!res.success) { toast(res.message || 'Failed to reject.', 'error'); return; }
  toast('Request rejected.');
  closePcrRejectModal();
  loadRequests();
}

// ── Void (admin, approved-but-not-released) ───

function openPcrVoidModal(requestId, purpose, amountStr) {
  document.getElementById('pcrVoidId').value = requestId;
  document.getElementById('pcrVoidInfo').textContent = `${purpose} — ${amountStr}`;
  document.getElementById('pcrVoidNote').value = '';
  document.getElementById('pcrVoidModal').classList.remove('hidden');
}

function closePcrVoidModal() {
  document.getElementById('pcrVoidModal').classList.add('hidden');
}

async function confirmPcrVoid() {
  const requestId = document.getElementById('pcrVoidId').value;
  const note      = document.getElementById('pcrVoidNote').value.trim();
  if (!note) { toast('Please enter a reason for voiding.', 'warning'); return; }

  const btn = document.querySelector('#pcrVoidModal button[onclick="confirmPcrVoid()"]');
  btnLoad(btn, true);
  const res = await callServer('voidPettyCashRequest', { requestId, note });
  btnLoad(btn, false);
  if (!res.success) { toast(res.message || 'Failed to void.', 'error'); return; }
  toast('Request voided.');
  closePcrVoidModal();
  loadRequests();
}

// ── Release ───────────────────────────────────

function releaseRequest(btn, requestId) {
  const r = allRequests.find(r => r.id === requestId);
  if (!r) return;
  document.getElementById('pcrReleaseId').value = requestId;
  document.getElementById('pcrReleaseInfo').innerHTML =
    '<strong>' + escHtml(r.purpose) + '</strong>'
    + '<br><span class="text-gray-500">' + fmt(r.amount) + ' for ' + escHtml(r.requestedByName || r.requestedBy || '—') + '</span>';
  document.getElementById('pcrReleaseModal').classList.remove('hidden');
}

function closePcrReleaseModal() {
  document.getElementById('pcrReleaseModal').classList.add('hidden');
}

async function confirmPcrRelease() {
  const requestId = document.getElementById('pcrReleaseId').value;
  const btn = document.querySelector('#pcrReleaseModal button[onclick="confirmPcrRelease()"]');
  btnLoad(btn, true);
  const res = await callServer('releasePettyCashRequest', requestId);
  btnLoad(btn, false);
  if (!res.success) { toast(res.message || 'Failed to release.', 'error'); return; }
  toast('Cash released and recorded.');
  closePcrReleaseModal();
  switchPcrFilter('released');
  loadRequests();
}

// ── Settlement Modal ──────────────────────────

function openPcrSettleModal(requestId, purpose, amount, date, requestedByName) {
  _pcrSettleCtx = { requestId, amount: parseFloat(amount) || 0, date, purpose };
  document.getElementById('pcrSettleRequestId').value = requestId;
  document.getElementById('pcrSettleSubtitle').textContent = purpose;
  document.getElementById('pcrSettleInfo').innerHTML =
    `<span class="font-mono font-bold">${fmt(amount)}</span> for <strong>${escHtml(requestedByName || '—')}</strong>`
    + ` — <em>${escHtml(purpose)}</em> on ${date}`;
  document.getElementById('pcrSettleRequestAmt').textContent = fmt(amount);
  document.getElementById('pcrSettleNote').value = '';
  document.getElementById('pcrItemsList').innerHTML = '';
  addPcrItem();         // start with one empty row
  updatePcrSummary();
  document.getElementById('pcrSettleModal').classList.remove('hidden');
}

function closePcrSettleModal() {
  document.getElementById('pcrSettleModal').classList.add('hidden');
  _pcrSettleCtx = {};
}

function addPcrItem() {
  const list = document.getElementById('pcrItemsList');
  const idx  = list.children.length;
  const cats = (window.appCategories || ['Office Supplies','Transportation','Meals & Entertainment','Miscellaneous'])
    .map(c => { const n = c.name || c; return `<option value="${n}">${n}</option>`; }).join('');

  const div = document.createElement('div');
  div.className = 'pcr-item border border-gray-200 rounded-xl p-3 space-y-2 bg-gray-50';
  div.innerHTML = `
    <div class="flex justify-between items-center">
      <span class="text-xs font-bold text-gray-500 uppercase">Item ${idx + 1}</span>
      <button onclick="removePcrItem(this)" class="text-gray-400 hover:text-red-500 text-lg font-light leading-none">&times;</button>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div class="col-span-2">
        <input type="text" placeholder="Description" class="pcr-desc w-full p-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
      </div>
      <div>
        <select class="pcr-cat w-full p-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">${cats}</select>
      </div>
      <div>
        <input type="number" placeholder="Amount" min="0" step="0.01" class="pcr-amt w-full p-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white" oninput="updatePcrSummary()">
      </div>
    </div>
    <div class="pt-1 border-t border-dashed border-gray-200">
      <button type="button" class="pcr-receipt-btn w-full flex items-center justify-center gap-2 px-3 py-2 border-2 border-dashed border-gray-300 rounded-lg text-xs font-medium text-gray-500 hover:border-green-400 hover:text-green-600 hover:bg-green-50 transition"
        onclick="openPcrItemReceipt(this)">
        🧾 Add Official Receipt <span class="text-[10px] text-gray-400 ml-1">(optional)</span>
      </button>
      <div class="pcr-receipt-preview hidden mt-1.5 flex items-center justify-between bg-green-50 border border-green-200 rounded-lg px-3 py-2">
        <span class="text-xs text-green-700 font-medium pcr-receipt-label"></span>
        <button type="button" onclick="clearPcrItemReceipt(this)" class="text-xs text-red-400 hover:text-red-600 font-medium ml-2 shrink-0">Remove</button>
      </div>
    </div>`;
  list.appendChild(div);
}

function openPcrItemReceipt(btn) {
  const item = btn.closest('.pcr-item');
  const amt  = parseFloat(item.querySelector('.pcr-amt')?.value) || 0;
  openReceiptModal({
    mode       : 'new',
    grossAmount: amt,
    onAttach   : (receiptData) => {
      item._receipt = receiptData;
      btn.classList.add('hidden');
      const preview = item.querySelector('.pcr-receipt-preview');
      const label   = item.querySelector('.pcr-receipt-label');
      label.textContent = `✓ ${receiptData.supplierName}${receiptData.receiptNo ? ' — OR# ' + receiptData.receiptNo : ''} (${fmt(receiptData.grossAmount)})`;
      preview.classList.remove('hidden');
    }
  });
}

function clearPcrItemReceipt(clearBtn) {
  const item    = clearBtn.closest('.pcr-item');
  item._receipt = null;
  item.querySelector('.pcr-receipt-preview').classList.add('hidden');
  item.querySelector('.pcr-receipt-btn').classList.remove('hidden');
}

function removePcrItem(btn) {
  const item = btn.closest('.pcr-item');
  if (document.querySelectorAll('.pcr-item').length <= 1) {
    toast('At least one expense item is required.', 'warning');
    return;
  }
  item.remove();
  document.querySelectorAll('.pcr-item').forEach((el, i) => {
    const label = el.querySelector('.text-xs.font-bold.text-gray-500');
    if (label) label.textContent = `Item ${i + 1}`;
  });
  updatePcrSummary();
}

function updatePcrSummary() {
  const amts  = [...document.querySelectorAll('.pcr-amt')].map(el => parseFloat(el.value) || 0);
  const spent = amts.reduce((s, a) => s + a, 0);
  const req   = _pcrSettleCtx.amount || 0;
  const change = parseFloat((req - spent).toFixed(2));

  document.getElementById('pcrSettleSpentAmt').textContent  = fmt(spent);
  document.getElementById('pcrSettleChangeAmt').textContent = fmt(Math.abs(change));
  document.getElementById('pcrSettleChangeLabel').textContent = change >= 0 ? 'Change to Return' : 'Amount Owed';
  document.getElementById('pcrSettleChangeAmt').className =
    'font-mono ' + (change < 0 ? 'text-red-600 font-bold' : change > 0 ? 'text-green-600 font-bold' : '');
}

async function confirmPcrSettle() {
  const requestId = document.getElementById('pcrSettleRequestId').value;
  const note      = document.getElementById('pcrSettleNote').value.trim();

  const items = [...document.querySelectorAll('.pcr-item')];
  const entries = [];
  let valid = true;

  for (const item of items) {
    const desc    = item.querySelector('.pcr-desc')?.value.trim();
    const cat     = item.querySelector('.pcr-cat')?.value;
    const amt     = parseFloat(item.querySelector('.pcr-amt')?.value) || 0;
    const receipt = item._receipt || null;

    if (!desc) { toast('All items must have a description.', 'warning'); valid = false; break; }
    if (amt <= 0) { toast('All items must have an amount greater than zero.', 'warning'); valid = false; break; }

    entries.push({ category: cat, description: desc, amount: amt, hasReceipt: !!receipt, receipt });
  }

  if (!valid) return;
  if (!entries.length) { toast('Add at least one expense item.', 'warning'); return; }

  const btn = document.querySelector('#pcrSettleModal button[onclick="confirmPcrSettle()"]');
  btnLoad(btn, true);
  const res = await callServer('settlePettyCashRequest', { requestId, entries, note });
  btnLoad(btn, false);

  if (!res.success) { toast(res.message || 'Failed to settle request.', 'error'); return; }

  if (res.warning) {
    toast(res.warning, 'warning');
  } else {
    toast('Request settled successfully.');
  }
  closePcrSettleModal();
  switchPcrFilter('settled');
  loadRequests();
}
</script>
