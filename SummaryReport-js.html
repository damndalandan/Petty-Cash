<script>
// =============================================
// SUMMARY REPORT LOGIC
// =============================================

let srData        = null;

// Receipt modal state
let srModalEntries   = [];  // full list (filtered from srData)
let srModalFiltered  = [];  // after search filter
let srModalPage      = 1;
const SR_PAGE_SIZE   = 10;

const SR_COLORS = [
  '#3b82f6','#10b981','#f59e0b','#ef4444',
  '#8b5cf6','#06b6d4','#f97316','#84cc16',
  '#ec4899','#6b7280'
];

// ─── Date helpers ───
function srToday() {
  return new Date().toISOString().split('T')[0];
}
function srStartOfWeek() {
  const d = new Date();
  d.setDate(d.getDate() - d.getDay());
  return d.toISOString().split('T')[0];
}
function srStartOfMonth() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().split('T')[0];
}
function srStartOfYear() {
  return new Date(new Date().getFullYear(), 0, 1).toISOString().split('T')[0];
}

// ─── Period dropdown ───
function srOnPeriodChange() {
  const val = document.getElementById('srPeriodSelect').value;
  const customRange = document.getElementById('srCustomRange');

  if (val === 'custom') {
    customRange.classList.remove('hidden');
    customRange.classList.add('flex');
    // Don't auto-generate — wait for user to pick dates + click Generate
    return;
  }

  customRange.classList.add('hidden');
  customRange.classList.remove('flex');
  srApplyPreset(val);
  loadSummaryReport();
}

function srApplyPreset(preset) {
  const today = srToday();
  let from, to = today;
  if (preset === 'today')  { from = today; }
  if (preset === 'week')   { from = srStartOfWeek(); }
  if (preset === 'month')  { from = srStartOfMonth(); }
  if (preset === 'year')   { from = srStartOfYear(); }
  document.getElementById('srFrom').value = from;
  document.getElementById('srTo').value   = to;
}

// Keep these for backward compat (no longer used for buttons)
function srSetPreset(preset) { srApplyPreset(preset); loadSummaryReport(); }
function srClearPreset() {}

// ─── Init ───
function initSummaryReport() {
  // Default to This Month — dropdown already has month selected
  srApplyPreset('month');
  loadSummaryReport();
}

// ─── Load ───
async function loadSummaryReport() {
  const from = document.getElementById('srFrom').value;
  const to   = document.getElementById('srTo').value;

  if (!from || !to) {
    toast('Please select a date range', 'warning');
    return;
  }
  if (from > to) {
    toast('"From" date must be before "To" date', 'warning');
    return;
  }

  // Show skeleton, hide real content
  document.getElementById('srSkeleton').classList.remove('hidden');
  document.getElementById('srContent').classList.add('hidden');

  const res = await callServer('getSummaryReportDataByRange', { from, to });

  // Hide skeleton, show real content
  document.getElementById('srSkeleton').classList.add('hidden');

  if (!res.success) {
    toast('Failed to load report: ' + (res.message || ''), 'error');
    return;
  }

  srData = res.data;
  document.getElementById('srContent').classList.remove('hidden');
  renderSummaryReport(srData);
}

// ─── Render ───
function renderSummaryReport(d) {
  document.getElementById('sr-fundCeiling').textContent    = fmt(d.fundCeiling);
  document.getElementById('sr-totalExpenses').textContent  = fmt(d.totalExpenses);
  document.getElementById('sr-cashOnHand').textContent     = fmt(d.cashOnHand);
  document.getElementById('sr-toReplenish').textContent    = fmt(d.toReplenish);
  document.getElementById('sr-replenishNote').textContent  =
    `Cash ₱${fmtShort(d.cashOnHand)} + Advances ₱${fmtShort(d.advancesOutstanding)}`;

  const total = d.totalExpenses || 1;
  const wrPct = Math.round((d.totalWithReceipt    / total) * 100);
  const nrPct = Math.round((d.totalWithoutReceipt / total) * 100);
  document.getElementById('sr-withReceipt').textContent       = fmt(d.totalWithReceipt);
  document.getElementById('sr-withoutReceipt').textContent    = fmt(d.totalWithoutReceipt);
  document.getElementById('sr-withReceiptPct').textContent    = wrPct + '%';
  document.getElementById('sr-withoutReceiptPct').textContent = nrPct + '%';

  document.getElementById('sr-advIssued').textContent          = fmt(d.advancesIssued);
  document.getElementById('sr-advLiquidated').textContent      = fmt(d.advancesLiquidated);
  document.getElementById('sr-advOutstanding').textContent     = fmt(d.advancesOutstanding);
  document.getElementById('sr-totalCashReturn').textContent    = fmt(d.totalCashReturn || 0);
  document.getElementById('sr-totalReplenishment').textContent = fmt(d.totalReplenishment);

  const advAlert = document.getElementById('sr-advAlert');
  if (d.advancesOutstanding > 0) {
    advAlert.textContent = `⚠️ ₱${fmt(d.advancesOutstanding)} in cash advances still unliquidated — included in accounted cash.`;
    advAlert.classList.remove('hidden');
  } else {
    advAlert.classList.add('hidden');
  }

  renderBarChart(d.categories);
  document.getElementById('srContent').classList.remove('hidden');
}

// ─── Bar chart ───
function renderBarChart(categories) {
  const container = document.getElementById('srBarChart');
  if (!categories || categories.length === 0) {
    container.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-10">No expense data</p>';
    return;
  }
  const max = categories[0].amount;
  container.innerHTML = categories.map((c, i) => {
    const barPct = max > 0 ? Math.round((c.amount / max) * 100) : 0;
    const color  = SR_COLORS[i % SR_COLORS.length];
    return `
      <div onclick="openSrDetailModal({ type: 'category', value: '${c.name}' })"
        class="space-y-1 cursor-pointer group hover:bg-slate-50 p-1.5 rounded-lg transition-all duration-200">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-slate-700 truncate max-w-[200px] group-hover:text-blue-600 transition-colors">${c.name}</span>
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-xs font-mono font-bold text-slate-800">${fmt(c.amount)}</span>
            <span class="text-[10px] text-slate-400 w-8 text-right">${c.percent}%</span>
          </div>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden shadow-inner">
          <div class="h-2 rounded-full transition-all duration-1000 ease-out shadow-sm" style="width:${barPct}%; background:${color}"></div>
        </div>
      </div>`;
  }).join('');
}

// ─── PDF Export ───
function printSummaryReport() {
  if (!srData) { toast('Generate a report first', 'warning'); return; }
  window.print();
}

// ─── Short format helper ───
function fmtShort(val) {
  const n = parseFloat(val) || 0;
  if (n >= 1000) return '₱' + (n / 1000).toFixed(1) + 'k';
  return '₱' + n.toFixed(0);
}

// =============================================
// UNIVERSAL DETAIL MODAL
// =============================================

let srDetailContext = null; // { type: 'receipt', value: 'with'|'without' } OR { type: 'category', value: 'CategoryName' }

function openSrDetailModal(context) {
  if (!srData) return;
  srDetailContext = context;

  // Prepare entries
  let entries = [];
  if (context.type === 'receipt') {
    entries = context.value === 'with' ? (srData.withReceiptEntries || []) : (srData.withoutReceiptEntries || []);
  } else {
    // Category context — combine all list entries and filter by category name
    const all = [...(srData.withReceiptEntries || []), ...(srData.withoutReceiptEntries || [])];
    entries = all.filter(e => String(e.category).trim() === context.value.trim());
    // Sort by date latest first
    entries.sort((a, b) => b.date > a.date ? 1 : -1);
  }

  srModalEntries  = entries;
  srModalFiltered = [...entries];
  srModalPage     = 1;

  // Style header and update titles
  const header = document.getElementById('srDetailModalHeader');
  const icon   = document.getElementById('srDetailModalIcon');
  const title  = document.getElementById('srDetailModalTitle');
  const sub    = document.getElementById('srDetailModalSub');

  if (context.type === 'receipt') {
    const isWith = context.value === 'with';
    header.className = isWith
      ? 'bg-gradient-to-r from-emerald-700 to-green-600 p-5 flex justify-between items-center shrink-0 shadow-lg'
      : 'bg-gradient-to-r from-rose-700 to-red-600 p-5 flex justify-between items-center shrink-0 shadow-lg';
    icon.textContent = isWith ? '🟢' : '🔴';
    title.textContent = isWith ? 'With Receipt — Entries' : 'Without Receipt — Entries';
  } else {
    header.className = 'bg-gradient-to-r from-slate-800 to-slate-700 p-5 flex justify-between items-center shrink-0 shadow-lg';
    icon.textContent = '📊';
    title.textContent = `Category: ${context.value}`;
  }

  const from = document.getElementById('srFrom').value;
  const to   = document.getElementById('srTo').value;
  sub.textContent = `${from} → ${to}`;

  // Build table head based on context
  const thead = document.getElementById('srDetailTableHead');
  if (context.type === 'receipt' && context.value === 'with') {
    thead.innerHTML = `
      <th class="px-4 py-3 text-left">Date</th>
      <th class="px-4 py-3 text-left">Supplier</th>
      <th class="px-4 py-3 text-left">OR No.</th>
      <th class="px-4 py-3 text-left">Category</th>
      <th class="px-4 py-3 text-left">Description</th>
      <th class="px-4 py-3 text-right">Amount</th>`;
  } else if (context.type === 'receipt' && context.value === 'without') {
    thead.innerHTML = `
      <th class="px-4 py-3 text-left">Date</th>
      <th class="px-4 py-3 text-left">Category</th>
      <th class="px-4 py-3 text-left">Description</th>
      <th class="px-4 py-3 text-left">Requested By</th>
      <th class="px-4 py-3 text-right">Amount</th>`;
  } else {
    // Category view
    thead.innerHTML = `
      <th class="px-4 py-3 text-left">Date</th>
      <th class="px-4 py-3 text-left">Description</th>
      <th class="px-4 py-3 text-left text-center">Receipt?</th>
      <th class="px-4 py-3 text-left">Ref/OR</th>
      <th class="px-4 py-3 text-left">Requested By</th>
      <th class="px-4 py-3 text-right">Amount</th>`;
  }

  document.getElementById('srDetailSearch').value = '';
  srDetailRender();
  document.getElementById('srDetailModal').classList.remove('hidden');
}

function closeSrDetailModal() {
  document.getElementById('srDetailModal').classList.add('hidden');
  srModalEntries  = [];
  srModalFiltered = [];
  srDetailContext = null;
}

function srDetailFilterAndRender() {
  const q = document.getElementById('srDetailSearch').value.toLowerCase();
  srModalFiltered = srModalEntries.filter(e =>
    (e.description  || '').toLowerCase().includes(q) ||
    (e.category     || '').toLowerCase().includes(q) ||
    (e.supplierName || '').toLowerCase().includes(q) ||
    (e.receiptNo    || '').toLowerCase().includes(q) ||
    (e.requestedBy  || '').toLowerCase().includes(q)
  );
  srModalPage = 1;
  srDetailRender();
}

function srDetailRender() {
  const total    = srModalFiltered.length;
  const pages    = Math.max(1, Math.ceil(total / SR_PAGE_SIZE));
  srModalPage    = Math.min(srModalPage, pages);
  const start    = (srModalPage - 1) * SR_PAGE_SIZE;
  const pageRows = srModalFiltered.slice(start, start + SR_PAGE_SIZE);

  document.getElementById('srDetailCount').textContent     = `${total} entr${total === 1 ? 'y' : 'ies'}`;
  document.getElementById('srDetailPageLabel').textContent = `Page ${srModalPage} of ${pages}`;
  document.getElementById('srDetailPrev').disabled         = srModalPage <= 1;
  document.getElementById('srDetailNext').disabled         = srModalPage >= pages;

  const tbody = document.getElementById('srDetailBody');
  if (pageRows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-10 text-center text-slate-400 italic text-sm bg-slate-50/50">No entries found matching your search</td></tr>`;
    return;
  }

  tbody.innerHTML = pageRows.map(e => {
    const dateLabel = new Date(e.date + 'T00:00:00').toLocaleDateString('en-PH', { month:'short', day:'numeric', year:'numeric' });
    const amountHtml = `<span class="font-mono font-bold ${srDetailContext?.type === 'receipt' ? (srDetailContext.value === 'with' ? 'text-emerald-700' : 'text-rose-700') : 'text-slate-800'}">${fmt(e.amount)}</span>`;

    if (srDetailContext?.type === 'receipt' && srDetailContext.value === 'with') {
      return `<tr class="hover:bg-slate-50 transition border-b border-slate-50 last:border-0">
        <td class="px-4 py-3 text-xs text-slate-500 whitespace-nowrap">${dateLabel}</td>
        <td class="px-4 py-3 text-xs text-slate-700 font-bold">${e.supplierName || '—'}</td>
        <td class="px-4 py-3 text-xs font-mono text-slate-500">${e.receiptNo || '—'}</td>
        <td class="px-4 py-3 text-xs text-slate-500">${e.category || '—'}</td>
        <td class="px-4 py-3 text-xs text-slate-600">${e.description || '—'}</td>
        <td class="px-4 py-3 text-sm text-right">${amountHtml}</td>
      </tr>`;
    } else if (srDetailContext?.type === 'receipt' && srDetailContext.value === 'without') {
      return `<tr class="hover:bg-slate-50 transition border-b border-slate-50 last:border-0">
        <td class="px-4 py-3 text-xs text-slate-500 whitespace-nowrap">${dateLabel}</td>
        <td class="px-4 py-3 text-xs text-slate-500">${e.category || '—'}</td>
        <td class="px-4 py-3 text-xs text-slate-600">${e.description || '—'}</td>
        <td class="px-4 py-3 text-xs text-slate-500 italic">${e.requestedBy || '—'}</td>
        <td class="px-4 py-3 text-sm text-right">${amountHtml}</td>
      </tr>`;
    } else {
      // Category view — more general
      const hasReceipt = !!e.receiptNo || (srData.withReceiptEntries || []).some(wr => wr.id === e.id);
      return `<tr class="hover:bg-slate-50 transition border-b border-slate-50 last:border-0">
        <td class="px-4 py-3 text-xs text-slate-500 whitespace-nowrap">${dateLabel}</td>
        <td class="px-4 py-3 text-xs text-slate-700 font-medium">${e.description || '—'}</td>
        <td class="px-4 py-3 text-center">
          ${hasReceipt ? '<span class="px-1.5 py-0.5 bg-emerald-100 text-emerald-700 text-[9px] font-bold rounded uppercase">Yes</span>' : '<span class="px-1.5 py-0.5 bg-slate-100 text-slate-500 text-[9px] font-bold rounded uppercase">No</span>'}
        </td>
        <td class="px-4 py-3 text-xs font-mono text-slate-400">${e.receiptNo || e.referenceNo || '—'}</td>
        <td class="px-4 py-3 text-xs text-slate-500 italic">${e.requestedBy || '—'}</td>
        <td class="px-4 py-3 text-sm text-right">${amountHtml}</td>
      </tr>`;
    }
  }).join('');
}

function srDetailPagePrev() {
  if (srModalPage > 1) {
    srModalPage--;
    srDetailRender();
  }
}

function srDetailPageNext() {
  const pages = Math.ceil(srModalFiltered.length / SR_PAGE_SIZE);
  if (srModalPage < pages) {
    srModalPage++;
    srDetailRender();
  }
}

// Redirect old functions to new universal one
function openSrReceiptModal(type) { openSrDetailModal({ type: 'receipt', value: type }); }
function closeSrReceiptModal() { closeSrDetailModal(); }
function srReceiptFilterAndRender() { srDetailFilterAndRender(); }
function srReceiptRender() { srDetailRender(); }
function srReceiptPagePrev() { srDetailPagePrev(); }
function srReceiptPageNext() { srDetailPageNext(); }

</script>
