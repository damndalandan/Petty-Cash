<script>
// =============================================
// DASHBOARD LOGIC
// =============================================
function callServer(fn, data) {
  return new Promise((resolve) => {
    const args = data !== undefined ? [data] : [];
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler((e) => resolve({ success: false, message: e.message }))
      [fn](...args);
  });
}


let discrepancyData = [];
let rawDiscrepancies = [];

document.addEventListener('DOMContentLoaded', () => {
    initDiscrepancyFilters();
});

function initDiscrepancyFilters() {
    const yElem = document.getElementById('discYear');
    const mElem = document.getElementById('discMonth');
    if(!yElem || !mElem) return;

    // Clear existing options to prevent duplication if init runs multiple times
    yElem.innerHTML = '';

    const currentYear = new Date().getFullYear();
    const currentMonth = new Date().getMonth();

    // Populate Year (current - 2 to current + 1)
    for(let i = currentYear - 2; i <= currentYear + 1; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        if(i === currentYear) opt.selected = true;
        yElem.appendChild(opt);
    }
    
    // Select Current Month
    mElem.value = currentMonth; 
}

async function loadDayData() {
  if (!state.currentDate) return;
  
  // Show minimal loading state on dashboard numbers
  const statOpening = document.getElementById('stat-opening');
  if (statOpening) statOpening.classList.add('opacity-50');

  const yearStart = state.currentDate.substring(0,4) + '-01-01';
  const yearEnd = state.currentDate.substring(0,4) + '-12-31';

  const [entriesRes, summaryRes, yearDataRes] = await Promise.all([
    callServer('getExpenseEntries', state.currentDate),
    callServer('getDailySummary', state.currentDate),
    callServer('getDateRange', { from: yearStart, to: yearEnd }) 
  ]);
  
  if (statOpening) statOpening.classList.remove('opacity-50');

  if (entriesRes.success) {
    state.entries = entriesRes.data || [];
  }

  if (summaryRes.success && summaryRes.data) {
    state.summary = summaryRes.data;
  } else {
    state.summary = null;
  }

  updateDashStats();
  loadDiscrepancyWidget();
  prefetchDenomRecords()
}

async function loadDiscrepancyWidget() {
    const yElem = document.getElementById('discYear');
    const year = yElem ? yElem.value : new Date().getFullYear();
    
    const from = `${year}-01-01`;
    const to = `${year}-12-31`;
    
    const res = await callServer('generateReportData', { from, to });
    
    if(!res.success || !res.data.summaries) return;
    
    rawDiscrepancies = res.data.summaries;
    filterDiscrepancies();
}

function filterDiscrepancies() {
    const mElem = document.getElementById('discMonth');
    const selMonth = mElem ? mElem.value : 'ALL';
    
    let filtered = rawDiscrepancies.filter(s => Math.abs(s.variance || 0) > 0.01);
    
    if (selMonth !== 'ALL') {
        const mInt = parseInt(selMonth);
        filtered = filtered.filter(d => {
            const date = new Date(d.date);
            return date.getMonth() === mInt;
        });
    }

    discrepancyData = filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
    
    if(discrepancyData.length === 0) {
        document.getElementById('discrepancyWidget').classList.add('hidden');
        document.getElementById('noDiscrepancyState').classList.remove('hidden');
        if(rawDiscrepancies.some(s => Math.abs(s.variance || 0) > 0.01) && selMonth !== 'ALL') {
             // If there are discrepancies in other months but not this one
             document.querySelector('#noDiscrepancyState h2').textContent = "Balanced Month!";
             document.querySelector('#noDiscrepancyState p').textContent = "No discrepancies for selected month.";
        } else {
             document.querySelector('#noDiscrepancyState h2').textContent = "All Balanced!";
             document.querySelector('#noDiscrepancyState p').textContent = "No discrepancies found in records.";
        }
    } else {
        document.getElementById('discrepancyWidget').classList.remove('hidden');
        document.getElementById('noDiscrepancyState').classList.add('hidden');
        renderDiscDetails();
    }
}

function renderDiscDetails() {
    const list = document.getElementById('discRows');
    list.innerHTML = discrepancyData.map(d => `
       <div class="p-3 hover:bg-white flex justify-between items-center transition">
           <div class="flex flex-col">
              <span class="text-sm font-bold text-gray-700">${new Date(d.date).toLocaleDateString(undefined,{month:'short', day:'numeric', year: 'numeric'})}</span>
              <span class="text-[10px] text-gray-400 uppercase">${new Date(d.date).toLocaleDateString(undefined,{weekday:'long'})}</span>
           </div>
           <span class="font-mono font-bold ${d.variance < 0 ? 'text-red-500' : 'text-blue-500'}">${fmt(d.variance)}</span>
       </div>
    `).join('');
}

async function checkPreviousDayStatus(currentDateStr) {
    // Check for any unclosed dates strictly before current date
    const res = await callServer('findUnclosedPastDate', currentDateStr);
    
    const warningEl = document.getElementById('prevDayWarning');
    const prevDateLabel = document.getElementById('prevDayDate');
    const auditParams = document.getElementById('auditDateParams');
    const warningTitle = warningEl ? warningEl.querySelector('h3') : null;
    const warningText = warningEl ? warningEl.querySelector('p:nth-of-type(1)') : null; // First p tag

    if(!warningEl) return;

    if (res.success && res.date) {
        const targetDate = res.date;
        
        warningEl.classList.remove('hidden');
        warningEl.dataset.targetDate = targetDate;
        
        if(auditParams) {
             auditParams.value = targetDate;
             auditParams.dataset.touched = "true";
        }
        
        if(prevDateLabel) prevDateLabel.textContent = targetDate;
        if(warningTitle) warningTitle.textContent = "Unclosed Past Audit";
        
        // Ensure text is correct for potentially older dates
        // InnerHTML replacement might wipe the span
        if(warningText) {
             warningText.innerHTML = `The petty cash for <span id="prevDayDate" class="font-mono font-bold">${targetDate}</span> hasn't been closed.`;
        }

    } else {
        warningEl.classList.add('hidden');
    }
}

function auditPreviousDay() {
    const picker = document.getElementById('auditDateParams');
    const warningEl = document.getElementById('prevDayWarning');
    const target = (picker && picker.value) ? picker.value : (warningEl ? warningEl.dataset.targetDate : null);
    
    if(!target) return;
    
    const globalDate = document.getElementById('globalDate');
    if(globalDate) {
        globalDate.value = target;
        // Trigger change
        if(typeof onDateChange === 'function') onDateChange();
    }
    
    navigate('denominations');
    if(typeof switchDenomTab === 'function') switchDenomTab('END');
}

function updateDashStats() {
  const openingEl = document.getElementById('openingCash');
  // Since we removed the inputs, we rely purely on state.summary now
  // If inputs existed, we'd check them. Since they don't, we fallback to summary or 0.
  
  const summary = state.summary || {};
  const opening = summary.openingCash || 0;
  const closing = summary.closingCash || 0;
  
  // Call helper to check previous day
  if(state.currentDate) checkPreviousDayStatus(state.currentDate);

  const withReceipt = state.entries.filter(e => e.hasReceipt && e.type === 'EXPENSE').reduce((s, e) => s + parseFloat(e.amount || 0), 0);
  const noReceipt = state.entries.filter(e => !e.hasReceipt && e.type === 'EXPENSE').reduce((s, e) => s + parseFloat(e.amount || 0), 0);
  const totalExp = withReceipt + noReceipt;

  const so = document.getElementById('stat-opening'); if(so) so.textContent = fmt(opening);
  const se = document.getElementById('stat-expenses'); if(se) se.textContent = fmt(totalExp);
  const sc = document.getElementById('stat-closing'); if(sc) sc.textContent = fmt(closing);
  
  // Calculate Expected: Opening - Total Outflows (Expenses + CashAdvance)
  // Check if CashAdvance is available in summary
  const cashAdv = summary.cashAdvance || 0;
  // If cash advance is handled as an entry with type 'CASH_ADVANCE', we might need to sum it from entries if summary isn't up to date or we want live entry data
  // But recalculateDailySummary updates summary.cashAdvance. 
  // Wait, totalExp in summary DOES NOT include cashAdvance based on Code.js logic:
  // if (type === 'CASH_ADVANCE') cashAdvance += amt; else totalExp += amt;
  // So Total Outflows = totalExp + cashAdv.
  
  // Note: we are calculating totalExp live from state.entries above (withReceipt + noReceipt).
  // We should also calculate cashAdv live from state.entries to be consistent.
  const liveCashAdv = state.entries.filter(e => e.type === 'CASH_ADVANCE' && e.status !== 'DELETED').reduce((s, e) => s + parseFloat(e.amount || 0), 0);
  
  // Actually, let's use the live calculation for everything if possible to feel responsive
  const totalOutflows = totalExp + liveCashAdv;
  const expectedInfo = opening - totalOutflows;
  
  const sexp = document.getElementById('stat-expected'); 
  if(sexp) {
      sexp.textContent = fmt(expectedInfo);
      // Optional: Add color if negative?
      if(expectedInfo < 0) sexp.classList.add('text-red-500');
      else sexp.classList.remove('text-red-500');
  }

  const sr = document.getElementById('stat-receipt'); if(sr) sr.textContent = fmt(withReceipt);
  const sn = document.getElementById('stat-noreceipt'); if(sn) sn.textContent = fmt(noReceipt);

  const qsCash = document.getElementById('qs-cash'); if(qsCash) qsCash.textContent = fmt(opening);
  const qsExp = document.getElementById('qs-expenses'); if(qsExp) qsExp.textContent = fmt(totalExp);
}

async function prefetchDenomRecords() {
  try {
    const res = await callServer('getDenominationRecords', state.currentDate);
    if (res.success) {
      state.denomRecords = res.data || [];
    }
  } catch(e) {
    console.error('prefetch denom failed', e);
  }
}

</script>
