<script>
// =============================================
// DASHBOARD LOGIC
// =============================================

let discrepancyData = [];
let rawDiscrepancies = [];

document.addEventListener('DOMContentLoaded', () => {
    initDiscrepancyFilters();
});

function initDiscrepancyFilters() {
    const yElem = document.getElementById('discYear');
    const mElem = document.getElementById('discMonth');
    if(!yElem || !mElem) return;

    // Clear existing options to prevent duplication if init runs multiple times
    yElem.innerHTML = '';

    const currentYear = new Date().getFullYear();
    const currentMonth = new Date().getMonth();

    // Populate Year (current - 2 to current + 1)
    for(let i = currentYear - 2; i <= currentYear + 1; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        if(i === currentYear) opt.selected = true;
        yElem.appendChild(opt);
    }
    
    // Select Current Month
    mElem.value = currentMonth; 
}

async function loadDayData() {
  if (!state.currentDate) return;

  const statOpening = document.getElementById('stat-opening');
  if (statOpening) statOpening.classList.add('opacity-50');

  const [entriesRes, summaryRes] = await Promise.all([
    callServer('getExpenseEntries', state.currentDate),
    callServer('getDailySummary', state.currentDate)
  ]);

  if (statOpening) statOpening.classList.remove('opacity-50');

  if (entriesRes.success) {
    state.entries = entriesRes.data || [];
  }

  if (summaryRes.success && summaryRes.data) {
    state.summary = summaryRes.data;
  } else {
    state.summary = null;
  }

  updateDashStats();
  loadDiscrepancyWidget();
  // Always check from TODAY regardless of which date is selected
  const todayStr = new Date().toISOString().split('T')[0];
  checkPreviousDayStatus(todayStr);

  // Admin metrics — show section immediately, load data once
  if (isAdmin()) {
    const section = document.getElementById('adminMetricsSection');
    if (section) section.classList.remove('hidden');
    if (!adminMetricsRaw) {
      initAdminMetricYears();
      loadAdminMetrics(); // shows skeleton instantly, fetches in background
    }
  }

  // Auditor metrics — load once on first visit
  if (isAuditor() && !isAdmin()) {
    if (!auditorMetricsRaw) {
      loadAuditorMetrics();
    }
  }
}

async function loadDiscrepancyWidget() {
    const yElem = document.getElementById('discYear');
    const year = yElem ? yElem.value : new Date().getFullYear();
    
    const from = `${year}-01-01`;
    const to = `${year}-12-31`;
    
    const res = await callServer('generateReportData', { from, to });
    
    if(!res.success || !res.data.summaries) return;
    
    rawDiscrepancies = res.data.summaries;
    filterDiscrepancies();
}

function filterDiscrepancies() {
    const mElem = document.getElementById('discMonth');
    const selMonth = mElem ? mElem.value : 'ALL';
    
    const sexp = document.getElementById('stat-expected');
  if (sexp) {
    sexp.textContent = fmt(expectedInfo);
    if (expectedInfo < 0) sexp.classList.add('text-red-500');
    else sexp.classList.remove('text-red-500');
  }
    
    if (selMonth !== 'ALL') {
        const mInt = parseInt(selMonth);
        filtered = filtered.filter(d => {
            const date = new Date(d.date + 'T00:00:00');
            return date.getMonth() === mInt;
        });
    }

    discrepancyData = filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
    
    if(discrepancyData.length === 0) {
        document.getElementById('discrepancyWidget').classList.add('hidden');
        document.getElementById('noDiscrepancyState').classList.remove('hidden');
        if(rawDiscrepancies.some(s => Math.abs(s.variance || 0) > 0.01) && selMonth !== 'ALL') {
             // If there are discrepancies in other months but not this one
             document.querySelector('#noDiscrepancyState h2').textContent = "Balanced Month!";
             document.querySelector('#noDiscrepancyState p').textContent = "No discrepancies for selected month.";
        } else {
             document.querySelector('#noDiscrepancyState h2').textContent = "All Balanced!";
             document.querySelector('#noDiscrepancyState p').textContent = "No discrepancies found in records.";
        }
    } else {
        document.getElementById('discrepancyWidget').classList.remove('hidden');
        document.getElementById('noDiscrepancyState').classList.add('hidden');
        renderDiscDetails();
    }
}

function renderDiscDetails() {
    const list = document.getElementById('discRows');
    list.innerHTML = discrepancyData.map(d => {
        const dateObj = new Date(d.date + 'T00:00:00');
        return `
       <div class="p-3 hover:bg-white flex justify-between items-center transition">
           <div class="flex flex-col">
              <span class="text-sm font-bold text-gray-700">${dateObj.toLocaleDateString(undefined,{month:'short', day:'numeric', year: 'numeric'})}</span>
              <span class="text-[10px] text-gray-400 uppercase">${dateObj.toLocaleDateString(undefined,{weekday:'long'})}</span>
           </div>
           <span class="font-mono font-bold ${d.variance < 0 ? 'text-red-500' : 'text-blue-500'}">${fmt(d.variance)}</span>
       </div>
    `;}).join('');
}

async function checkPreviousDayStatus(currentDateStr) {
    const res = await callServer('findUnclosedPastDate', currentDateStr);

    const warningEl    = document.getElementById('prevDayWarning');
    const auditParams  = document.getElementById('auditDateParams');
    const warningTitle = document.getElementById('prevDayWarningTitle');
    const prevDateLabel = document.getElementById('prevDayDate');

    if (!warningEl) return;

    if (res.success && res.date) {
        const targetDate = res.date;

        warningEl.classList.remove('hidden');
        warningEl.dataset.targetDate = targetDate;

        if (auditParams)    auditParams.value       = targetDate;
        if (warningTitle)   warningTitle.textContent = 'Unclosed Past Audit';
        if (prevDateLabel)  prevDateLabel.textContent = targetDate;

    } else {
        warningEl.classList.add('hidden');
    }
}

function auditPreviousDay() {
    const picker = document.getElementById('auditDateParams');
    const warningEl = document.getElementById('prevDayWarning');
    const target = (picker && picker.value) ? picker.value : (warningEl ? warningEl.dataset.targetDate : null);
    
    if(!target) return;
    
    const globalDate = document.getElementById('globalDate');
    if(globalDate) {
        globalDate.value = target;
        // Trigger change
        if(typeof onDateChange === 'function') onDateChange();
    }
    
    if (isAuditor() && !isAdmin()) {
        navigate('auditreview');
    } else {
        navigate('denominations');
        if(typeof switchDenomTab === 'function') switchDenomTab('END');
    }
}

function updateDashStats() {
  const summary = state.summary || {};
  const opening = summary.openingCash || 0;
  const closing = summary.closingCash || 0;

  const withReceipt   = state.entries.filter(e => e.hasReceipt && e.type === 'EXPENSE').reduce((s, e) => s + parseFloat(e.amount || 0), 0);
  const noReceipt     = state.entries.filter(e => !e.hasReceipt && e.type === 'EXPENSE').reduce((s, e) => s + parseFloat(e.amount || 0), 0);
  const totalExp      = withReceipt + noReceipt;
  const totalReplenish = state.entries.filter(e => e.type === 'REPLENISHMENT' && e.status !== 'DELETED').reduce((s, e) => s + parseFloat(e.amount || 0), 0);

  const so = document.getElementById('stat-opening');      if(so) so.textContent = fmt(opening);
  const se = document.getElementById('stat-expenses');     if(se) se.textContent = fmt(totalExp);
  const sc = document.getElementById('stat-closing');      if(sc) sc.textContent = fmt(closing);
  const srp = document.getElementById('stat-replenishment'); if(srp) srp.textContent = fmt(totalReplenish);

  // Expected = opening + replenishment - expenses - advances
    const liveCashAdv = state.entries
    .filter(e => e.type === 'CASH_ADVANCE' && e.status !== 'DELETED' && !e.carriedForward)
    .reduce((s, e) => s + parseFloat(e.amount || 0), 0);

  const expectedInfo = (opening + totalReplenish) - (totalExp + liveCashAdv);

  const sexp = document.getElementById('stat-expected');
  if (sexp) {
    sexp.textContent = fmt(expectedInfo);
    if (expectedInfo < 0) sexp.classList.add('text-red-500');
    else sexp.classList.remove('text-red-500');
  }

  const sr = document.getElementById('stat-receipt');    if(sr) sr.textContent = fmt(withReceipt);
  const sn = document.getElementById('stat-noreceipt');  if(sn) sn.textContent = fmt(noReceipt);
  const qsCash = document.getElementById('qs-cash');     if(qsCash) qsCash.textContent = fmt(opening);
  const qsExp  = document.getElementById('qs-expenses'); if(qsExp)  qsExp.textContent  = fmt(totalExp);

  // Load day status banner and outstanding advances
  loadDayStatusBanner();
}

async function loadDayStatusBanner() {
  const res = await callServer('getDayStatus', state.currentDate);
  if (!res.success) return;

  // ── Day Status Banner ──
  const banner    = document.getElementById('dayStatusBanner');
  const iconEl    = document.getElementById('dayStatusIcon');
  const titleEl   = document.getElementById('dayStatusTitle');
  const subEl     = document.getElementById('dayStatusSub');
  const actionEl  = document.getElementById('dayStatusAction');

  if (!banner) return;
  banner.classList.remove('hidden');

  const statusMap = {
  NO_RECORD    : { icon:'📋', title:'No record yet',   sub:'Auditor has not opened this day.',                bg:'bg-gray-50 border-gray-200 text-gray-700'  },
  OPEN         : { icon:'🟢', title:'Day is Open',     sub:'Cashier can record expenses.',                    bg:'bg-green-50 border-green-200 text-green-800' },
  PENDING_AUDIT: { icon:'🔍', title:'Pending Audit',   sub:'Closing submitted. Awaiting auditor approval.',   bg:'bg-amber-50 border-amber-300 text-amber-800' },
  FLAGGED      : { icon:'🚩', title:'Recount Required',sub:'Auditor flagged this day. Please recount cash.',  bg:'bg-red-50 border-red-400 text-red-800'       },
  CLOSED       : { icon:'🔒', title:'Day Closed',      sub:'Auditor has approved and closed this day.',       bg:'bg-blue-50 border-blue-200 text-blue-800'    }
};

  const info = statusMap[res.status] || statusMap['NO_RECORD'];
  banner.className = `rounded-xl px-5 py-3 flex items-center justify-between gap-3 border shadow-sm ${info.bg}`;
  iconEl.textContent  = info.icon;
  titleEl.textContent = info.title;
  titleEl.className   = `text-sm font-bold`;
  subEl.textContent   = info.sub;

  // Show approve button for Auditor on PENDING_AUDIT
  actionEl.innerHTML = '';
  if (res.status === 'PENDING_AUDIT' && isAuditor()) {
    actionEl.innerHTML = `
      <button onclick="navigate('auditreview')"
        class="whitespace-nowrap px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-lg shadow transition">
        Review & Approve →
      </button>`;
  }
  if (res.status === 'FLAGGED' && isCashier()) {
    // Show flag note if available
    const noteHtml = res.flagNote
      ? `<div class="text-xs text-red-600 mt-1 font-normal">Auditor note: "${res.flagNote}"</div>`
      : '';
    actionEl.innerHTML = `
      <div class="text-right">
        <button onclick="navigate('denominations')"
          class="whitespace-nowrap px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg shadow transition">
          🔄 Recount & Resubmit →
        </button>
        ${noteHtml}
      </div>`;
  }
  if (res.status === 'FLAGGED' && isAuditor()) {
    actionEl.innerHTML = `
      <span class="text-xs text-red-600 font-medium">Waiting for cashier recount...</span>`;
  }

  // ── Outstanding Advances Banner ──
  const advBanner = document.getElementById('outstandingAdvBanner');
  if (advBanner) {
    if (res.outstandingAdvances > 0) {
      advBanner.classList.remove('hidden');
      document.getElementById('outstandingAdvTitle').textContent =
        `${res.outstandingAdvances} Outstanding Cash Advance${res.outstandingAdvances > 1 ? 's' : ''}`;
      document.getElementById('outstandingAdvSub').textContent =
        `Total of ${fmt(res.outstandingTotal)} still unliquidated as of ${state.currentDate}`;
    } else {
      advBanner.classList.add('hidden');
    }
  }
}

// =============================================
// ADMIN METRICS
// =============================================

let adminMetricsRaw  = null;   // full data from server
let adminActiveCard  = null;   // currently expanded card key
let adminModalDate   = null;   // date open in modal

function initAdminMetricYears() {
  const yEl = document.getElementById('adminMetricYear');
  if (!yEl || yEl.options.length > 0) return;
  const cur = new Date().getFullYear();
  for (let y = cur - 3; y <= cur + 1; y++) {
    const o = document.createElement('option');
    o.value = y; o.textContent = y;
    if (y === cur) o.selected = true;
    yEl.appendChild(o);
  }
}

async function loadAdminMetrics() {
  if (!isAdmin()) return;

  // Show section immediately with skeleton badges
  const section = document.getElementById('adminMetricsSection');
  if (section) section.classList.remove('hidden');

  // Set all badges to loading state
  ['unclosed','unfiled','discrepancies','cashOver','pendingAdvances'].forEach(key => {
    const b = document.getElementById('badge-' + key);
    if (b) { b.textContent = '…'; b.classList.add('opacity-50'); }
  });

  const res = await callServer('getAdminMetrics');
  if (!res.success) {
    toast('Failed to load admin metrics', 'error');
    ['unclosed','unfiled','discrepancies','cashOver','pendingAdvances'].forEach(key => {
      const b = document.getElementById('badge-' + key);
      if (b) { b.textContent = '!'; b.classList.remove('opacity-50'); }
    });
    return;
  }

  adminMetricsRaw = res.data;

  // Remove loading state
  ['unclosed','unfiled','discrepancies','cashOver','pendingAdvances'].forEach(key => {
    const b = document.getElementById('badge-' + key);
    if (b) b.classList.remove('opacity-50');
  });

  renderAdminMetricCards();
}

function getAdminFilteredData(key) {
  if (!adminMetricsRaw) return [];
  const raw  = adminMetricsRaw[key] || [];
  const mEl  = document.getElementById('adminMetricMonth');
  const yEl  = document.getElementById('adminMetricYear');
  const selM = mEl ? mEl.value : 'ALL';
  const selY = yEl ? parseInt(yEl.value) : new Date().getFullYear();

  return raw.filter(item => {
    const d = new Date((item.date || '') + 'T00:00:00');
    if (isNaN(d)) return true;
    if (d.getFullYear() !== selY) return false;
    if (selM !== 'ALL' && d.getMonth() !== parseInt(selM)) return false;
    return true;
  });
}

function renderAdminMetricCards() {
  const keys = [
    { key: 'unclosed',       badge: 'badge-unclosed',       card: 'card-unclosed',       activeClass: 'border-red-500 bg-red-50'    },
    { key: 'unfiled',        badge: 'badge-unfiled',        card: 'card-unfiled',        activeClass: 'border-amber-500 bg-amber-50' },
    { key: 'discrepancies',  badge: 'badge-discrepancies',  card: 'card-discrepancies',  activeClass: 'border-orange-500 bg-orange-50'},
    { key: 'cashOver',       badge: 'badge-cashOver',       card: 'card-cashOver',       activeClass: 'border-blue-500 bg-blue-50'  },
    { key: 'pendingAdvances',badge: 'badge-pendingAdvances',card: 'card-pendingAdvances',activeClass: 'border-purple-500 bg-purple-50'},
  ];

  keys.forEach(({ key, badge, card, activeClass }) => {
    const data  = getAdminFilteredData(key);
    const count = data.length;
    const bEl   = document.getElementById(badge);
    const cEl   = document.getElementById(card);
    if (bEl) bEl.textContent = count;

    // Highlight active card
    if (cEl) {
      const defaultClasses = {
        unclosed      : 'border-red-200',
        unfiled       : 'border-amber-200',
        discrepancies : 'border-orange-200',
        cashOver      : 'border-blue-200',
        pendingAdvances:'border-purple-200',
      };
      cEl.classList.remove(...Object.values(defaultClasses), 'border-red-500','border-amber-500','border-orange-500','border-blue-500','border-purple-500','bg-red-50','bg-amber-50','bg-orange-50','bg-blue-50','bg-purple-50');
      if (adminActiveCard === key) {
        cEl.classList.add(...activeClass.split(' '));
      } else {
        cEl.classList.add(defaultClasses[key]);
      }
    }
  });
}

function toggleAdminCard(key) {
  if (!adminMetricsRaw) {
    toast('Data still loading, please wait...', 'warning');
    return;
  }
  adminActiveCard = key;
  renderAdminMetricCards();
  openAdminPanelModal(key);
}

function closeAdminCard() {
  adminActiveCard = null;
  renderAdminMetricCards();
  const modal = document.getElementById('adminPanelModal');
  if (modal) modal.classList.add('hidden');
}

function openAdminPanelModal(key) {
  const modal   = document.getElementById('adminPanelModal');
  const titleEl = document.getElementById('adminPanelModalTitle');
  const listEl  = document.getElementById('adminPanelModalList');
  if (!modal || !titleEl || !listEl) return;

  const meta = ADMIN_PANEL_META[key] || { title: key, empty: 'No items.' };
  titleEl.textContent = meta.title;

  // Reuse renderAdminPanel logic but target modal list
  const data = getAdminFilteredData(key);

  if (!data.length) {
    listEl.innerHTML = `<div class="p-10 text-center text-gray-400 text-sm">${meta.empty}</div>`;
  } else if (key === 'pendingAdvances') {
    listEl.innerHTML = data.map(item => {
      const urgency = item.daysOutstanding >= 7 ? 'text-red-600' : item.daysOutstanding >= 3 ? 'text-amber-600' : 'text-gray-500';
      const statusBadge = item.status === 'LIQUIDATION_PENDING'
        ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-yellow-100 text-yellow-700 font-bold">Pending Review</span>'
        : '<span class="text-[10px] px-1.5 py-0.5 rounded bg-red-100 text-red-700 font-bold">Outstanding</span>';
      return `
        <div onclick="openAdminDayModal('${item.date}', 'pendingAdvances')"
          class="flex items-center justify-between px-4 py-3 hover:bg-gray-50 cursor-pointer transition border-b border-gray-100 last:border-0">
          <div class="flex flex-col">
            <span class="text-sm font-bold text-gray-700">${formatAdminDate(item.date)}</span>
            <span class="text-xs text-gray-500 truncate max-w-[200px]">${item.description || '—'} · ${item.requestedBy || '—'}</span>
          </div>
          <div class="flex flex-col items-end gap-1">
            <span class="font-mono text-sm font-bold text-gray-700">${fmt(item.amount)}</span>
            <div class="flex items-center gap-1.5">${statusBadge}<span class="text-[10px] ${urgency} font-mono">${item.daysOutstanding}d</span></div>
          </div>
        </div>`;
    }).join('');
  } else {
    listEl.innerHTML = data.map(item => {
      let rightHtml = '';
      if (key === 'unclosed') {
        const sc = { OPEN:'bg-green-100 text-green-700', PENDING_AUDIT:'bg-amber-100 text-amber-700', FLAGGED:'bg-red-100 text-red-700' }[item.status] || 'bg-gray-100 text-gray-500';
        rightHtml = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${sc}">${item.status}</span>`;
      } else if (key === 'unfiled') {
        const icons = [(item.filedReceipts?'✅':'❌'),(item.filedNoReceipts?'✅':'❌'),(item.filedReport?'✅':'❌')];
        rightHtml = `<span class="text-xs font-mono text-gray-500 tracking-widest" title="Receipts / No-Receipts / Report">${icons.join(' ')}</span>`;
      } else if (key === 'discrepancies') {
        const v = item.variance || 0;
        rightHtml = `<span class="font-mono font-bold text-sm ${v < 0 ? 'text-red-600':'text-blue-600'}">${v>=0?'+':''}${fmt(v)}</span>`;
      } else if (key === 'cashOver') {
        rightHtml = `<span class="font-mono font-bold text-sm text-emerald-600">+${fmt(item.cashOver)}</span>`;
      }
      return `
        <div onclick="openAdminDayModal('${item.date}', '${key}')"
          class="flex items-center justify-between px-4 py-3 hover:bg-gray-50 cursor-pointer transition border-b border-gray-100 last:border-0">
          <div class="flex flex-col">
            <span class="text-sm font-bold text-gray-700">${formatAdminDate(item.date)}</span>
            <span class="text-xs text-gray-400 font-mono">Exp: ${fmt(item.expenses || 0)}</span>
          </div>
          <div class="flex items-center gap-2">${rightHtml}</div>
        </div>`;
    }).join('');
  }

  modal.classList.remove('hidden');
}

const ADMIN_PANEL_META = {
  unclosed      : { title: '🔓 Unclosed Days',          empty: '✅ All days are closed!' },
  unfiled       : { title: '📂 Unfiled Days',            empty: '✅ All closed days are filed!' },
  discrepancies : { title: '⚠️ Days with Discrepancies', empty: '✅ No discrepancies found!' },
  cashOver      : { title: '💹 Days with Cash Over',     empty: 'No cash-over days found.' },
  pendingAdvances:{ title: '💳 Pending Cash Advances',   empty: '✅ No pending advances!' },
};

function renderAdminPanel(key) {
  const titleEl = document.getElementById('adminPanelTitle');
  const listEl  = document.getElementById('adminPanelList');
  if (!titleEl || !listEl) return;

  const meta = ADMIN_PANEL_META[key] || { title: key, empty: 'No items.' };
  titleEl.textContent = meta.title;

  const data = getAdminFilteredData(key);

  if (!data.length) {
    listEl.innerHTML = `<div class="p-8 text-center text-gray-400 text-sm">${meta.empty}</div>`;
    return;
  }

  if (key === 'pendingAdvances') {
    listEl.innerHTML = data.map(item => {
      const urgency = item.daysOutstanding >= 7 ? 'text-red-600' : item.daysOutstanding >= 3 ? 'text-amber-600' : 'text-gray-500';
      const statusBadge = item.status === 'LIQUIDATION_PENDING'
        ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-yellow-100 text-yellow-700 font-bold">Pending Review</span>'
        : '<span class="text-[10px] px-1.5 py-0.5 rounded bg-red-100 text-red-700 font-bold">Outstanding</span>';
      return `
        <div onclick="openAdminDayModal('${item.date}', 'pendingAdvances')"
          class="flex items-center justify-between px-4 py-3 hover:bg-gray-50 cursor-pointer transition">
          <div class="flex flex-col">
            <span class="text-sm font-bold text-gray-700">${formatAdminDate(item.date)}</span>
            <span class="text-xs text-gray-500 truncate max-w-[180px]">${item.description || '—'} · ${item.requestedBy || '—'}</span>
          </div>
          <div class="flex flex-col items-end gap-1">
            <span class="font-mono text-sm font-bold text-gray-700">${fmt(item.amount)}</span>
            <div class="flex items-center gap-1.5">
              ${statusBadge}
              <span class="text-[10px] ${urgency} font-mono">${item.daysOutstanding}d</span>
            </div>
          </div>
        </div>`;
    }).join('');
    return;
  }

  listEl.innerHTML = data.map(item => {
    let rightHtml = '';
    if (key === 'unclosed') {
      const statusColors = { OPEN:'bg-green-100 text-green-700', PENDING_AUDIT:'bg-amber-100 text-amber-700', FLAGGED:'bg-red-100 text-red-700' };
      const sc = statusColors[item.status] || 'bg-gray-100 text-gray-500';
      rightHtml = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${sc}">${item.status}</span>`;
    } else if (key === 'unfiled') {
      const icons = [
        item.filedReceipts   ? '✅' : '❌',
        item.filedNoReceipts ? '✅' : '❌',
        item.filedReport     ? '✅' : '❌',
      ];
      rightHtml = `<span class="text-xs font-mono text-gray-500 tracking-widest" title="Receipts / No-Receipts / Report">${icons.join(' ')}</span>`;
    } else if (key === 'discrepancies') {
      const v = item.variance || 0;
      rightHtml = `<span class="font-mono font-bold text-sm ${v < 0 ? 'text-red-600' : 'text-blue-600'}">${v >= 0 ? '+' : ''}${fmt(v)}</span>`;
    } else if (key === 'cashOver') {
      rightHtml = `<span class="font-mono font-bold text-sm text-emerald-600">+${fmt(item.cashOver)}</span>`;
    }

    return `
      <div onclick="openAdminDayModal('${item.date}', '${key}')"
        class="flex items-center justify-between px-4 py-3 hover:bg-gray-50 cursor-pointer transition">
        <div class="flex flex-col">
          <span class="text-sm font-bold text-gray-700">${formatAdminDate(item.date)}</span>
          <span class="text-xs text-gray-400 font-mono">Exp: ${fmt(item.expenses || 0)}</span>
        </div>
        <div class="flex items-center gap-2">${rightHtml}</div>
      </div>`;
  }).join('');
}

function formatAdminDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function openAdminDayModal(date, cardKey) {
  adminModalDate = date;
  const modal    = document.getElementById('adminDayModal');
  const titleEl  = document.getElementById('adminModalTitle');
  const dateEl   = document.getElementById('adminModalDate');
  const bodyEl   = document.getElementById('adminModalBody');
  if (!modal) return;

  titleEl.textContent = ADMIN_PANEL_META[cardKey]?.title || 'Day Detail';
  dateEl.textContent  = formatAdminDate(date);

  // Find data for this date
  const raw   = adminMetricsRaw || {};
  const sum   = (raw.unclosed || []).find(x => x.date === date)
             || (raw.discrepancies || []).find(x => x.date === date)
             || (raw.cashOver || []).find(x => x.date === date)
             || (raw.unfiled || []).find(x => x.date === date)
             || {};

  let specificHtml = '';

  if (cardKey === 'unclosed') {
    const statusColors = { OPEN:'bg-green-100 text-green-700', PENDING_AUDIT:'bg-amber-100 text-amber-700', FLAGGED:'bg-red-100 text-red-700' };
    const sc = statusColors[sum.status] || 'bg-gray-100 text-gray-500';
    specificHtml = `
      <div class="flex justify-between items-center">
        <span class="text-xs text-gray-500 uppercase font-mono">Audit Status</span>
        <span class="text-xs font-bold px-2.5 py-1 rounded-full ${sc}">${sum.status || '—'}</span>
      </div>`;
  } else if (cardKey === 'unfiled') {
    const fil = (raw.unfiled || []).find(x => x.date === date) || {};
    specificHtml = `
      <div class="rounded-lg border border-gray-200 overflow-hidden">
        <div class="px-4 py-2 bg-gray-50 text-xs font-bold text-gray-500 uppercase border-b">Filing Status</div>
        ${[['📄 Receipts Filed', fil.filedReceipts],['📄 No-Receipt Docs Filed', fil.filedNoReceipts],['📋 Report Filed', fil.filedReport]].map(([label, val]) => `
        <div class="flex justify-between items-center px-4 py-2 border-b border-gray-100 last:border-0">
          <span class="text-xs text-gray-600">${label}</span>
          <span class="text-sm">${val ? '✅' : '❌'}</span>
        </div>`).join('')}
      </div>`;
  } else if (cardKey === 'discrepancies') {
    const v = sum.variance || 0;
    specificHtml = `
      <div class="flex justify-between items-center">
        <span class="text-xs text-gray-500 uppercase font-mono">Variance</span>
        <span class="font-mono font-bold text-base ${v < 0 ? 'text-red-600' : 'text-blue-600'}">${v >= 0 ? '+' : ''}${fmt(v)}</span>
      </div>`;
  } else if (cardKey === 'cashOver') {
    specificHtml = `
      <div class="flex justify-between items-center">
        <span class="text-xs text-gray-500 uppercase font-mono">Cash Over Amount</span>
        <span class="font-mono font-bold text-base text-emerald-600">+${fmt(sum.cashOver || 0)}</span>
      </div>`;
  } else if (cardKey === 'pendingAdvances') {
    const adv = (raw.pendingAdvances || []).filter(x => x.date === date);
    specificHtml = adv.map(a => `
      <div class="rounded-lg border border-gray-200 p-3">
        <div class="flex justify-between mb-1">
          <span class="text-xs font-bold text-gray-700">${a.description || '—'}</span>
          <span class="font-mono font-bold text-sm text-purple-700">${fmt(a.amount)}</span>
        </div>
        <div class="text-[10px] text-gray-400">Requested by: ${a.requestedBy || '—'} · ${a.daysOutstanding} days outstanding</div>
      </div>`).join('') || '<div class="text-xs text-gray-400">No advance details.</div>';
  }

  bodyEl.innerHTML = `
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-gray-50 rounded-lg p-3 text-center">
        <div class="text-[10px] text-gray-400 uppercase font-mono mb-1">Opening</div>
        <div class="text-sm font-bold font-mono text-gray-700">${fmt(sum.opening || 0)}</div>
      </div>
      <div class="bg-gray-50 rounded-lg p-3 text-center">
        <div class="text-[10px] text-gray-400 uppercase font-mono mb-1">Expenses</div>
        <div class="text-sm font-bold font-mono text-red-600">${fmt(sum.expenses || 0)}</div>
      </div>
      <div class="bg-gray-50 rounded-lg p-3 text-center">
        <div class="text-[10px] text-gray-400 uppercase font-mono mb-1">Closing</div>
        <div class="text-sm font-bold font-mono text-green-600">${fmt(sum.closing || 0)}</div>
      </div>
    </div>
    ${specificHtml}`;

  modal.classList.remove('hidden');
}

function closeAdminDayModal() {
  const modal = document.getElementById('adminDayModal');
  if (modal) modal.classList.add('hidden');
  adminModalDate = null;
}

function goToDateFromModal() {
  if (!adminModalDate) return;
  closeAdminDayModal();
  const picker = document.getElementById('globalDate');
  if (picker) {
    picker.value = adminModalDate;
    if (typeof onDateChange === 'function') onDateChange();
  }
  navigate('report');
}

// =============================================
// AUDITOR METRICS
// =============================================

let auditorMetricsRaw  = null;
let auditorActiveCard  = null;

async function loadAuditorMetrics() {
  // Only for pure Auditors (not Admin — Admin has their own section)
  if (!isAuditor() || isAdmin()) return;

  const section = document.getElementById('auditorMetricsSection');
  if (section) section.classList.remove('hidden');

  // Skeleton state
  ['pendingAudit','flaggedDays','pendingLiquidations','recentClosed'].forEach(key => {
    const b = document.getElementById('abadge-' + key);
    if (b) { b.textContent = '…'; b.classList.add('opacity-50'); }
  });

  const res = await callServer('getAuditorMetrics');
  if (!res.success) {
    toast('Failed to load auditor metrics', 'error');
    return;
  }

  auditorMetricsRaw = res.data;

  ['pendingAudit','flaggedDays','pendingLiquidations','recentClosed'].forEach(key => {
    const b = document.getElementById('abadge-' + key);
    if (b) { b.classList.remove('opacity-50'); }
  });

  renderAuditorMetricCards();
  renderAuditorUrgentBanner();
}

function renderAuditorUrgentBanner() {
  const banner   = document.getElementById('auditorUrgentBanner');
  const titleEl  = document.getElementById('auditorUrgentTitle');
  const subEl    = document.getElementById('auditorUrgentSub');
  if (!banner || !auditorMetricsRaw) return;

  const pending  = auditorMetricsRaw.pendingAudit  || [];
  const flagged  = auditorMetricsRaw.flaggedDays   || [];

  if (pending.length > 0) {
    banner.classList.remove('hidden');
    titleEl.textContent = `${pending.length} day${pending.length > 1 ? 's' : ''} awaiting your audit review`;
    const oldest = pending[pending.length - 1]; // sorted desc, so last = oldest
    subEl.textContent = `Oldest unreviewed: ${formatAuditorDate(oldest.date)}. Cashier cannot proceed until you approve.`;
  } else if (flagged.length > 0) {
    banner.classList.remove('hidden');
    banner.classList.replace('bg-amber-50','bg-red-50');
    banner.classList.replace('border-amber-400','border-red-400');
    titleEl.textContent = `${flagged.length} flagged day${flagged.length > 1 ? 's' : ''} waiting for cashier recount`;
    titleEl.classList.replace('text-amber-800','text-red-800');
    subEl.textContent   = `You sent these back. Waiting for the cashier to resubmit.`;
    subEl.classList.replace('text-amber-700','text-red-700');
    // hide the button since auditor just waits
    const btn = banner.querySelector('button');
    if (btn) btn.classList.add('hidden');
  } else {
    banner.classList.add('hidden');
  }
}

function renderAuditorMetricCards() {
  if (!auditorMetricsRaw) return;

  const config = {
    pendingAudit      : { color: 'amber'  },
    flaggedDays       : { color: 'red'    },
    pendingLiquidations:{ color: 'purple' },
    recentClosed      : { color: 'green'  },
  };

  Object.entries(config).forEach(([key, { color }]) => {
    const data  = auditorMetricsRaw[key] || [];
    const badge = document.getElementById('abadge-' + key);
    const card  = document.getElementById('acard-' + key);
    if (badge) badge.textContent = data.length;
    if (card) {
      card.classList.remove(
        'border-amber-200','border-red-200','border-purple-200','border-green-200',
        'border-amber-500','border-red-500','border-purple-500','border-green-500',
        'bg-amber-50','bg-red-50','bg-purple-50','bg-green-50'
      );
      if (auditorActiveCard === key) {
        card.classList.add(`border-${color}-500`, `bg-${color}-50`);
      } else {
        card.classList.add(`border-${color}-200`);
      }
    }
  });
}

function toggleAuditorCard(key) {
  if (!auditorMetricsRaw) {
    toast('Data still loading, please wait...', 'warning');
    return;
  }
  auditorActiveCard = key;
  renderAuditorMetricCards();
  renderAuditorDetailPanel(key);
  document.getElementById('auditorPanelModal')?.classList.remove('hidden');
}

function closeAuditorCard() {
  auditorActiveCard = null;
  renderAuditorMetricCards();
  document.getElementById('auditorPanelModal')?.classList.add('hidden');
}

function renderAuditorDetailPanel(key) {
  const titleEl = document.getElementById('auditorDetailTitle');
  const listEl  = document.getElementById('auditorDetailList');
  if (!titleEl || !listEl || !auditorMetricsRaw) return;

  const titles = {
    pendingAudit      : '🔍 Days Pending Your Review',
    flaggedDays       : '🚩 Flagged Days (Awaiting Cashier)',
    pendingLiquidations:'💳 Liquidations Submitted for Review',
    recentClosed      : '✅ Days Closed in the Last 7 Days',
  };
  titleEl.textContent = titles[key] || key;

  const data = auditorMetricsRaw[key] || [];
  if (!data.length) {
    listEl.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">Nothing here — all clear!</div>';
    return;
  }

  if (key === 'pendingLiquidations') {
    listEl.innerHTML = data.map(item => {
      const urgency = item.daysOut >= 7 ? 'text-red-600' : item.daysOut >= 3 ? 'text-amber-600' : 'text-gray-500';
      return `
        <div class="flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition cursor-pointer"
          onclick="navigate('advances')">
          <div>
            <div class="text-sm font-bold text-gray-700">${item.requestedBy || '—'}</div>
            <div class="text-xs text-gray-500 truncate max-w-[200px]">${item.description || '—'} · ${formatAuditorDate(item.date)}</div>
          </div>
          <div class="text-right">
            <div class="font-mono font-bold text-sm text-gray-800">${fmt(item.amount)}</div>
            <div class="text-[10px] ${urgency} font-mono">${item.daysOut}d outstanding</div>
          </div>
        </div>`;
    }).join('');
    return;
  }

  // pendingAudit, flaggedDays, recentClosed
  listEl.innerHTML = data.map(item => {
    const v = item.variance || 0;
    const vColor = v < -0.01 ? 'text-red-600' : v > 0.01 ? 'text-blue-600' : 'text-gray-400';
    const actionBtn = key === 'pendingAudit'
      ? `<button onclick="goAuditDate('${item.date}')"
           class="text-[10px] font-bold px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded-lg transition">
           Review →
         </button>`
      : key === 'flaggedDays'
      ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-600">Waiting cashier</span>`
      : `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-green-100 text-green-600">Closed</span>`;

    return `
      <div class="flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition">
        <div>
          <div class="text-sm font-bold text-gray-700">${formatAuditorDate(item.date)}</div>
          <div class="text-xs text-gray-500 font-mono">
            Exp: ${fmt(item.expenses)} · Closing: ${fmt(item.closing)}
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span class="font-mono text-xs font-bold ${vColor}">${v >= 0 ? '+' : ''}${fmt(v)}</span>
          ${actionBtn}
        </div>
      </div>`;
  }).join('');
}

function goAuditDate(date) {
  const picker = document.getElementById('globalDate');
  if (picker) { picker.value = date; onDateChange(); }
  navigate('auditreview');
}

function formatAuditorDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
}
