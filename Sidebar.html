<!-- SIDEBAR -->
<aside id="sidebar" class="w-64 bg-white shadow-md flex-col z-30 transition-transform duration-300 absolute md:relative h-full transform -translate-x-full md:translate-x-0 border-r border-gray-200 flex">
  <!-- Logo -->
  <div class="p-6 border-b border-gray-200">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-green-300 rounded-lg flex items-center justify-center text-white text-xl shadow-sm">💵</div>
      <div>
        <div class="text-lg font-bold text-gray-800 font-display leading-tight">Petty Cash</div>
        <div class="text-[10px] text-gray-500 font-mono tracking-wider uppercase">Management System</div>
      </div>
    </div>
  </div>

  <!-- Nav -->
  <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
    
    <!-- Date Picker for Audit/History -->
    <div class="px-3 pb-4 mb-2 border-b border-gray-100">
       <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider font-mono mb-2">Select Date To Audit</label>
       <div class="relative flex items-center">
         <span class="absolute left-3 text-gray-400 text-xs pointer-events-none">📅</span>
         <input type="date" id="globalDate" onchange="onDateChange()" class="w-full text-xs p-2 pl-8 border border-gray-200 rounded-lg bg-gray-50 focus:bg-white focus:border-blue-500 outline-none transition shadow-sm text-gray-700 font-medium">
       </div>
    </div>

    <div class="px-3 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider font-mono">Main</div>
    
    <button onclick="navigate('dashboard')" class="nav-item w-full flex items-center px-3 py-2 text-sm font-medium rounded-md group text-green-600 bg-green-50" data-page="dashboard">
      <span class="mr-3 text-lg">📊</span>
      <span>Dashboard</span>
    </button>
    
    <button onclick="navigate('entries')" class="nav-item w-full flex items-center px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50 hover:text-gray-900 group" data-page="entries">
      <span class="mr-3 text-lg">📝</span>
      <span>Entries</span>
    </button>
    
    <button onclick="navigate('denominations')" class="nav-item w-full flex items-center px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50 hover:text-gray-900 group" data-page="denominations">
      <span class="mr-3 text-lg">💰</span>
      <span>Denominations</span>
    </button>

    <button onclick="navigate('advances')" class="nav-item w-full flex items-center px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50 hover:text-gray-900 group" data-page="advances">
      <span class="mr-3 text-lg">💳</span>
      <span>Cash Advances</span>
      <span id="advances-badge" class="hidden ml-auto bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full"></span>
    </button>

    <button onclick="navigate('replenishment')" class="nav-item w-full flex items-center px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50 hover:text-gray-900 group" data-page="replenishment">
      <span class="mr-3 text-lg">🔄</span>
      <span>Replenishment</span>
    </button>

    <button onclick="navigate('filing')" class="nav-item w-full flex items-center px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50 hover:text-gray-900 group" data-page="filing">
      <span class="mr-3 text-lg">📂</span>
      <span>Filing Checklist</span>
      <span id="filing-badge" class="hidden ml-auto bg-amber-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full"></span>
    </button>

    <div class="px-3 py-2 mt-4 text-[10px] font-bold text-gray-400 uppercase tracking-wider font-mono">Reports</div>

    <button onclick="navigate('report')" class="nav-item w-full flex items-center px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50 hover:text-gray-900 group" data-page="report">
      <span class="mr-3 text-lg">📋</span>
      <span>Daily Report</span>
    </button>

    <button onclick="navigate('auditlog')" id="nav-auditlog"
      class="nav-item hidden w-full flex items-center px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50 hover:text-gray-900 group" data-page="auditlog">
      <span class="mr-3 text-lg">🔎</span>
      <span>Audit Log</span>
    </button>
  </nav>

  <!-- Sidebar Footer -->
  <div class="p-4 border-t border-gray-200 bg-gray-50">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold border border-blue-200 shrink-0">
        👤
      </div>
      <div class="overflow-hidden flex-1 min-w-0">
        <div class="flex items-center gap-1.5 mb-0.5">
          <span id="user-role-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">...</span>
        </div>
        <div class="text-xs font-semibold text-gray-800 truncate" id="user-name">Loading...</div>
        <div class="text-[10px] text-gray-400 truncate" id="user-email">Loading...</div>
      </div>
    </div>
  </div>
</aside>
