<!-- SIDEBAR -->
<aside id="sidebar" class="w-64 bg-white shadow-[4px_0_24px_rgba(0,0,0,0.08)] flex-col transition-transform duration-300 absolute md:relative h-full transform -translate-x-full md:translate-x-0 border-r border-gray-100 flex text-slate-700" style="z-index:50;">
  <!-- Logo -->
  <div class="p-6 border-b border-gray-200">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-green-300 rounded-lg flex items-center justify-center text-white text-xl shadow-sm">💵</div>
      <div>
        <div class="text-lg font-bold text-gray-800 font-display leading-tight">Petty Cash</div>
        <div class="text-[10px] text-gray-500 font-mono tracking-wider uppercase">Management System</div>
      </div>
    </div>
  </div>

  <!-- Nav -->
  <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
    
    <!-- Date Picker for Audit/History -->
    <div class="px-3 pb-4 mb-2 border-b border-gray-100">
       <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider font-mono mb-2">Select Date To Audit</label>
       <div class="relative flex items-center">
         <span class="absolute left-3 text-gray-400 text-xs pointer-events-none">📅</span>
         <input type="date" id="globalDate" onchange="onDateChange()" class="w-full text-xs p-2 pl-8 border border-gray-200 rounded-lg bg-gray-50 focus:bg-white focus:border-blue-500 outline-none transition shadow-sm text-gray-700 font-medium">
       </div>
    </div>

    <div class="px-3 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider font-mono">Main</div>
    
    <button onclick="navigate('dashboard')" class="nav-item w-full flex items-center px-3 py-3 text-sm font-medium rounded-md group bg-gradient-to-r from-indigo-50 to-purple-50/50 text-indigo-700 shadow-sm border border-indigo-100/50 min-h-[44px]" data-page="dashboard">
      <span class="mr-3 text-lg">📊</span>
      <span>Dashboard</span>
    </button>
    <button onclick="navigate('entries')" id="nav-entries" class="nav-item hidden w-full flex items-center px-3 py-3 text-sm font-medium text-slate-600 border border-transparent hover:bg-slate-100/50 hover:text-slate-900 rounded-md group min-h-[44px]" data-page="entries">
      <span class="mr-3 text-lg">📝</span>
      <span>Entries</span>
    </button>

    <button onclick="navigate('denominations')" id="nav-denominations" class="nav-item hidden w-full flex items-center px-3 py-3 text-sm font-medium text-slate-600 border border-transparent hover:bg-slate-100/50 hover:text-slate-900 rounded-md group min-h-[44px]" data-page="denominations">
      <span class="mr-3 text-lg">💰</span>
      <span>Denominations</span>
    </button>

    <button onclick="navigate('requests')" id="nav-requests" class="nav-item hidden w-full flex items-center px-3 py-3 text-sm font-medium text-slate-600 border border-transparent hover:bg-slate-100/50 hover:text-slate-900 rounded-md group min-h-[44px]" data-page="requests">
      <span class="mr-3 text-lg">📋</span>
      <span>Petty Cash Requests</span>
      <span id="requests-badge" class="hidden ml-auto bg-gradient-to-r from-amber-400 to-orange-500 shadow-sm shadow-amber-200 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full"></span>
    </button>

    <button onclick="navigate('advances')" id="nav-advances" class="nav-item hidden w-full flex items-center px-3 py-3 text-sm font-medium text-slate-600 border border-transparent hover:bg-slate-100/50 hover:text-slate-900 rounded-md group min-h-[44px]" data-page="advances">
      <span class="mr-3 text-lg">💳</span>
      <span>Cash Advances</span>
      <span id="advances-badge" class="hidden ml-auto bg-gradient-to-r from-pink-500 to-rose-500 shadow-sm shadow-rose-200 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full"></span>
    </button>

    <button onclick="navigate('replenishment')" id="nav-replenishment" class="nav-item hidden w-full flex items-center px-3 py-3 text-sm font-medium text-slate-600 border border-transparent hover:bg-slate-100/50 hover:text-slate-900 rounded-md group min-h-[44px]" data-page="replenishment">
      <span class="mr-3 text-lg">🔄</span>
      <span>Replenishment</span>
    </button>

    <button onclick="navigate('replenishrequests')" id="nav-replenishrequests" class="nav-item hidden w-full flex items-center px-3 py-3 text-sm font-medium text-slate-600 border border-transparent hover:bg-slate-100/50 hover:text-slate-900 rounded-md group min-h-[44px]" data-page="replenishrequests">
      <span class="mr-3 text-lg">🔔</span>
      <span>Replenish Requests</span>
      <span id="replenishreq-badge" class="hidden ml-auto bg-gradient-to-r from-red-500 to-rose-500 shadow-sm shadow-rose-200 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full"></span>
    </button>

    <button onclick="navigate('filing')" id="nav-filing" class="nav-item hidden w-full flex items-center px-3 py-3 text-sm font-medium text-slate-600 border border-transparent hover:bg-slate-100/50 hover:text-slate-900 rounded-md group min-h-[44px]" data-page="filing">
      <span class="mr-3 text-lg">📂</span>
      <span>Filing Checklist</span>
      <span id="filing-badge" class="hidden ml-auto bg-gradient-to-r from-amber-400 to-orange-500 shadow-sm shadow-amber-200 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full"></span>
    </button>

    <div class="px-3 py-2 mt-4 text-[10px] font-bold text-slate-400 uppercase tracking-wider font-mono">Reports</div>

    <button onclick="navigate('report')" id="nav-report" class="nav-item hidden w-full flex items-center px-3 py-3 text-sm font-medium text-slate-600 border border-transparent hover:bg-slate-100/50 hover:text-slate-900 rounded-md group min-h-[44px]" data-page="report">
      <span class="mr-3 text-lg">📋</span>
      <span>Daily Report</span>
    </button>

    <button onclick="navigate('summaryreport')" id="nav-summaryreport" class="nav-item hidden w-full flex items-center px-3 py-3 text-sm font-medium text-slate-600 border border-transparent hover:bg-slate-100/50 hover:text-slate-900 rounded-md group min-h-[44px]" data-page="summaryreport">
      <span class="mr-3 text-lg">📊</span>
      <span>Summary Report</span>
    </button>

    <button onclick="navigate('replenishreport')" id="nav-replenishreport" class="nav-item hidden w-full flex items-center px-3 py-3 text-sm font-medium text-slate-600 border border-transparent hover:bg-slate-100/50 hover:text-slate-900 rounded-md group min-h-[44px]" data-page="replenishreport">
      <span class="mr-3 text-lg">📈</span>
      <span>Replenishment Report</span>
    </button>

    <button onclick="navigate('auditreview')" id="nav-auditreview"
      class="nav-item hidden w-full flex items-center px-3 py-3 text-sm font-medium text-slate-600 border border-transparent hover:bg-slate-100/50 hover:text-slate-900 rounded-md group min-h-[44px]" data-page="auditreview">
      <span class="mr-3 text-lg">🔍</span>
      <span>Audit Review</span>
      <span id="audit-review-badge" class="hidden ml-auto bg-gradient-to-r from-amber-400 to-orange-500 shadow-sm shadow-amber-200 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full"></span>
    </button>

    <button onclick="navigate('auditlog')" id="nav-auditlog"
      class="nav-item hidden w-full flex items-center px-3 py-3 text-sm font-medium text-slate-600 border border-transparent hover:bg-slate-100/50 hover:text-slate-900 rounded-md group min-h-[44px]" data-page="auditlog">
      <span class="mr-3 text-lg">🔎</span>

    <!-- Admin-only section (revealed by applyRoleUI for Admins) -->
    <div id="admin-section" class="hidden">
      <div class="px-3 py-2 mt-4 text-[10px] font-bold text-slate-400 uppercase tracking-wider font-mono">Admin</div>

      <button onclick="openDatabaseModal(this)" id="nav-database"
        class="w-full flex items-center px-3 py-3 text-sm font-medium text-slate-600 border border-transparent hover:bg-slate-100/50 hover:text-slate-900 rounded-md group min-h-[44px]">
        <span class="mr-3 text-lg">🗄️</span>
        <span>Database</span>
        <span class="ml-auto text-slate-300 group-hover:text-slate-500 text-xs">↗</span>
      </button>
    </div>
  </nav>

  <!-- Sidebar Footer -->
  <div class="p-4 border-t border-gray-100 bg-white">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-100 to-purple-100 flex items-center justify-center text-indigo-600 font-bold border border-indigo-200/50 shadow-sm shrink-0">
        👤
      </div>
      <div class="overflow-hidden flex-1 min-w-0">
        <div class="flex items-center gap-1.5 mb-0.5">
          <span id="user-role-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/50 text-slate-500 border border-white/60 shadow-sm">...</span>
        </div>
        <div class="text-xs font-semibold text-slate-800 truncate" id="user-name">Loading...</div>
        <div class="text-[10px] text-slate-500 truncate" id="user-email">Loading...</div>
      </div>
    </div>
  </div>
</aside>
