<script>
// =============================================
// ENTRIES + BIR RECEIPT MODAL
// =============================================

let _pendingReceipt = null;

function clearEntryForm() {
  ['entryDesc','entryAmount','entryRequested'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  const cat = document.getElementById('entryCategory');
  if (cat) cat.selectedIndex = 0;
  const typ = document.getElementById('entryType');
  if (typ) typ.value = 'EXPENSE';

  _pendingReceipt = null;
  updateReceiptIndicator();
}

function updateReceiptIndicator() {
  const indicator = document.getElementById('receiptIndicator');
  const addBtn    = document.getElementById('addReceiptBtn');
  if (!indicator || !addBtn) return;

  if (_pendingReceipt) {
    indicator.classList.remove('hidden');
    indicator.classList.add('flex');
    const label = indicator.querySelector('span.flex-1');
    if (label) {
      label.textContent = (_pendingReceipt.supplierName || 'Receipt')
        + '  ·  ' + fmt(_pendingReceipt.grossAmount);
    }
    addBtn.innerHTML = '✏️ Edit Receipt';
    addBtn.className = 'w-full flex items-center justify-center gap-2 px-4 py-2.5 border-2 border-green-400 rounded-lg text-sm font-medium text-green-600 bg-green-50 hover:bg-green-100 transition';
  } else {
    indicator.classList.add('hidden');
    indicator.classList.remove('flex');
    addBtn.innerHTML = '🧾 Add Official Receipt <span class="text-[10px] text-gray-400 ml-1">(optional)</span>';
    addBtn.className = 'w-full flex items-center justify-center gap-2 px-4 py-2.5 border-2 border-dashed border-gray-300 rounded-lg text-sm font-medium text-gray-500 hover:border-green-400 hover:text-green-600 hover:bg-green-50 transition';
  }
}

function removeReceipt() {
  _pendingReceipt = null;
  updateReceiptIndicator();
  toast('Receipt removed', 'warning');
}

function syncReceiptAmount() {
  if (_pendingReceipt) return;
  const amt   = parseFloat(document.getElementById('entryAmount')?.value) || 0;
  const gross = document.getElementById('rcptGross');
  if (gross) gross.value = amt || '';
}

function switchEntryTab(tab) {
  state.entryTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    if (b.dataset.tab === tab) {
      b.classList.remove('text-gray-500','hover:bg-gray-200');
      b.classList.add('bg-white','text-gray-800','shadow-sm','font-bold');
    } else {
      b.classList.remove('bg-white','text-gray-800','shadow-sm','font-bold');
      b.classList.add('text-gray-500','hover:bg-gray-200');
    }
  });
  renderEntries();
}

function syncEntryAmount() {
  if (_pendingReceipt) return; // don't overwrite if receipt already finalized
  const gross   = parseFloat(document.getElementById('rcptGross')?.value) || 0;
  const entryAmt = document.getElementById('entryAmount');
  if (entryAmt && gross) entryAmt.value = gross;
}

async function loadEntries(triggerEl) {
  if (triggerEl) triggerEl.classList.add('animate-spin');
  const res = await callServer('getExpenseEntries', state.currentDate);
  if (triggerEl) triggerEl.classList.remove('animate-spin');
  if (res.success) {
    state.entries = res.data || [];
    renderEntries();
    updateDashStats();
    updateCarriedForwardNotice();
  }
}

function updateCarriedForwardNotice() {
  const notice  = document.getElementById('carriedForwardNotice');
  const textEl  = document.getElementById('carriedForwardText');
  if (!notice || !textEl) return;

  const carried = state.entries.filter(e => e.carriedForward);
  if (carried.length === 0) {
    notice.classList.add('hidden');
    return;
  }

  const total = carried.reduce((s, e) => s + parseFloat(e.amount || 0), 0);
  notice.classList.remove('hidden');
  textEl.textContent =
    `${carried.length} unliquidated advance${carried.length > 1 ? 's' : ''} carried forward — ${fmt(total)} still outstanding`;
}

function entryTypeBadge(type) {
  const map = {
    CASH_ADVANCE : '<span class="inline-flex px-2 py-0.5 rounded text-xs font-bold bg-blue-100 text-blue-800">ADVANCE</span>',
    CASH_OVER    : '<span class="inline-flex px-2 py-0.5 rounded text-xs font-bold bg-emerald-100 text-emerald-800">OVERAGE</span>',
    REPLENISHMENT: '<span class="inline-flex px-2 py-0.5 rounded text-xs font-bold bg-purple-100 text-purple-800">REPLENISH</span>'
  };
  return map[type] || '';
}

function renderEntries() {
  let filtered = state.entries;
  if (state.entryTab === 'withReceipt') filtered = filtered.filter(e => e.hasReceipt && e.type === 'EXPENSE');
  if (state.entryTab === 'noReceipt')   filtered = filtered.filter(e => !e.hasReceipt && e.type === 'EXPENSE');

  const total = filtered
    .filter(e => e.type === 'EXPENSE')
    .reduce((s, e) => s + parseFloat(e.amount || 0), 0);
  document.getElementById('entries-total').textContent = fmt(total);

  const tbody = document.getElementById('entriesBody');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-8 text-center text-gray-400 text-sm italic">No entries found</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(e => {
    const isSpecial   = ['CASH_ADVANCE','CASH_OVER','REPLENISHMENT'].includes(e.type);
    const isCarried   = !!e.carriedForward;
    const isFlagged   = e.status === 'FLAGGED';

    const rowBg = isFlagged
      ? 'bg-red-50 border-l-4 border-red-400'
      : isCarried      ? 'bg-orange-50/60'
      : e.type === 'CASH_OVER'     ? 'bg-emerald-50/40'
      : e.type === 'REPLENISHMENT' ? 'bg-purple-50/40'
      : e.type === 'CASH_ADVANCE'  ? 'bg-blue-50/40'
      : '';

    const carriedBadge = isCarried
      ? '<span class="ml-1 text-[10px] font-bold px-1.5 py-0.5 rounded bg-orange-100 text-orange-700">Carried</span>'
      : '';

    const flaggedBadge = isFlagged
      ? '<div class="mt-1 text-xs text-red-600 font-bold">🚩 Flagged by Auditor' + (e.auditNote ? ': ' + e.auditNote : '') + ' — Please correct this entry.</div>'
      : '';

    const receiptCell = e.hasReceipt
      ? '<button onclick="viewReceipt(\'' + e.id + '\')" class="text-green-600 hover:text-green-800 text-xs font-bold">🧾 View</button>'
      : (isCashier()
          ? '<button onclick="viewReceipt(\'' + e.id + '\')" class="text-gray-400 hover:text-gray-600 text-xs">+ Attach</button>'
          : '<span class="text-gray-300 text-xs">—</span>');

    const actionCell = isCashier() && !isCarried
      ? '<td class="px-4 py-3 text-right opacity-0 group-hover:opacity-100 transition">'
          + '<button onclick="openEditModal(\'' + e.id + '\')" class="text-blue-400 hover:text-blue-600 text-sm mr-2" title="Edit">✏️</button>'
          + '<button onclick="deleteEntry(\'' + e.id + '\')" class="text-red-400 hover:text-red-600 text-sm" title="Delete">🗑️</button>'
        + '</td>'
      : '<td></td>';

    return '<tr class="group hover:bg-gray-50 transition ' + rowBg + '">'
      + '<td class="px-4 py-3">'
        + '<div class="flex items-center gap-1 flex-wrap">'
          + entryTypeBadge(e.type)
          + '<span class="text-sm ' + (isSpecial || isCarried ? 'font-bold text-orange-800' : 'text-gray-800') + '">'
            + e.description
          + '</span>'
          + carriedBadge
        + '</div>'
        + flaggedBadge
        + '<div class="text-xs text-gray-400 mt-0.5">'
          + e.category
          + (e.requestedBy ? ' &bull; By: ' + e.requestedBy : '')
        + '</div>'
      + '</td>'
      + '<td class="px-4 py-3 text-right font-mono ' + (isSpecial || isCarried ? 'text-orange-700' : 'text-gray-700') + '">'
        + fmt(e.amount)
      + '</td>'
      + '<td class="px-4 py-3 text-center">' + receiptCell + '</td>'
      + actionCell;
  }).join('');
}

async function saveEntry() {
  const desc = document.getElementById('entryDesc').value.trim();
  const amt  = parseFloat(document.getElementById('entryAmount').value);
  if (!desc) { toast('Please enter a description', 'warning'); return; }
  if (!amt)  { toast('Please enter an amount', 'warning'); return; }

  const entryData = {
    date       : state.currentDate,
    type       : document.getElementById('entryType').value,
    category   : document.getElementById('entryCategory').value,
    description: desc,
    amount     : amt,
    hasReceipt : !!_pendingReceipt,
    referenceNo: _pendingReceipt ? (_pendingReceipt.receiptNo || '') : '',
    requestedBy: document.getElementById('entryRequested').value.trim(),
    approvedBy : ''
  };

  const btn = document.getElementById('saveEntryBtn');
  btn.disabled    = true;
  btn.textContent = 'Saving...';

  const entryRes = await callServer('saveExpenseEntry', entryData);

  btn.disabled  = false;
  btn.innerHTML = '💾 Save Entry';

  if (!entryRes.success) {
    toast(entryRes.message || 'Save failed', 'error');
    return;
  }

  if (_pendingReceipt && entryRes.id) {
    const rcptRes = await callServer('saveReceiptRecord', {
      ..._pendingReceipt,
      entryId: entryRes.id,
      date   : state.currentDate
    });
    if (rcptRes.success) {
      toast('Entry + receipt saved ✓', 'success');
    } else {
      toast('Entry saved, but receipt failed: ' + (rcptRes.message || ''), 'warning');
    }
  } else {
    toast('Entry saved', 'success');
  }

  clearEntryForm();
  loadEntries();
  loadDayData();
}

async function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  const res = await callServer('deleteExpenseEntry', id);
  if (res.success) { toast('Entry deleted.'); loadEntries(); loadDayData(); }
  else toast('Error deleting.', 'error');
}

async function viewReceipt(entryId) {
  const entry = state.entries.find(e => e.id === entryId);

  // No receipt yet — open modal instantly, no server call needed
  if (!entry || !entry.hasReceipt) {
    openReceiptModal({
      mode       : 'attach',
      entryId    : entryId,
      grossAmount: entry ? entry.amount : 0
    });
    return;
  }

  // Has receipt — fetch existing data to view/edit
  const res = await callServer('getReceiptByEntryId', entryId);
  if (res.success && res.data) {
    openReceiptModal({ mode: 'view', receiptData: res.data });
  } else {
    // Receipt flag set but no record found — fall back to attach mode
    openReceiptModal({
      mode       : 'attach',
      entryId    : entryId,
      grossAmount: entry ? entry.amount : 0
    });
  }
}

// ─────────────────────────────────────────────
// RECEIPT MODAL
// ─────────────────────────────────────────────
let _rCtx = {};

function openReceiptModal(ctx) {
  _rCtx = ctx || {};
  const modal = document.getElementById('receiptModal');
  if (!modal) return;

  ['rcptDate','rcptSupplier','rcptAddress','rcptTin','rcptReceiptNo','rcptGross'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.readOnly = false; el.value = ''; }
  });

  const dateEl  = document.getElementById('rcptDate');
  const grossEl = document.getElementById('rcptGross');
  if (dateEl) dateEl.value = state.currentDate;

  if (ctx.mode === 'new') {
    if (_pendingReceipt) {
      const setV = (id, v) => { const el = document.getElementById(id); if(el) el.value = v || ''; };
      setV('rcptSupplier',  _pendingReceipt.supplierName);
      setV('rcptAddress',   _pendingReceipt.address);
      setV('rcptTin',       _pendingReceipt.tin);
      setV('rcptReceiptNo', _pendingReceipt.receiptNo);
      if (grossEl) grossEl.value = _pendingReceipt.grossAmount || '';
    } else {
      const entryAmt = parseFloat(document.getElementById('entryAmount')?.value) || 0;
      if (grossEl && entryAmt) grossEl.value = entryAmt;
    }
    computeReceiptVAT();
    document.getElementById('receiptModalTitle').textContent = '🧾 Official Receipt Details';
    document.getElementById('receiptSaveBtn').classList.remove('hidden');
    document.getElementById('receiptSaveBtn').innerHTML = '✓ Attach to Entry';
    document.getElementById('receiptSkipBtn').textContent = 'Cancel';

  } else if (ctx.mode === 'attach') {
    if (grossEl) grossEl.value = ctx.grossAmount || '';
    computeReceiptVAT();
    document.getElementById('receiptModalTitle').textContent = '🧾 Attach Receipt';
    document.getElementById('receiptSaveBtn').classList.remove('hidden');
    document.getElementById('receiptSaveBtn').innerHTML = '💾 Save Receipt';
    document.getElementById('receiptSkipBtn').textContent = 'Cancel';

  } else if (ctx.mode === 'view') {
    const d = ctx.receiptData;
    const setV = (id, v) => { const el = document.getElementById(id); if(el) { el.value = v || ''; el.readOnly = true; } };
    setV('rcptDate',      d.date);
    setV('rcptSupplier',  d.supplierName);
    setV('rcptAddress',   d.address);
    setV('rcptTin',       d.tin);
    setV('rcptReceiptNo', d.receiptNo);
    if (grossEl) { grossEl.value = d.grossAmount; grossEl.readOnly = true; }
    computeReceiptVAT();
    document.getElementById('receiptModalTitle').textContent = '🧾 Receipt Details';
    document.getElementById('receiptSaveBtn').classList.add('hidden');
    document.getElementById('receiptSkipBtn').textContent = 'Close';
  }

  modal.classList.remove('hidden');
  if (ctx.mode !== 'view') {
    setTimeout(() => document.getElementById('rcptSupplier')?.focus(), 100);
  }
}

function closeReceiptModal() {
  const modal = document.getElementById('receiptModal');
  if (modal) modal.classList.add('hidden');
  _rCtx = {};
}

// ─────────────────────────────────────────────
// VAT BREAKDOWN — 3 lines only:
//   Gross Amount  (display only)
//   Less: VAT     (= Gross - Gross/1.12)
//   VAT Amount    (= Gross / 1.12)
// Net of VAT removed.
// ─────────────────────────────────────────────
function computeReceiptVAT() {
  const gross     = parseFloat(document.getElementById('rcptGross')?.value) || 0;
  const vatAmount = gross - (gross / 1.12);   // the VAT portion
  const netOfVat  = gross / 1.12;             // amount excluding VAT

  const setT = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = fmt(v); };
  setT('rcptGrossDisplay', gross);     // Gross Amount (display)
  setT('rcptVatAmount',    vatAmount); // Less: VAT (12%)
  setT('rcptVatableSales', netOfVat);  // VAT Amount (net line)
}

async function saveReceiptModal() {
  const supplier = document.getElementById('rcptSupplier')?.value.trim();
  const gross    = parseFloat(document.getElementById('rcptGross')?.value);

  if (!supplier) { toast('Supplier name is required', 'warning'); return; }
  if (!gross)    { toast('Amount is required', 'warning'); return; }

  const receiptData = {
    date        : document.getElementById('rcptDate')?.value || state.currentDate,
    supplierName: supplier,
    address     : document.getElementById('rcptAddress')?.value.trim()   || '',
    tin         : document.getElementById('rcptTin')?.value.trim()       || '',
    receiptNo   : document.getElementById('rcptReceiptNo')?.value.trim() || '',
    grossAmount : gross
  };

  if (_rCtx.mode === 'new') {
    if (typeof _rCtx.onAttach === 'function') {
      _rCtx.onAttach(receiptData);
      closeReceiptModal();
      toast('Receipt attached ✓', 'success');
    } else {
      _pendingReceipt = receiptData;
      updateReceiptIndicator();
      closeReceiptModal();
      toast('Receipt attached — save entry to finalize', 'success');
    }
    return;
  }

  const saveBtn = document.getElementById('receiptSaveBtn');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving...'; }

  const res = await callServer('saveReceiptRecord', {
    ...receiptData,
    entryId: _rCtx.entryId || ''
  });

  if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '💾 Save Receipt'; }

  if (res.success) {
    toast('Receipt saved ✓', 'success');
    closeReceiptModal();
    loadEntries();
  } else {
    toast(res.message || 'Failed to save receipt', 'error');
  }
}

// ─────────────────────────────────────────────
// EDIT MODAL
// ─────────────────────────────────────────────
function openEditModal(id) {
  const entry = state.entries.find(e => e.id === id);
  if (!entry) return;

  document.getElementById('editEntryId').value  = entry.id;
  document.getElementById('editType').value     = entry.type;
  document.getElementById('editCategory').value = entry.category;
  document.getElementById('editDesc').value     = entry.description;
  document.getElementById('editAmount').value   = entry.amount;

  state.editHasReceipt = entry.hasReceipt;
  updateEditReceiptBtn(entry.hasReceipt);
  document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
  document.getElementById('editModal').classList.add('hidden');
}

function updateEditReceiptBtn(hasReceipt) {
  const btn = document.getElementById('editReceiptBtn');
  if (!btn) return;
  if (hasReceipt) {
    btn.innerHTML = '✏️ Edit Official Receipt';
    btn.className = 'w-full flex items-center justify-center gap-2 px-4 py-2.5 border-2 border-green-400 rounded-lg text-sm font-medium text-green-600 bg-green-50 hover:bg-green-100 transition';
  } else {
    btn.innerHTML = '🧾 Add Official Receipt <span class="text-[10px] text-gray-400 ml-1">(optional)</span>';
    btn.className = 'w-full flex items-center justify-center gap-2 px-4 py-2.5 border-2 border-dashed border-gray-300 rounded-lg text-sm font-medium text-gray-500 hover:border-green-400 hover:text-green-600 hover:bg-green-50 transition';
  }
}

async function openEditReceiptModal() {
  const id = document.getElementById('editEntryId').value;
  if (!id) return;
  const entry = state.entries.find(e => e.id === id);
  if (state.editHasReceipt) {
    const res = await callServer('getReceiptByEntryId', id);
    if (res.success && res.data) {
      openReceiptModal({ mode: 'view', receiptData: res.data });
    } else {
      openReceiptModal({ mode: 'attach', entryId: id, grossAmount: entry ? entry.amount : 0 });
    }
  } else {
    openReceiptModal({ mode: 'attach', entryId: id, grossAmount: entry ? entry.amount : 0 });
  }
}

async function updateEntry() {
  const id = document.getElementById('editEntryId').value;
  if (!id) { toast('No entry selected', 'error'); return; }

  const entry = state.entries.find(e => e.id === id);
  const payload = {
    id,
    date       : state.currentDate,
    type       : document.getElementById('editType').value,
    category   : document.getElementById('editCategory').value,
    description: document.getElementById('editDesc').value,
    amount     : parseFloat(document.getElementById('editAmount').value),
    hasReceipt : state.editHasReceipt,
    referenceNo: entry ? (entry.referenceNo || '') : '',
    requestedBy: entry ? (entry.requestedBy || '') : '',
    approvedBy : entry ? (entry.approvedBy  || '') : ''
  };

  const btn = document.querySelector('#editModal button[onclick="updateEntry()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  const res = await callServer('updateExpenseEntry', payload);

  if (btn) { btn.disabled = false; btn.innerHTML = '💾 Save'; }

  if (res.success) {
    toast('Entry updated');
    closeEditModal();
    loadEntries();
    loadDayData();
  } else {
    toast(res.message || 'Update failed', 'error');
  }
}
</script>
